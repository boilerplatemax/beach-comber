  :root {
    --bg: #0e1418;
    --ink: #ecdfc4;           /* warm pale sand — primary text, never pure white */
    --ink-dim: #b7b196;       /* muted labels */
    --ink-shadow: #0c1210;    /* subtle shadow in a darker palette shade */
    --panel: rgba(20,32,34,.94);
    --panel-lit: rgba(32,50,52,.96);
    --panel-edge: rgba(10,20,22,.96);
    --facet: linear-gradient(150deg, var(--panel-lit) 0 46%, var(--panel) 46% 100%);
    --accent: #2b6f78; --accent-lit: #3f9aa5;
    --chamfer: 9px;
    --ui: "Chakra Petch", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--ui); color: var(--ink); text-shadow: 0 1px 2px var(--ink-shadow); letter-spacing: .01em; }
  #gl { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: pixelated; }
  /* §12A chamfered, faceted panels & buttons — cut from the same geometry as the world */
  .chamfer { clip-path: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--chamfer)); }

  /* Overlay / title (§12A) */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: radial-gradient(150% 130% at 50% 30%, rgba(14,26,32,0.25), rgba(8,12,16,0.72));
    z-index: 10; transition: opacity .5s ease; padding: 24px 16px;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #wordmark { width: min(680px, 92vw); height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
  #islandName { font-size: clamp(16px, 2.6vw, 22px); font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  #titlemenu { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(340px, 90vw); }
  .menucol { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .menucol button { width: 100%; font-size: 16px; padding: 13px 22px; }
  .seedrow { display: flex; align-items: center; gap: 8px; width: 100%; }
  .seedrow label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  #seedInput { flex: 1; font: 600 14px var(--ui); letter-spacing: .06em; color: var(--ink); padding: 9px 12px;
    background: var(--panel-edge); border: none; text-shadow: 0 1px 1px var(--ink-shadow);
    clip-path: polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px); }
  #seedInput:focus { outline: none; background: rgba(8,16,18,.98); }
  #diceBtn { padding: 9px 13px; font-size: 18px; line-height: 1; }
  #recentWrap { width: 100%; margin-top: 4px; }
  .reclabel { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 7px; }
  #recentList { display: flex; flex-direction: column; gap: 6px; }
  .recitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer;
    font-size: 13px; padding: 8px 12px; background: var(--facet); text-align: left; letter-spacing: .02em;
    clip-path: polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px); }
  .recitem:hover { filter: brightness(1.2); }
  .recitem .pct { font-size: 12px; color: var(--accent-lit); font-weight: 600; }
  .recitem.empty { justify-content: center; color: var(--ink-dim); cursor: default; }
  .recitem.empty:hover { filter: none; }
  #settingspanel { position: fixed; z-index: 14; display: none; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(340px, 92vw); max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain; background: var(--facet); padding: 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    clip-path: polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px); }
  #settingspanel h3 { font-size: 18px; letter-spacing: .04em; margin-bottom: 14px; }
  #settingspanel h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin: 16px 0 8px; font-weight: 600; }
  #settingspanel .spresets { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
  #settingspanel .spreset { flex: 1; min-width: 52px; font-size: 11.5px; padding: 7px 4px; cursor: pointer; opacity: .7;
    border: none; background: var(--panel-edge); color: var(--ink);
    clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px); }
  #settingspanel .spreset.on { opacity: 1; background: var(--facet); color: #ffe6b0; box-shadow: inset 0 0 0 1px rgba(255,220,150,.5); }
  #settingspanel .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 11px 0; font-size: 13px; }
  #settingspanel .srow button { min-width: 64px; font-size: 12px; padding: 6px 12px; }
  #settingspanel label { font-size: 13px; letter-spacing: .02em; color: var(--ink); }
  #settingspanel input[type=range] { width: 130px; }
  #settingspanel .closebtn { width: 100%; margin-top: 14px; }
  /* §tools settings split into tabbed categories (chamfered) */
  #settingspanel .stabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; }
  #settingspanel .stab { flex: 1 1 auto; min-width: 54px; font-size: 11px; letter-spacing: .02em; padding: 7px 3px; cursor: pointer; opacity: .62;
    border: none; background: var(--panel-edge); color: var(--ink);
    clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px); }
  #settingspanel .stab.on { opacity: 1; background: var(--facet); color: #ffe6b0; box-shadow: inset 0 0 0 1px rgba(255,220,150,.5); }
  /* §2 unified menu tab-bar (Satchel / Bucket / Journal), floats above whichever panel is open */
  #menutabs { position: fixed; z-index: 26; left: 50%; top: 14px; transform: translateX(-50%); display: none; gap: 8px; }
  #menutabs.show { display: flex; }
  #menutabs .mtb { font: inherit; font-size: 14px; font-weight: 650; letter-spacing: .04em; padding: 9px 20px; cursor: pointer;
    border: none; background: var(--panel-edge); color: var(--ink); opacity: .74;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  #menutabs .mtb.on { opacity: 1; background: var(--facet); color: #ffe6b0; box-shadow: 0 4px 16px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,220,150,.55); }
  #menutabs .mtb:hover { opacity: 1; }
  /* §2 pause menu (Esc) — chamfered panel */
  #pausemenu { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;

  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {

  /* HUD */
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 5; pointer-events: none;

  }
  #tidecurve {

    opacity: .82; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  /* §Cooking hunger — five faceted scallop shells, drained left-to-right */
  #hungershells {
    position: fixed; left: 12px; bottom: 128px; z-index: 5; pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); display: none;
  }
  #dbg {
    position: fixed; left: 12px; top: 12px; z-index: 5; pointer-events: none;

  /* creature/find name card */
  #card {
    position: fixed; left: 50%; bottom: 20%; transform: translateX(-50%);

  }
  @keyframes cardIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  /* interaction indicator: a tiny dot that blooms into a soft-pulsing ring (§11.2) */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,.55); z-index: 5; pointer-events: none;
    box-shadow: 0 0 2px rgba(0,0,0,.6); display: none; transition: width .12s ease, height .12s ease, margin .12s ease, background .12s ease, border-color .12s ease;
  }
  #crosshair.ring {
    width: 16px; height: 16px; margin: -9px 0 0 -9px; background: transparent;
    border: 2px solid rgba(255,238,200,.95); box-shadow: 0 0 6px rgba(255,220,150,.55), inset 0 0 3px rgba(0,0,0,.35);
    animation: crosspulse 1.15s ease-in-out infinite;
  }

  #stamina {

    -webkit-mask: radial-gradient(transparent 13px, #000 14px); mask: radial-gradient(transparent 13px, #000 14px);
  }
  /* hunger: a smaller arc concentric with the stamina ring, only at Hungry or worse (§11.2) */
  #hungerArc {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; z-index: 4; pointer-events: none; display: none; opacity: .9;
    -webkit-mask: radial-gradient(transparent 7px, #000 8px); mask: radial-gradient(transparent 7px, #000 8px);
  }
  /* §14A breath: an arc outside the stamina ring, only while submerged */
  #breathArc {
    position: fixed; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; z-index: 4; pointer-events: none; display: none; opacity: .92;
    -webkit-mask: radial-gradient(transparent 20px, #000 21px); mask: radial-gradient(transparent 20px, #000 21px);
  }
  /* §14A fade-to-black on drowning */

  #prompt {
    position: fixed; left: 50%; top: calc(50% + 20px); transform: translateX(-50%);

  /* toasts (bottom-left, above hud) */

    z-index: 8; display: flex; gap: 6px; pointer-events: auto; padding: 7px 10px 9px;

  /* the satchel */

  #invpanel { position: fixed; z-index: 13; display: none; left: 50%; top: 50%; transform: translate(-50%,-50%);

  /* §12C storage box stash (reuses satchel slot styling) */

    background-color: #6a4e30; box-shadow: 0 8px 30px rgba(0,0,0,.6), inset 0 0 40px rgba(40,24,10,.5);
    clip-path: polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px); }

<script>
"use strict";
/* ===================================================================== *
 *  BEACHCOMBER  —  Milestone 2  (the "vibe engine")
 *  Low-res FBO + nearest upscale · Bayer dither + palette quantization
 *  View-ray sky gradient · distance fog · animated ocean w/ foam.
 *  Raw WebGL2, no libraries, no asset files.
 * ===================================================================== */

/* --------------------------------------------------------------------- *
 * § PRNG  (one seeded stream for ALL procedural generation)
 * --------------------------------------------------------------------- */

// xmur3: hash an arbitrary string into a well-mixed 32-bit integer seed.
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}

// mulberry32: tiny, fast, deterministic PRNG. Returns floats in [0,1).
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Resolve the seed: read ?seed=, or mint one (crypto entropy, not the stream)
// and write it back to the URL so the island can be shared.
function resolveSeed() {
  const params = new URLSearchParams(location.search);
  let seedStr = params.get("seed");
  if (!seedStr) {
    const buf = new Uint32Array(2);
    crypto.getRandomValues(buf);
    seedStr = (buf[0] >>> 0).toString(36) + (buf[1] >>> 0).toString(36);
    params.set("seed", seedStr);
    history.replaceState(null, "", location.pathname + "?" + params.toString());
  }
  return seedStr;
}

const SEED_STR = resolveSeed();
const SEED_INT = xmur3(SEED_STR)();
const rng = mulberry32(SEED_INT);   // <-- the single shared stream

// Convenience: a fresh independent sub-stream seeded from the main stream,
// so each generator can be reordered later without disturbing the others.
function subStream() { return mulberry32((rng() * 4294967296) >>> 0); }

/* --------------------------------------------------------------------- *
 * § NOISE  (seeded value noise + fbm)
 * --------------------------------------------------------------------- */

function makeNoise(rand) {
  // Permutation table + per-lattice random values, both seeded.
  const perm = new Uint8Array(512);
  const vals = new Float32Array(256);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {           // Fisher–Yates shuffle
    const j = (rand() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) vals[i] = rand();

  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (ix, iy) => perm[(ix + perm[iy & 255]) & 255];

  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fade(fx), uy = fade(fy);
    const v00 = vals[hash(ix,     iy)];
    const v10 = vals[hash(ix + 1, iy)];
    const v01 = vals[hash(ix,     iy + 1)];
    const v11 = vals[hash(ix + 1, iy + 1)];
    return lerp(lerp(v00, v10, ux), lerp(v01, v11, ux), uy); // [0,1]
  }

  // Fractal Brownian motion: summed octaves, normalized to [0,1].
  function fbm(x, y, octaves, lacunarity, gain) {
    let amp = 0.5, freq = 1.0, sum = 0, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += amp * noise2(x * freq, y * freq);
      norm += amp;
      amp *= gain;
      freq *= lacunarity;
    }
    return sum / norm;
  }

  return { noise2, fbm };
}

/* --------------------------------------------------------------------- *
 * § WORLD CONFIG
 * --------------------------------------------------------------------- */

const GRID = 384;             // heightmap resolution (GRID x GRID)
const WORLD = 1200.0;         // island spans WORLD world-units (big, so you feel small)
const HALF = WORLD * 0.5;
const CELL = WORLD / (GRID - 1);
const SEA_LEVEL = 0.0;        // water sits at y = 0

/* --------------------------------------------------------------------- *
 * § TERRAIN CHARACTER  (every seed is unique: it sets continuous shaping
 *   parameters, then a stack of noise fields — domain warp for organic
 *   shapes, a macro field that patchworks plains vs. mountains, ridged
 *   multifractal for sharp peaks & rock formations, rolling fbm hills, and
 *   basin/pool noise for inland lakes, lagoons & tide pools. A tidal-shelf
 *   profile keeps wide gentle intertidal margins near the waterline.)
 * --------------------------------------------------------------------- */

// A light flavour label (kept for the HUD / future content hooks).
const CHARACTER = (function (r) {
  const x = r();                         // FIRST draw from the stream
  if (x < 0.30) return "lowlands";
  if (x < 0.68) return "highlands";
  if (x < 0.88) return "peaks";
  return "atoll";
})(rng);

// Continuous, seed-jittered parameters — no two islands are shaped alike.
const AP = (function (r, ch) {
  const gentle = ch === "lowlands", big = ch === "peaks", atoll = ch === "atoll";
  return {
    character:  ch,
    warp:       0.05 + 0.10 * r(),        // domain-warp strength (organic shapes)
    coastWarp:  0.22 + 0.34 * r(),        // coastline irregularity (bays/capes)
    coastInner: 0.28 + 0.14 * r(),        // full-land radius
    coastOuter: 0.60 + 0.16 * r(),        // where land fades into sea
    baseAmp:    0.10 + 0.12 * r(),        // gentle land body above the shelf
    hillFreq:   2.4 + 2.2 * r(),          // rolling-hill scale
    ridgeFreq:  1.4 + 1.8 * r(),          // mountain-ridge scale

const SEA_THRESH = 0.16;     // elevation field value that maps to the waterline
const SHELF_POW = 1.7;       // >1 flattens near shore → wide tidal margins, but

const heightmap = new Float32Array(GRID * GRID);   // base generated terrain (never mutated by play)
const dig = new Float32Array(GRID * GRID);    // digging offset layer; +spoil / -holes (heals back)

const MAT = { NATURAL: 0, GRASS: 1, DIRT: 2, SAND: 3, GRAVEL: 4, STONE: 5, MUD: 6 };
const MAT_NAME = ["natural", "grass", "dirt", "sand", "gravel", "stone", "mud"];

function buildHeightmap() {
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const u = x / (GRID - 1);
      const v = z / (GRID - 1);

      // Domain warp → organic, non-radial shapes (peninsulas, inlets).
      const wu = u + (nWarpX.fbm(u * 1.6, v * 1.6, 4, 2, 0.5) - 0.5) * AP.warp;
      const wv = v + (nWarpY.fbm(u * 1.6 + 3.1, v * 1.6 + 1.7, 4, 2, 0.5) - 0.5) * AP.warp;

      // Irregular coastline → island mask (1 inland … 0 open sea).
      const dx = u - 0.5, dz = v - 0.5;
      let d = Math.sqrt(dx * dx + dz * dz) * 2.0;
      d += (nCoast.fbm(u * 2.2, v * 2.2, 4, 2, 0.5) - 0.5) * AP.coastWarp;
      const land = smoothstep(AP.coastOuter, AP.coastInner, d);   // reversed → 1 inside

      // Relief: rolling hills + ridged mountains, patch-worked by a macro field
      // so each island has its own layout of plains, ranges and rock formations.
      const macro = nMacro.fbm(wu * AP.macroFreq, wv * AP.macroFreq, 3, 2, 0.5);
      const mtnMask = smoothstep(AP.ridgeLo, AP.ridgeLo + 0.26, macro);
      const rolling = nHills.fbm(wu * AP.hillFreq, wv * AP.hillFreq, 6, 2, 0.5);
      const ridges = ridgedMF(nRidge, wu * AP.ridgeFreq, wv * AP.ridgeFreq, 5);
      const relief = rolling * 0.45 + mtnMask * ridges * AP.mtn;

      // Elevation field: highest inland, tapering to the coast.
      const elev = land * (AP.baseAmp + relief);

      // Tidal-shelf profile → wide gentle intertidal margins, real relief inland.
      const e0 = elev - SEA_THRESH;
      let height = Math.sign(e0) * Math.pow(Math.abs(e0), SHELF_POW) * AP.heightScale;

      // Inland bodies of water: carve basins (lakes / lagoons) where basin noise
      // is low — the global water plane fills anything below sea level.
      const basin = nBasin.fbm(wu * AP.lakeFreq, wv * AP.lakeFreq, 4, 2, 0.5);
      const lake = smoothstep(0.46, 0.30, basin) * land * AP.lakeAmt;
      height -= lake * AP.lakeDepth;

      // Tide pools: fine dimples in the intertidal band (height near the shore).
      const band = 1.0 - smoothstep(0.0, 4.0, Math.abs(height - 0.5));
      const pool = nPool.fbm(u * AP.poolFreq, v * AP.poolFreq, 3, 2, 0.5);
      height -= band * smoothstep(0.58, 0.72, pool) * 2.4;

      // Sandbars & tidal channels: alternating ridges/troughs across the wide
      // intertidal band so a falling tide drains through the channels first (§B).
      const barBand = 1 - smoothstep(0, 9, Math.abs(height));
      const barPhase = d * AP.barFreq + (nBar.fbm(wu * 2.6, wv * 2.6, 3, 2, 0.5) - 0.5) * 1.6;
      height += barBand * Math.sin(barPhase * 6.2831853) * AP.barAmp;

      // Deepen toward open sea so the island reads as surrounded (and bounds you).
      height -= smoothstep(AP.coastInner, 1.5, d) * 14.0;

      // Causeway + small islet, walkable only at low tide, on some seeds (§B).
      if (CAUSEWAY.has) {

        const along = smoothstep(HALF * 0.26, HALF * 0.33, proj) * (1 - smoothstep(isletR - 8, isletR + 6, proj));

// Bilinear height query (fast, used for generation / placement).

    _surf.h = -8.0; _surf.nx = 0; _surf.ny = 1; _surf.nz = 0; _surf.slope = 0;
    return _surf;

  const fx = gx - x0, fz = gz - z0;
  const i00 = z0 * GRID + x0, i10 = i00 + 1, i01 = i00 + GRID, i11 = i01 + 1;
  const h00 = heightmap[i00] + dig[i00] + built[i00], h10 = heightmap[i10] + dig[i10] + built[i10];

    h = h00 + (h10 - h00) * fx + (h01 - h00) * fz;
    e1x = CELL; e1y = h10 - h00; e1z = 0;  e2x = 0; e2y = h01 - h00; e2z = CELL;

    h = h10 + (fx + fz - 1) * (h11 - h10) + (1 - fx) * (h01 - h10);
    e1x = 0; e1y = h11 - h10; e1z = CELL;  e2x = -CELL; e2y = h01 - h10; e2z = CELL;

  _surf.slope = Math.acos(Math.max(-1, Math.min(1, ny)));

/* --------------------------------------------------------------------- *
 * § BASINS  (Priority-Flood → "filled" DEM: the level at which each cell
 *   connects to the open sea. filled>terrain ⇒ a depression that holds a
 *   tide pool up to its rim when the sea drops below it. Also extracts
 *   discrete pools for seeding contents and the debug view.)
 * --------------------------------------------------------------------- */

const filled = new Float32Array(GRID * GRID);
let pools = [];     // { cx, cz, rim, floor, n, x, z }  (world-space centroid)

function computeBasins() {
  const N = GRID * GRID;
  for (let i = 0; i < N; i++) filled[i] = Infinity;
  const done = new Uint8Array(N);
  const hl = new Float64Array(N + 1), hi = new Int32Array(N + 1);
  let hn = 0;
  const push = (l, i) => {
    hn++; hl[hn] = l; hi[hn] = i; let c = hn;
    while (c > 1) { const p = c >> 1; if (hl[p] <= hl[c]) break; [hl[p],hl[c]]=[hl[c],hl[p]]; [hi[p],hi[c]]=[hi[c],hi[p]]; c = p; }
  };
  const pop = () => {
    const i = hi[1]; hl[1] = hl[hn]; hi[1] = hi[hn]; hn--; let c = 1;
    while (true) { let m = c, l = c*2, r = c*2+1;
      if (l <= hn && hl[l] < hl[m]) m = l; if (r <= hn && hl[r] < hl[m]) m = r;
      if (m === c) break; [hl[m],hl[c]]=[hl[c],hl[m]]; [hi[m],hi[c]]=[hi[c],hi[m]]; c = m; }
    return i;
  };
  for (let z = 0; z < GRID; z++)            // seed the map border
    for (let x = 0; x < GRID; x++) {
      if (x === 0 || z === 0 || x === GRID-1 || z === GRID-1) {
        const i = z*GRID+x; filled[i] = heightmap[i]; done[i] = 1; push(filled[i], i);
      }

  const nb = [-1, 1, -GRID, GRID];
  while (hn > 0) {
    const c = pop(), lvl = filled[c], cx = c % GRID, cz = (c / GRID) | 0;
    for (let k = 0; k < 4; k++) {
      const nx = cx + (k===0?-1:k===1?1:0), nz = cz + (k===2?-1:k===3?1:0);
      if (nx < 0 || nz < 0 || nx >= GRID || nz >= GRID) continue;
      const ni = c + nb[k];
      if (done[ni]) continue;
      filled[ni] = Math.max(heightmap[ni], lvl);
      done[ni] = 1; push(filled[ni], ni);
    }
  }
  // §12A drop any trapped water sitting above the shore band — tide pools and seeping
  // water belong in the intertidal / shore zone, never as ponds up the mountain.
  for (let i = 0; i < N; i++) if (heightmap[i] > SHORE_WATER_MAX) filled[i] = heightmap[i];
  extractPools();
}

// Group depression cells into discrete pools (small, coastal-ish ones).
function extractPools() {
  pools = [];
  const N = GRID * GRID, seen = new Uint8Array(N), EPS = 0.25;
  const stack = [];
  for (let s = 0; s < N; s++) {
    if (seen[s] || filled[s] <= heightmap[s] + EPS) continue;
    // BFS this connected depression
    stack.length = 0; stack.push(s); seen[s] = 1;
    let n = 0, sx = 0, sz = 0, rim = -Infinity, floor = Infinity;
    while (stack.length) {
      const c = stack.pop(), cx = c % GRID, cz = (c / GRID) | 0;
      n++; sx += cx; sz += cz;
      rim = Math.max(rim, filled[c]); floor = Math.min(floor, heightmap[c]);
      const ns = [c-1, c+1, c-GRID, c+GRID];
      for (let k = 0; k < 4; k++) {
        const ni = ns[k];
        if (ni < 0 || ni >= N || seen[ni]) continue;
        const nx = ni % GRID;
        if (k === 0 && nx === GRID-1) continue;      // wrap guard
        if (k === 1 && nx === 0) continue;
        if (filled[ni] > heightmap[ni] + EPS) { seen[ni] = 1; stack.push(ni); }
      }
    }
    if (n < 4 || n > 2500) continue;                 // skip specks & big lakes
    if (rim - floor < 0.5) continue;
    const mx = (sx / n) * CELL - HALF, mz = (sz / n) * CELL - HALF;
    pools.push({ x: mx, z: mz, rim, floor, n });
  }
}

function buildFilledTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, filled);
  const hf = floatLinear ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

  onGoat = () => SND.play("goat_bleat");

/* ---- tide events (§C): each high tide rolls what the next low washes up ---- */
const TIDE_EVENTS = [
  { id: "calm", w: 50 }, { id: "storm", w: 14 }, { id: "kelp", w: 12 }, { id: "stars", w: 8 },
  { id: "jelly", w: 8 }, { id: "driftseed", w: 6 }, { id: "floats", w: 3 }, { id: "oddity", w: 1 },
];
const EVENT_LABEL = { calm: "A calm tide", storm: "A storm surge", kelp: "A kelp storm", stars: "A sea-star stranding",
  jelly: "A jellyfish bloom", driftseed: "A drift-seed day", floats: "Glass floats washed in", oddity: "Something rare washed in" };
let nextEvent = "calm", currentEvent = "calm", eventRolled = false, starsRescued = 0, carryingStars = 0;
function rollTideEvent() { let tot = 0; for (const e of TIDE_EVENTS) tot += e.w; let x = rng() * tot; for (const e of TIDE_EVENTS) { x -= e.w; if (x <= 0) return e.id; } return "calm"; }
// Storminess 0..1 to telegraph an approaching storm/kelp wash through sky + surf (no UI text).
function eventMood() {

}

/* ===================================================================== *
 * § 20  WEATHER — one state per in-game day, rolled deterministically from
 *   the seed, with smooth transitions. Drives fog, light, wind, waves, rain,
 *   storms, after-storm wash-up, and light gameplay effects. Never damages.
 * ===================================================================== */
const WEATHER_STATES = ["clear", "overcast", "fog", "rain", "storm"];
// §20 odds per in-game day (sum = 1.00). Clear is most common; storm is rare.
const WEATHER_ODDS = { clear: 0.46, overcast: 0.22, fog: 0.12, rain: 0.15, storm: 0.05 };
// per-state targets the live params ease toward (wind 0..1, rain 0..1, fog 0..1, dim 0..1, wave multiplier)
const WEATHER_PARAMS = {
  clear:    { wind: 0.15, rain: 0,    fog: 0.00, dim: 0.00, wave: 1.00 },
  overcast: { wind: 0.30, rain: 0,    fog: 0.10, dim: 0.26, wave: 1.10 },
  fog:      { wind: 0.10, rain: 0,    fog: 1.00, dim: 0.16, wave: 0.95 },
  rain:     { wind: 0.50, rain: 0.65, fog: 0.28, dim: 0.40, wave: 1.28 },
  storm:    { wind: 1.00, rain: 1.00, fog: 0.34, dim: 0.58, wave: 1.75 },
};
const WEATHER_LABEL = { clear: "Clear", overcast: "Overcast", fog: "Fog", rain: "Rain", storm: "Storm" };
const WEATHER_TRANSITION = 55;        // seconds (time-constant) to ease between days' weather — smooth, not instant
const WEATHER_FOG_MAX = 0.019;        // fog density added at fog=1 (thick sea fog)
const WIND_SWAY_MUL = 2.6;            // extra foliage sway per unit wind (uWind = 1 + wind*this)
const STORM_BOLT_MIN = 6, STORM_BOLT_MAX = 16;   // seconds between lightning bolts in a storm
const WEATHER_BITE_MUL = { clear: 1, overcast: 0.75, fog: 0.95, rain: 0.6, storm: 0.5 };   // lower = bites sooner
weather = {
  state: "clear", day: -1, forced: null,
  wind: 0.15, rain: 0, fog: 0, dim: 0, waveMul: 1, windDir: 0.7,     // smoothed live params
  flash: 0, reflashAt: 0, nextBolt: 0, lastStormDay: -99, pendingStormMorning: false,
  wormT: 0,
};
function weatherWindDir(d) { return mulberry32((SEED_INT ^ (Math.imul((d|0) + 7, 0x85ebca6b) >>> 0)) >>> 0)() * 6.2831853; }
function weatherRngForDay(d) { return mulberry32((SEED_INT ^ (Math.imul((d|0) + 1, 0x9e3779b1) >>> 0)) >>> 0); }
function weatherForDay(d) {
  if (weather.forced) return weather.forced;
  let x = weatherRngForDay(d)(), acc = 0;
  for (const s of WEATHER_STATES) { acc += WEATHER_ODDS[s]; if (x < acc) return s; }
  return "clear";
}
function fogDaylightCurve() {   // fog rolls in at dawn & dusk, burns off midday
  const t = timeOfDay, dawn = Math.exp(-Math.pow((t - 0.26) / 0.075, 2)), dusk = Math.exp(-Math.pow((t - 0.80) / 0.075, 2));
  return Math.min(1, dawn + dusk + 0.08);
}
function weatherBiteMul() { return WEATHER_BITE_MUL[weather.state] || 1; }
function onThunder(delay) {   // §20 distant thunder follows the flash after a delay (sound travels)
  if (typeof SND === "undefined") return;
  setTimeout(() => { try { SND.play("thunder", { volume: 0.45 + Math.random()*0.4 }); } catch (e) {} }, Math.max(100, (delay || 1) * 1000));
}
function weatherIsWet() { return weather.state === "rain" || weather.state === "storm"; }
function rainAmt() { return weather.rain; }
function initWeather() {   // set day-0 weather with no transition (no visible blend on load)
  const d = Math.floor(tideDay); weather.day = d; weather.state = weatherForDay(d); weather.windDir = weatherWindDir(d);
  const P = WEATHER_PARAMS[weather.state];
  weather.wind = P.wind; weather.rain = P.rain; weather.dim = P.dim; weather.waveMul = P.wave;
  weather.fog = weather.state === "fog" ? P.fog * fogDaylightCurve() : P.fog;
  if (weather.state === "storm") weather.lastStormDay = d;
  weather.nextBolt = (typeof clock !== "undefined" ? clock.t : 0) + STORM_BOLT_MIN;
  applyWeatherFog();
}
function applyWeatherFog() {
  FOG_DENSITY = baseFogDensity + weather.fog * WEATHER_FOG_MAX;
  FOG_NEAR = baseFogNear * (1 - 0.45 * Math.min(1, weather.fog));
}
function updateLightning(dt) {
  weather.flash = Math.max(0, weather.flash - dt * 3.4);                      // flashes decay fast
  if (weather.reflashAt && clock.t >= weather.reflashAt) { weather.flash = 0.65 + Math.random() * 0.3; weather.reflashAt = 0; }   // the flicker of a bolt
  if (weather.state !== "storm") return;
  if (clock.t >= weather.nextBolt) {
    weather.flash = 0.85 + Math.random() * 0.5;                              // the sky lights up over the sea
    weather.nextBolt = clock.t + STORM_BOLT_MIN + Math.random() * (STORM_BOLT_MAX - STORM_BOLT_MIN);
    if (Math.random() < 0.6) weather.reflashAt = clock.t + 0.08 + Math.random() * 0.12;   // a quick second flicker
    if (typeof onThunder === "function") onThunder(0.5 + Math.random() * 2.0);            // distant thunder follows after a delay (audio hooks)
  }
}
function updateWeather(dt) {
  if (typeof clock === "undefined") return;
  const d = Math.floor(tideDay);
  if (d !== weather.day) {
    const yesterday = weather.state;
    weather.state = weatherForDay(d); weather.windDir = weatherWindDir(d);
    if (weather.day >= 0 && yesterday === "storm" && weather.state !== "storm") weather.pendingStormMorning = true;   // §20 after-storm wash-up
    if (weather.state === "storm") weather.lastStormDay = d;
    weather.day = d;
  }
  const P = WEATHER_PARAMS[weather.state] || WEATHER_PARAMS.clear;
  let fogT = P.fog; if (weather.state === "fog") fogT = P.fog * fogDaylightCurve();
  const s = Math.min(1, dt / WEATHER_TRANSITION);                            // exponential ease toward targets → smooth transitions
  weather.wind    += (P.wind - weather.wind) * s;
  weather.rain    += (P.rain - weather.rain) * s;
  weather.fog     += (fogT   - weather.fog)  * s;
  weather.dim     += (P.dim  - weather.dim)  * s;
  weather.waveMul += (P.wave - weather.waveMul) * s;
  updateLightning(dt);
  applyWeatherFog();
  updateRain(dt);
  if (weather.pendingStormMorning && typeof onStormMorning === "function") { weather.pendingStormMorning = false; onStormMorning(); }
  if (typeof updateWeatherGameplay === "function") updateWeatherGameplay(dt);
}
function forceWeather(state) {   // debug: pin a state (or null to resume the rolled sequence)
  weather.forced = state;
  if (state) { weather.state = state; if (state === "storm") weather.lastStormDay = Math.floor(tideDay); }
  else weather.state = weatherForDay(Math.floor(tideDay));
}
function debugStormMorning() {   // debug: jump to the morning after a storm (the best wash-up)
  weather.lastStormDay = Math.floor(tideDay);
  tideDay = Math.floor(tideDay) + 1; timeOfDay = MORNING_TIME; tideT = 0.1;   // next day, dawn, tide coming up
  weather.forced = null; weather.day = Math.floor(tideDay); weather.state = weatherForDay(weather.day);
  const P = WEATHER_PARAMS[weather.state]; weather.wind = P.wind; weather.rain = P.rain; weather.dim = P.dim; weather.waveMul = P.wave; weather.fog = 0;
  updateSun();
  if (typeof onStormMorning === "function") onStormMorning();
  if (typeof syncDebugPanel === "function") syncDebugPanel();
  showCard("The morning after", "The storm has blown through. See what's washed up along the shore.");
}

/* §20C RAIN — low-poly streaks around the camera, rings on water, dug-hole puddles.
   Wet ground is handled in the terrain shader (uGroundWet). */
const RAIN_MAX = 460, RAIN_BOX = 44, RAIN_H = 16, RING_MAX = 64, RING_SPEED = 1.5, PUDDLE_MAX = 40;
const RING_RATE = 46;                 // rings spawned per second at full rain
let rainDyn = null, ringDyn = null, puddleDyn = null, ringSpawnT = 0;
const rainArr = new Float32Array(RAIN_MAX * 10), ringArr = new Float32Array(RING_MAX * 10), puddleArr = new Float32Array(PUDDLE_MAX * 10);
const rainDrops = [], rainRings = [], weatherPuddles = [];
function streakMesh() { const m = Mesh(), c = [0.8, 0.86, 0.96]; mQuad(m, [-0.018,0,0],[0.018,0,0],[0.018,0.8,0],[-0.018,0.8,0], c); return m; }
function ringMesh() { const m = Mesh(), c = [0.9,0.93,0.97], ri = 0.68, ro = 1.0, sides = 12;
  for (let i=0;i<sides;i++){ const a0=i/sides*6.2832, a1=(i+1)/sides*6.2832;
    mQuad(m, [Math.cos(a0)*ri,0,Math.sin(a0)*ri],[Math.cos(a1)*ri,0,Math.sin(a1)*ri],[Math.cos(a1)*ro,0,Math.sin(a1)*ro],[Math.cos(a0)*ro,0,Math.sin(a0)*ro], c); }
  return m; }
function recordDigHole(x, z) {   // §20 a dug hole can fill with fresh rainwater
  if (!weather) return;
  for (const p of weatherPuddles) if (Math.hypot(p.x-x, p.z-z) < 0.8) { p.r = Math.min(1.1, p.r + 0.08); return; }
  if (weatherPuddles.length >= PUDDLE_MAX) weatherPuddles.shift();
  weatherPuddles.push({ x, z, r: 0.6, fill: weather.rain > 0.1 ? 0.15 : 0, fresh: true });
}
function updateRain(dt) {
  const amt = weather.rain;
  if (amt > 0.02) {
    const n = Math.floor(RAIN_MAX * amt);
    while (rainDrops.length < n) rainDrops.push({ x:(Math.random()-0.5)*RAIN_BOX, y:Math.random()*RAIN_H, z:(Math.random()-0.5)*RAIN_BOX, s:0.5+Math.random() });
    const fall = 15 + weather.wind*12, wdx = Math.sin(weather.windDir)*weather.wind*5, wdz = Math.cos(weather.windDir)*weather.wind*5;
    for (let i=0;i<n;i++){ const d = rainDrops[i]; d.y -= fall*dt; d.x += wdx*dt; d.z += wdz*dt;
      if (d.y < -3){ d.y += RAIN_H+3; d.x = (Math.random()-0.5)*RAIN_BOX; d.z = (Math.random()-0.5)*RAIN_BOX; } }
    ringSpawnT += dt * amt * RING_RATE;
    while (ringSpawnT >= 1) { ringSpawnT -= 1;
      const a = Math.random()*6.2832, rr = 2 + Math.random()*16, x = player.x + Math.cos(a)*rr, z = player.z + Math.sin(a)*rr;
      if (rainRings.length < RING_MAX && waterDepthAt(x, z) > 0.05) rainRings.push({ x, z, t: 0, y: waterSurfaceAt(x, z) }); }
  }
  for (let i=rainRings.length-1;i>=0;i--){ rainRings[i].t += dt*RING_SPEED; if (rainRings[i].t >= 1) rainRings.splice(i,1); }
  for (const p of weatherPuddles) { const target = (amt > 0.12 && surfaceAt(p.x,p.z).h > waterLevel+0.15) ? 1 : 0; p.fill += (target - p.fill) * dt * 0.4; }
}
function drawRain(view) {
  if (!weather) return; const amt = weather.rain;
  if (amt > 0.02 && rainDrops.length) {
    if (!rainDyn) rainDyn = makeDynamic(streakMesh(), RAIN_MAX);
    const n = Math.min(rainDrops.length, Math.floor(RAIN_MAX * amt)), lean = Math.min(0.8, weather.wind*0.6), ld = weather.windDir; let k = 0;
    for (let i=0;i<n;i++){ const d = rainDrops[i], o = k*10;
      rainArr[o]=cam.pos[0]+d.x; rainArr[o+1]=cam.pos[1]+d.y; rainArr[o+2]=cam.pos[2]+d.z; rainArr[o+3]=d.s; rainArr[o+4]=0; rainArr[o+5]=lean; rainArr[o+6]=ld; rainArr[o+7]=1;rainArr[o+8]=1;rainArr[o+9]=1; k++; }
    propUniforms(view); gl.uniform1f(propU.uGhost, 1); gl.uniform3fv(propU.uGhostCol, [0.78,0.84,0.95]); gl.uniform1f(propU.uFogDensity, 0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    if (k) rainDyn.draw(rainArr, k);
    gl.depthMask(true); gl.disable(gl.BLEND); gl.uniform1f(propU.uGhost, 0); gl.uniform1f(propU.uFogDensity, FOG_DENSITY);
  }
  if (rainRings.length) {
    if (!ringDyn) ringDyn = makeDynamic(ringMesh(), RING_MAX); let k = 0;
    for (const r of rainRings){ if (k>=RING_MAX) break; const o = k*10, f = 1-r.t;
      ringArr[o]=r.x; ringArr[o+1]=r.y+0.02; ringArr[o+2]=r.z; ringArr[o+3]=0.08+r.t*0.5; ringArr[o+4]=0;ringArr[o+5]=0;ringArr[o+6]=0; ringArr[o+7]=f;ringArr[o+8]=f;ringArr[o+9]=f; k++; }
    propUniforms(view); gl.uniform1f(propU.uGhost, 1); gl.uniform3fv(propU.uGhostCol, [0.9,0.93,0.97]);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    if (k) ringDyn.draw(ringArr, k);
    gl.depthMask(true); gl.disable(gl.BLEND); gl.uniform1f(propU.uGhost, 0);
  }
  if (weatherPuddles.length) {
