}
function fenceMesh() { const m = Mesh(); mBox(m, 0, 0.45, 0, 0.05, 0.45, 0.05, [0.4, 0.34, 0.26]); return m; }

/* --------------------------------------------------------------------- *
 * § INSTANCED PROP RENDERER  (one draw call per prop type)
 * --------------------------------------------------------------------- */

const propVS = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
uniform float uTime, uSway;      // §14B gentle current sway for foliage/kelp (uSway 0 = off)
in vec3 aPos;
in vec3 aCol;
in vec3 iOff;        // world position
in vec4 iSRL;        // scale, yaw, lean, leanDir
in vec3 iTint;
out vec3 vWorld;
out vec3 vCol;
void main() {
  float s = iSRL.x, yaw = iSRL.y, lean = iSRL.z, ld = iSRL.w;
  vec3 p = aPos * s;
  vec3 axis = vec3(cos(ld), 0.0, sin(ld));          // lean (tilt) via Rodrigues
  float cl = cos(lean), sl = sin(lean);
  p = p * cl + cross(axis, p) * sl + axis * dot(axis, p) * (1.0 - cl);
  float cy = cos(yaw), sy = sin(yaw);               // yaw around Y
  vec3 r = vec3(p.x * cy + p.z * sy, p.y, -p.x * sy + p.z * cy);
  vec3 wp = r + iOff;
  // §14B sway: a travelling undulation up each plant — taller parts lag, so the stalk ripples
  // like kelp in a current. The -r.y term phases the wave along the height (classic wavy seaweed).
  float ph = uTime*0.9 + iOff.x*0.14 + iOff.z*0.11 - r.y*0.6;
  float hy = max(0.0, r.y);
  float sway = uSway * (sin(ph) * 0.045 + sin(ph*2.3 + 1.7) * 0.015) * hy;
  wp.x += sway; wp.z += sway*0.6;
  vWorld = wp; vCol = aCol * iTint;
  gl_Position = uProj * uView * vec4(wp, 1.0);
}`;

const propFS = `#version 300 es
precision highp float;
in vec3 vWorld;
in vec3 vCol;
out vec4 frag;
uniform vec3 uSunDir, uCamPos, uZenith, uHorizon, uWarm;
uniform float uFogDensity, uFogNear;
uniform float uWetLevel, uWaterLevel;               // §13.7 wet band near the waterline
uniform int uWetBand;                               // 1 only for the world prop pass (rocks, trees)
${SKY_GLSL}
void main() {
  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
  float diff = abs(dot(n, normalize(uSunDir)));      // abs → foliage lit both sides
  vec3 col = vCol * (0.5 + 0.6 * diff);
  col *= mix(vec3(0.85, 0.89, 0.99), uWarm, diff);
  if (uWetBand == 1) {
    float wetb = 1.0 - smoothstep(uWaterLevel, uWetLevel + 1.2, vWorld.y);     // darker below the high-water mark
    col = mix(col, col * 0.58, clamp(wetb, 0.0, 1.0) * 0.8);
    float band = (1.0 - smoothstep(uWetLevel - 0.2, uWetLevel + 1.0, vWorld.y)) * smoothstep(uWaterLevel - 0.6, uWaterLevel + 0.4, vWorld.y);
    float sp = fract(sin(dot(floor(vWorld.xz * 7.0), vec2(12.99, 78.23))) * 43758.5);  // barnacle speckle in the splash zone
    if (band > 0.3 && sp > 0.82) col = mix(col, vec3(0.82, 0.82, 0.78), 0.55);
  }
  vec3 viewVec = vWorld - uCamPos;
  float dist = length(viewVec);
  float fd = max(dist - uFogNear, 0.0) * uFogDensity;
  float fog = 1.0 - exp(-fd * fd);
  col = mix(col, skyColor(viewVec, uSunDir, uZenith, uHorizon, uWarm), fog);
  frag = vec4(col, 1.0);
}`;

const propProg = program(propVS, propFS);
const propU = uniforms(propProg);
const propLoc = {
  aPos: gl.getAttribLocation(propProg, "aPos"), aCol: gl.getAttribLocation(propProg, "aCol"),
  iOff: gl.getAttribLocation(propProg, "iOff"), iSRL: gl.getAttribLocation(propProg, "iSRL"),
  iTint: gl.getAttribLocation(propProg, "iTint"),
};

// §11.6 mini-view water surface: a rippling translucent disc, its own tiny program so it can blend.
const miniWaterProg = program(`#version 300 es
precision highp float;
uniform mat4 uProj, uView; uniform float uTime, uScale, uWaterY;
in vec3 aPos; out vec3 vW; out float vR;
void main() {
  float r = length(aPos.xz) * uScale; vR = r;
  float w = sin(r*9.0 - uTime*3.0)*0.012 + sin(aPos.x*uScale*7.0 + uTime*2.0)*0.008;
  vec3 p = vec3(aPos.x*uScale, uWaterY + w, aPos.z*uScale);
  vW = p; gl_Position = uProj * uView * vec4(p, 1.0);
}`, `#version 300 es
precision highp float;
in vec3 vW; in float vR; out vec4 frag; uniform float uTime; uniform vec3 uTop;
void main() {
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
  float sh = 0.5 + 0.5*clamp(n.y, 0.0, 1.0);
  float ring = smoothstep(0.42, 0.5, abs(fract(vR*6.0 - uTime*1.1) - 0.5));
  vec3 col = mix(uTop*0.72, uTop*1.18, sh) + ring*0.05;
  frag = vec4(col, 0.42);
}`);
const miniWaterU = uniforms(miniWaterProg);
const miniWaterLoc = gl.getAttribLocation(miniWaterProg, "aPos");
// a unit-radius water disc (fan expanded to triangles) with its own VAO
const miniWaterVAO = (() => {
  const seg = 28, v = [];
  for (let i = 0; i < seg; i++) { const a0 = i/seg*6.283, a1 = (i+1)/seg*6.283;
    v.push(0,0,0, Math.cos(a0),0,Math.sin(a0), Math.cos(a1),0,Math.sin(a1)); }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(miniWaterLoc); gl.vertexAttribPointer(miniWaterLoc, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return { vao, verts: v.length/3 };
})();

function makeInstanced(mesh, inst) {
  if (inst.length === 0) return { vao: null, vertCount: 0, count: 0, tris: 0 };
  const pos = new Float32Array(mesh.pos), col = new Float32Array(mesh.col);
  const idata = new Float32Array(inst);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(propLoc.aPos); gl.vertexAttribPointer(propLoc.aPos, 3, gl.FLOAT, false, 0, 0);
  const cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb);
  gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(propLoc.aCol); gl.vertexAttribPointer(propLoc.aCol, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, idata, gl.STATIC_DRAW);
  const ST = 40;
  gl.enableVertexAttribArray(propLoc.iOff);  gl.vertexAttribPointer(propLoc.iOff, 3, gl.FLOAT, false, ST, 0);  gl.vertexAttribDivisor(propLoc.iOff, 1);
  gl.enableVertexAttribArray(propLoc.iSRL);  gl.vertexAttribPointer(propLoc.iSRL, 4, gl.FLOAT, false, ST, 12); gl.vertexAttribDivisor(propLoc.iSRL, 1);
  gl.enableVertexAttribArray(propLoc.iTint); gl.vertexAttribPointer(propLoc.iTint, 3, gl.FLOAT, false, ST, 28); gl.vertexAttribDivisor(propLoc.iTint, 1);
  gl.bindVertexArray(null);
  const vc = pos.length / 3, n = inst.length / 10;
  return { vao, vertCount: vc, count: n, tris: (vc / 3) * n, ibo: ib, data: idata };
}

/* --------------------------------------------------------------------- *
 * § POINTS OF INTEREST  (2–4 per island, chosen & placed by seed)
 * --------------------------------------------------------------------- */

let POIS = [];
const POI_R = { lighthouse: 6, tidepools: 9, seacave: 7, cairn: 3, hut: 4, pier: 5 };

function marchToShore(ang) {                 // find the waterline along a bearing
  const dx = Math.sin(ang), dz = -Math.cos(ang);
  let prev = HALF * 0.99;
  for (let rr = HALF * 0.99; rr > 20; rr -= 2) {
    if (heightAt(dx * rr, dz * rr) > 0.3) {  // first land
      return { x: dx * rr, z: dz * rr, rr, dx, dz };
    }
    prev = rr;
  }
  return null;
}
function coastSlope(x, z) { return surfaceAt(x, z).slope; }

function placePOIs() {
  const W = HALF * 2, minSep = W * 0.25, out = [];
  // archetype-weighted pool
  const pool = [];
  const add = (t, n) => { for (let i = 0; i < n; i++) pool.push(t); };
  add("lighthouse", 2); add("cairn", 2); add("hut", 1);
  if (CHARACTER === "lowlands" || CHARACTER === "atoll") { add("pier", 3); add("tidepools", 2); }
  if (CHARACTER === "highlands") { add("tidepools", 3); add("seacave", 2); }
  if (CHARACTER === "peaks") { add("seacave", 3); add("tidepools", 2); add("lighthouse", 2); }
  const want = 2 + Math.floor(rng() * 3);   // 2–4
  let tries = 0;
  while (out.length < want && tries < 120) {
    tries++;
    const type = pool[(rng() * pool.length) | 0];
    if (out.some((o) => o.type === type) && tries < 95) continue;   // prefer variety
    let pos = null;
    if (type === "lighthouse" || type === "cairn") {
      // a high point, jittered
      pos = { x: HIGH.x + (rng() - 0.5) * 120, z: HIGH.z + (rng() - 0.5) * 120 };
      if (heightAt(pos.x, pos.z) < HIGH.h * 0.45) continue;
    } else if (type === "hut") {
      for (let k = 0; k < 10 && !pos; k++) {
        const a = rng() * 6.2832, r = rng() * HALF * 0.6;
        const x = Math.sin(a) * r, z = -Math.cos(a) * r, h = heightAt(x, z);
        if (h > 12 && h < 40 && surfaceAt(x, z).slope < 0.4) pos = { x, z };
      }
    } else {
      const sh = marchToShore(rng() * 6.2832);
      if (!sh) continue;
      const sl = coastSlope(sh.x, sh.z);
      if (type === "seacave" && sl < 0.55) continue;        // needs a cliff
      if (type === "tidepools" && (sl < 0.12 || sl > 0.5)) continue;  // a rocky shelf
      if (type === "pier") { pos = { x: sh.x - sh.dx * 10, z: sh.z - sh.dz * 10 }; }
      else pos = { x: sh.x, z: sh.z };
    }
    if (!pos) continue;
    if (out.some((o) => Math.hypot(o.x - pos.x, o.z - pos.z) < minSep)) continue;
    out.push({ type, x: pos.x, z: pos.z, radius: POI_R[type] });
  }
  return out;
}

// POI models, emitted into a single world-space mesh (one draw call).
function emitPOI(m, poi) {
  const x = poi.x, z = poi.z, g = heightAt(x, z);
  const put = (lm, ox, oy, oz, yaw) => {   // place a local mesh into world space
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    for (let i = 0; i < lm.pos.length; i += 3) {
      const px = lm.pos[i], py = lm.pos[i+1], pz = lm.pos[i+2];
      m.pos.push(px*cy + pz*sy + ox, py + oy, -px*sy + pz*cy + oz);
      m.col.push(lm.col[i], lm.col[i+1], lm.col[i+2]);
    }
  };
  if (poi.type === "lighthouse") {
    const lm = Mesh(), white = [0.85,0.85,0.82], red = [0.6,0.2,0.18];
    mCyl(lm, 0, 7, 3.2, 2.2, 10, white);
    mCyl(lm, 7, 13, 2.2, 1.7, 10, red);
    mCyl(lm, 13, 18, 1.7, 1.4, 10, white);
    mBox(lm, 0, 19, 0, 1.6, 1.4, 1.6, [0.2,0.22,0.24]);
    mBox(lm, 0, 20.6, 0, 1.0, 0.4, 1.0, [1.0, 0.92, 0.5]);   // lantern (bright)
    mCyl(lm, 21, 22.4, 0.9, 0, 6, red);
    put(lm, x, g, z, rng() * 6.28);
  } else if (poi.type === "cairn") {
    const lm = Mesh(); let r = 1.3, y = 0;
    const rand = mulberry32((x * 131 + z * 977) >>> 0);
    for (let k = 0; k < 6; k++) { const mm = Mesh(); mRock(mm, rand, [0.5,0.48,0.45]);
      for (let i=0;i<mm.pos.length;i+=3){ lm.pos.push(mm.pos[i]*r, mm.pos[i+1]*r*0.6+y, mm.pos[i+2]*r); lm.col.push(mm.col[i],mm.col[i+1],mm.col[i+2]); }
      y += r * 0.7; r *= 0.82; }
    put(lm, x, g, z, 0);
  } else if (poi.type === "hut") {
    const lm = Mesh(), wood = [0.35,0.28,0.2], roof = [0.25,0.22,0.2];
    mBox(lm, 0, 1.4, 0, 2.2, 1.4, 1.8, wood);
    mTri(lm, [-2.4,2.8,-2],[2.4,2.8,-2],[0,4.2,0], roof);
    mTri(lm, [-2.4,2.8,2],[2.4,2.8,2],[0,4.2,0], roof);
    mQuad(lm, [-2.4,2.8,-2],[0,4.2,0],[0,4.2,0],[-2.4,2.8,2], roof);
    put(lm, x, g, z, rng() * 6.28);
  } else if (poi.type === "pier") {
    const lm = Mesh(), wood = [0.34,0.27,0.2];
    for (let i = 0; i < 6; i++) { const zz = i * 3; mBox(lm, -1.4, 1.2, zz, 0.18, 1.2, 0.18, wood); mBox(lm, 1.4, 1.2, zz, 0.18, 1.2, 0.18, wood); }
    mBox(lm, 0, 2.3, 7.5, 1.7, 0.12, 8, wood);
    const dir = Math.atan2(-x, z);               // point out to sea
    put(lm, x, Math.max(g, -1), z, dir);
  } else if (poi.type === "tidepools" || poi.type === "seacave") {
    const lm = Mesh(), rock = [0.44,0.43,0.42];
    const rand = mulberry32((x * 71 + z * 233) >>> 0);
    const n = poi.type === "seacave" ? 5 : 9;
    for (let k = 0; k < n; k++) {
      const mm = Mesh(); mRock(mm, rand, rock);
      const s = 1.2 + rand() * 2.2, ox = (rand()-0.5)*9, oz = (rand()-0.5)*9;
      const oy = poi.type === "seacave" ? 2 + rand()*3 : 0;
      for (let i=0;i<mm.pos.length;i+=3){ lm.pos.push(mm.pos[i]*s+ox, mm.pos[i+1]*s+oy, mm.pos[i+2]*s+oz); lm.col.push(mm.col[i],mm.col[i+1],mm.col[i+2]); }
    }
    put(lm, x, g, z, 0);
  }
}

/* --------------------------------------------------------------------- *
 * § PLACEMENT  (jittered grid ≈ Poisson; bands by height & slope)
 * --------------------------------------------------------------------- */

let propTypes = [];
const bigCells = new Set();      // keeps trunks/boulders from stacking

function nearPOI(x, z, extra) {
  for (const p of POIS) if (Math.hypot(x - p.x, z - p.z) < p.radius + extra) return true;
  return false;
}
function reserveBig(x, z) {
  const k = Math.floor(x / 3) + "," + Math.floor(z / 3);
  if (bigCells.has(k)) return false; bigCells.add(k); return true;
}
// §12A is this spot covered by ANY water surface — ocean at spring high, a trapped
// basin/pond, or a filled hole? Dry-land props and planting must reject such spots.
function spotUnderwater(x, z, margin) {
  margin = margin || 0;
  const g = surfaceAt(x, z).h;
  if (MAX_HIGH_TIDE + margin >= g) return true;                        // the sea reaches here at spring high
  const i = cellIndex(x, z); if (i < 0) return false;
  if (filled[i] > heightmap[i] + 0.1 && filled[i] + margin >= g) return true;   // trapped pond / lagoon
  if (ponded.has(i) && ponded.get(i) + margin >= g) return true;       // a hole someone filled with the bucket
  return false;
}
// Scatter one prop type over a jittered grid; fn returns true to keep a point.
function scatter(spacing, jitter, maxN, fn) {
  const inst = [];
  for (let gz = -HALF; gz < HALF && inst.length < maxN * 10; gz += spacing)
    for (let gx = -HALF; gx < HALF; gx += spacing) {
      const x = gx + (rng() - 0.5) * spacing * jitter;
      const z = gz + (rng() - 0.5) * spacing * jitter;
      fn(x, z, inst);
    }
  return inst;
}
function pushInst(inst, x, y, z, s, yaw, lean, ld, t) {
  inst.push(x, y, z, s, yaw, lean, ld, t[0], t[1], t[2]);
}

function buildProps() {
  POIS = placePOIs();
  const poiMesh = Mesh();
  for (const p of POIS) emitPOI(poiMesh, p);

  const vary = (base, amt) => [base[0]*(1+(rng()-0.5)*amt), base[1]*(1+(rng()-0.5)*amt), base[2]*(1+(rng()-0.5)*amt)];
  colliders.length = 0; bigCells.clear();

  // seaweed clumps along the high-tide line (walkable)
  const seaweed = scatter(9, 0.9, 3000, (x, z, inst) => {
    const s = surfaceAt(x, z); if (s.h < 0.2 || s.h > 4 || s.slope > 0.4) return;
    if (rng() > 0.45 || nearPOI(x, z, 2)) return;
    pushInst(inst, x, s.h, z, 0.6 + rng()*0.5, rng()*6.28, 0, 0, vary([0.26,0.3,0.2], 0.3));
  });
  // driftwood along the shore — lying flat, choppable (§13.1); tracked, not instanced
  driftObjs = [];
  scatter(26, 0.9, 1200, (x, z) => {
    const s = surfaceAt(x, z); if (s.h < 0.4 || s.h > 7 || s.slope > 0.35) return;
    if (rng() > 0.5 || nearPOI(x, z, 2)) return;
    const scale = 1.5 + rng()*2.2;
    driftObjs.push({ x, z, scale, yaw: rng()*6.28, roll: (rng()-0.5)*0.5, tint: vary([0.6,0.55,0.48], 0.15), gone: false, big: scale > 2.2 });
  });
  // dune grass (walkable)
  const grass = scatter(5.5, 1.0, 7000, (x, z, inst) => {
    const s = surfaceAt(x, z); if (s.h < 5 || s.h > 26 || s.slope > 0.5) return;
    if (rng() > 0.7 || nearPOI(x, z, 2) || spotUnderwater(x, z)) return;
    pushInst(inst, x, s.h, z, 0.6 + rng()*0.8, rng()*6.28, 0, 0, vary([0.5,0.54,0.3], 0.25));
  });
  // palms at the beach/dune edge (collide)
  const palms = scatter(15, 0.9, 1500, (x, z, inst) => {
    const s = surfaceAt(x, z); if (s.h < 3 || s.h > 17 || s.slope > 0.4) return;
    if (rng() > 0.5 || nearPOI(x, z, 3) || spotUnderwater(x, z, 0.3) || !reserveBig(x, z)) return;
    const sc = 7 + rng()*6;
    pushInst(inst, x, s.h, z, sc, rng()*6.28, 0.05 + rng()*0.18, rng()*6.28, vary([0.9,0.95,0.8], 0.15));
    colliders.push({ x, z, r: 0.5, kind: "tree", species: "palm", ii: inst.length/10 - 1 });
  });
  // interior pines, thinning on slopes & toward the summit (keep sightlines)
  const trees = scatter(11, 0.9, 3500, (x, z, inst) => {
    const s = surfaceAt(x, z); if (s.h < 20 || s.slope > 0.6) return;
    const thin = 1 - smoothstep(HIGH.h * 0.55, HIGH.h * 0.95, s.h);   // fewer up high
    if (rng() > 0.55 * thin || nearPOI(x, z, 3) || spotUnderwater(x, z, 0.3) || !reserveBig(x, z)) return;
    const sc = 6 + rng()*10;
    pushInst(inst, x, s.h, z, sc, rng()*6.28, rng()*0.1, rng()*6.28, vary([1,1,1], 0.2));
    colliders.push({ x, z, r: 0.6, kind: "tree", species: "pine", ii: inst.length/10 - 1 });
  });
  // interior broadleaf trees (the ones that shed leaves) — dunes up to mid-slope
  const broadleaf = scatter(13, 0.9, 1800, (x, z, inst) => {
    const s = surfaceAt(x, z); if (s.h < 13 || s.h > 42 || s.slope > 0.5) return;
    if (rng() > 0.4 || nearPOI(x, z, 3) || spotUnderwater(x, z, 0.3) || !reserveBig(x, z)) return;
    const sc = 6 + rng()*7;
    pushInst(inst, x, s.h, z, sc, rng()*6.28, rng()*0.08, rng()*6.28, vary([1,1,1], 0.15));
    colliders.push({ x, z, r: 0.6, kind: "tree", species: "broadleaf", ii: inst.length/10 - 1 });
  });
  // §13.7 boulders in three biome styles: rounded cobble near the shore, mossy slabs inland,
  // dark jagged rock up high / on the reef shelf. Sunk 20–40% into the ground.
  const rocksR = [], rocksS = [], rocksJ = [];
  scatter(20, 0.9, 1500, (x, z) => {
    const s = surfaceAt(x, z);
    const high = s.h > 38, flat = s.h > 2 && s.h < 16;
    if (!(high || flat) || s.h < 1) return;
    if (rng() > (high ? 0.5 : 0.12) || nearPOI(x, z, 3) || spotUnderwater(x, z) || !reserveBig(x, z)) return;
    const sc = 1.2 + rng()*3.5;
    let arr, styleIdx;
    if (high) { arr = rocksJ; styleIdx = 2; }           // jagged dark rock up high
    else if (s.h < 7) { arr = rocksR; styleIdx = 0; }   // smooth rounded cobble near the shore
    else { arr = rocksS; styleIdx = 1; }                // mossy slab inland
    const y = s.h - sc*0.22;                            // sink the base into the ground
    const t = vary([1,1,1], 0.1);
    arr.push(x, y, z, sc, rng()*6.28, 0, 0, t[0], t[1], t[2]);
    colliders.push({ x, z, r: sc*0.5, kind: "rock", ii: arr.length/10 - 1, sc, styleIdx });
  });
  // §14B underwater meadows — eelgrass meadows in the shallows, bull-kelp forests in deeper water.
  // Plants stay below the ordinary low-water line so they don't end up high and dry at low tide,
  // and a slow lushness field breaks the seabed into lush / sparse / barren (sandy, rocky) patches.
  const seabedOK = (x, z) => { const i = cellIndex(x, z); if (i < 0 || ponded.has(i) || filled[i] > waterLevel + 0.35) return false; return true; };
  const SUBMERGE_LINE = TIDE_MID - TIDE_RANGE * 0.5;                // deeper than an ordinary low tide → stays underwater
  const lushAt = (x, z) => nMacro.fbm(x * 0.013 + 40, z * 0.013 - 25, 4, 2, 0.5);   // 0..1 patchy seabed richness
  const eelgrass = [], kelpF = [];

// §12A generation self-check: no dry-land prop (tree, boulder, fence, POI) may stand in water.
function validateProps() {

    if (c.kind === "tree" || c.kind === "rock" || c.kind === "fence") {
      if (spotUnderwater(c.x, c.z)) { bad++; if (bad <= 5) console.warn(`prop underwater: ${c.kind} at ${c.x.toFixed(1)},${c.z.toFixed(1)} (ground ${surfaceAt(c.x,c.z).h.toFixed(1)}, water ${waterSurfaceAtMax(c.x,c.z).toFixed(1)})`); }
    }
  }
  const WATER_POI = { tidepools: 1, seacave: 1, pier: 1 };              // these belong at/over the water by design
  for (const p of POIS) if (!WATER_POI[p.type] && spotUnderwater(p.x, p.z)) { bad++; if (bad <= 5) console.warn(`POI underwater: ${p.type} at ${p.x.toFixed(1)},${p.z.toFixed(1)}`); }

const removedFoliage = [];                                 // { t, i, scale, regrowAt }

    const n = t.inst.count, data = t.inst.data;
    for (let i = 0; i < n; i++) { const o = i*10, sc = data[o+3];
      if (sc <= 0.001) continue;

    const o = f.i*10, data = f.t.inst.data, gi = cellIndex(data[o], data[o+2]);

function drawProps(view) {

const shadowProg = program(`#version 300 es
precision highp float;
uniform mat4 uProj, uView;

in vec4 iInst;            // x, y, z, radius

`#version 300 es
precision highp float;
in float vR; out vec4 frag; uniform float uStrength;
void main(){ float a = clamp(1.0 - vR, 0.0, 1.0); frag = vec4(0.0, 0.0, 0.0, a*a*uStrength); }`);

function drawContactShadows(view) {

  const sx = SKY.sun[0], sz = SKY.sun[2], sl = Math.hypot(sx, sz) || 1, ox = -sx/sl, oz = -sz/sl;

// Dynamic instanced type: static base mesh + a per-frame instance buffer.
function makeDynamic(mesh, maxN) {
  const pos = new Float32Array(mesh.pos), col = new Float32Array(mesh.col);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb);

  gl.enableVertexAttribArray(propLoc.aPos); gl.vertexAttribPointer(propLoc.aPos, 3, gl.FLOAT, false, 0, 0);
  const cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb);

  gl.enableVertexAttribArray(propLoc.aCol); gl.vertexAttribPointer(propLoc.aCol, 3, gl.FLOAT, false, 0, 0);

  gl.enableVertexAttribArray(propLoc.iSRL);  gl.vertexAttribPointer(propLoc.iSRL, 4, gl.FLOAT, false, ST, 12); gl.vertexAttribDivisor(propLoc.iSRL, 1);

    vao, ib, vc,

      gl.bindBuffer(gl.ARRAY_BUFFER, ib);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr, 0, n * 10);

}

// §14B a single wavy blade of seaweed: a tapering vertical ribbon curved into a gentle S, so
// the tip bends most. Drawn double-sided (props aren't face-culled) and animated by the sway shader.
function wavyRibbon(m, o) {
  const seg = o.seg || 7, h = o.h, dir = o.dir || 0, amp = o.amp || 0.2, freq = o.freq || 1.0,
        phase = o.phase || 0, droop = o.droop || 0, bx = o.bx || 0, bz = o.bz || 0,
        y0 = o.y0 || 0, twist = o.twist || 0;
  const px = Math.cos(dir + 1.5708), pz = Math.sin(dir + 1.5708);   // width axis (across the blade)
  const wx = Math.cos(dir), wz = Math.sin(dir);                      // curve axis (the blade bends this way)
  let pL = null, pR = null, pC = null;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const y = y0 + t * h - droop * t * t;
    const bend = Math.sin(t * freq * Math.PI + phase) * amp * t;     // base anchored, tip sweeps
    const cx = bx + wx * bend, cz = bz + wz * bend;
    const w = o.w0 * (1 - t) + o.w1 * t;
    const tw = twist * t, ct = Math.cos(tw), st = Math.sin(tw);
    const qx = px * ct + wx * st, qz = pz * ct + wz * st;            // width axis, gently twisting
    const col = [o.c0[0] + (o.c1[0]-o.c0[0])*t, o.c0[1] + (o.c1[1]-o.c0[1])*t, o.c0[2] + (o.c1[2]-o.c0[2])*t];
    const L = [cx - qx*w, y, cz - qz*w], R = [cx + qx*w, y, cz + qz*w];
    if (pL) mQuad(m, pL, pR, R, L, col);
    pL = L; pR = R; pC = col;
  }
}

function drawLife(view) {
  gl.useProgram(propProg);
  gl.uniformMatrix4fv(propU.uProj, false, proj);
  gl.uniformMatrix4fv(propU.uView, false, view);
  gl.uniform3fv(propU.uSunDir, SKY.sun);
  gl.uniform3fv(propU.uCamPos, cam.pos);
  gl.uniform3fv(propU.uZenith, SKY.zenith);
  gl.uniform3fv(propU.uHorizon, SKY.horizon);
  gl.uniform3fv(propU.uWarm, SKY.warm);
  gl.uniform1f(propU.uFogDensity, FOG_DENSITY);
  gl.uniform1f(propU.uFogNear, FOG_NEAR);
  const px = cam.pos[0], pz = cam.pos[2];
  const buckets = {};
  for (const k in CREATURES) buckets[k] = 0;
  for (const k in FINDS) buckets["f_" + k] = 0;
  // fill per-type scratch and draw (one pass per type to reuse the buffer)
  const drawType = (key, reg, filter) => {
    let n = 0;
    for (const e of life) {
      if (!filter(e)) continue;
      const dx = e.x - px, dz = e.z - pz; if (dx*dx + dz*dz > DRAW_R*DRAW_R) continue;
      if (forceSpawn ? false : !lifeVisible(e)) continue;
      if (n >= reg.max) break;
      const g = heightAt(e.x, e.z);
      let y = g, sc = e.scale, lean = 0, ld = 0;
      if (e.kind === "creature") {
        if (FISH[e.t]) { y = (e.y !== undefined) ? e.y : g + 1.0;   // §14C huntable fish hover in the water column
          lean = e.t === "flounder" ? 1.5 : Math.sin(e.phase*3)*0.06; ld = e.yaw; }   // flounder lies flat
        else if (e.t === "fish") y = (e.poolRim !== undefined ? Math.max(waterLevel, e.poolRim) : waterLevel) - 0.3 + Math.sin(e.phase*4)*0.05;
        else if (e.t === "gull") { y = (e.y !== undefined) ? e.y : g + (e.alt || 0) + 0.3;   // §12B flap-and-glide; +0.3 so it never sinks into the ground
          const amp = (e.gstate === "soar" || e.gstate === "approach") ? 0.16 : 0.42;  // glide steady, flap hard when working
          lean = Math.sin(e.flap || 0) * amp; ld = e.yaw;
          sc = e.scale * 1.5; }                         // §13.7 read bigger against sky & sand (easy to spot)
        else if (e.t === "jelly") sc = e.scale * (0.9 + Math.sin(e.phase*2)*0.1);
        if (e.t === "crab") y = g - (e.burrow || 0) * 0.6;                      // §13.1 sink into the sand (no pop)
        else if (e.t === "anemone") sc = e.scale * (1 - 0.6*e.closed);
        if (e.t === "star" || e.t === "anemone" || e.t === "urchin") y += 0.02;
      } else { y = g + 0.05; lean = 0.2; }
      const o = n*10;
      lifeScratch[o]=e.x; lifeScratch[o+1]=y; lifeScratch[o+2]=e.z;
      lifeScratch[o+3]=sc; lifeScratch[o+4]=e.yaw; lifeScratch[o+5]=lean; lifeScratch[o+6]=ld;
      lifeScratch[o+7]=e.tint[0]; lifeScratch[o+8]=e.tint[1]; lifeScratch[o+9]=e.tint[2];
      if (showAlert && FISH[e.t]) { const al = e.alert || 0; lifeScratch[o+7]=0.3+al*0.7; lifeScratch[o+8]=0.9-al*0.7; lifeScratch[o+9]=0.3; }   // §14C green→red by alertness
      n++;
    }
    reg.dyn.draw(lifeScratch, n);
  };
  for (const k in CREATURES) drawType(k, CREATURES[k], (e) => e.kind === "creature" && e.t === k);
  for (const k in FINDS) drawType(k, FINDS[k], (e) => e.kind === "find" && e.t === k);
}

/* ---- inventory (slot model + hotbar) ---- */
// 36 main slots + an 8-slot hotbar; every cell is a {id,qty} stack or null.
const INV_SLOTS = 36, HOTBAR_SLOTS = 8;
const Inv = {
  main: new Array(INV_SLOTS).fill(null),
  hotbar: new Array(HOTBAR_SLOTS).fill(null),
  selected: 0,
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { for (const fn of this.listeners) fn(); saveState(); },
  count(id) { let c = 0; for (const s of this.main) if (s && s.id === id) c += s.qty; for (const s of this.hotbar) if (s && s.id === id) c += s.qty; return c; },
  has(id) { return this.count(id) > 0; },
  add(id, qty = 1) {
    const it = ITEMS[id]; if (!it) return 0; let rem = qty; const arrs = [this.main, this.hotbar];
    if (it.stackable) for (const arr of arrs) for (const s of arr) { if (rem <= 0) break; if (s && s.id === id && s.qty < it.maxStack) { const c = Math.min(it.maxStack - s.qty, rem); s.qty += c; rem -= c; } }
    for (const arr of arrs) for (let i = 0; i < arr.length; i++) { if (rem <= 0) break; if (!arr[i]) { const c = it.stackable ? Math.min(it.maxStack, rem) : 1; arr[i] = { id, qty: c }; rem -= c; } }
    const added = qty - rem; if (added > 0) this.emit(); return added;
  },
  remove(id, qty = 1) { let r = qty; for (const arr of [this.main, this.hotbar]) for (let i = 0; i < arr.length; i++) { const s = arr[i]; if (s && s.id === id) { const t = Math.min(s.qty, r); s.qty -= t; r -= t; if (s.qty <= 0) arr[i] = null; if (r <= 0) break; } } if (r < qty) this.emit(); return qty - r; },
  hotbarHasId(id) { return this.hotbar.some(s => s && s.id === id); },
  equipTool(id) { if (this.hotbarHasId(id)) return; const i = this.hotbar.indexOf(null); const slot = { id, qty: 1 }; if (i >= 0) this.hotbar[i] = slot; else this.hotbar[0] = slot; this.emit(); },
  // ensure a collected seed/salt/leaves ends up on the hotbar (first empty slot)
  autoHotbar(id) { if (this.hotbarHasId(id)) return; const hi = this.hotbar.indexOf(null); if (hi < 0) return; const mi = this.main.findIndex(s => s && s.id === id); if (mi < 0) return; this.hotbar[hi] = this.main[mi]; this.main[mi] = null; this.emit(); },
  cell(idx) { return idx < INV_SLOTS ? this.main[idx] : this.hotbar[idx - INV_SLOTS]; },
  setCell(idx, v) { if (idx < INV_SLOTS) this.main[idx] = v; else this.hotbar[idx - INV_SLOTS] = v; },
  sort() {
    const merged = {};
    for (const s of this.main) if (s) { (merged[s.id] = merged[s.id] || { id: s.id, qty: 0 }).qty += s.qty; }
    const stacks = [];
    for (const id in merged) { let q = merged[id].qty; const ms = ITEMS[id].maxStack || 99; while (q > 0) { const c = Math.min(ms, q); stacks.push({ id, qty: c }); q -= c; } }
    const CAT = { tool: 0, relic: 1, find: 2, material: 3, seed: 4, consumable: 5 };
    const RAR = { tool: 0, legendary: 1, rare: 2, uncommon: 3, common: 4 };

      const ra = RAR[ITEMS[a.id].rarity] ?? 9, rb = RAR[ITEMS[b.id].rarity] ?? 9; if (ra !== rb) return ra - rb; return a.id < b.id ? -1 : 1; });

function selectedItem() { const c = Inv.hotbar[Inv.selected]; return c ? c.id : null; }   // raw belt item id
// §13.2 the effective tool: the Tool Kit resolves to shovel/axe/pickaxe (by aim in Auto, or the locked mode)
function selectedTool() { const c = Inv.hotbar[Inv.selected]; if (!c) return null;
  if (c.id === "toolkit") return toolkit.mode === "auto" ? toolkit.tool : toolkit.mode;
  return c.id; }
function selectHotbar(i) { if (i < 0 || i >= HOTBAR_SLOTS) return;

  Inv.selected = i; renderHotbar(); }

/* ---- inventory stack operations (drag / split / drop) ---- */
function invMove(from, to) {
  if (from === to) return;
  const a = Inv.cell(from); if (!a) return;
  const b = Inv.cell(to);
  if (!b) { Inv.setCell(to, a); Inv.setCell(from, null); }
  else if (b.id === a.id && ITEMS[a.id] && ITEMS[a.id].stackable) {
    const room = (ITEMS[a.id].maxStack || 99) - b.qty, move = Math.min(room, a.qty);
    b.qty += move; a.qty -= move; if (a.qty <= 0) Inv.setCell(from, null);
  } else { Inv.setCell(to, a); Inv.setCell(from, b); }   // swap
  Inv.emit();
}

  let dest = -1; for (let i = 0; i < INV_SLOTS + HOTBAR_SLOTS; i++) if (i !== idx && !Inv.cell(i)) { dest = i; break; }
  if (dest < 0) return;

}

  const q = one ? 1 : s.qty; dropItemWorld(s.id, q);

}

}

function normCell(c) { return (typeof c === "string") ? { id: c, qty: 1 } : c; }   // migrate old hotbar (bare ids)

/* ---- auto-pickup (§8): loose items within a small arc hop into the pack ---- */

function autoSwitchTo(id) {                 // select the belt slot holding `id` (or set the Tool Kit to it)

// Reach for a capable tool for an object target before acting.

function groundAutoDig(pt) {

    const a = rng() * 6.283, r = 0.6 + rng() * 1.1;
    const x = player.x + fx * 2 + Math.cos(a) * r, z = player.z + fz * 2 + Math.sin(a) * r;

function seedGullNests() {

  for (let c = 0; c < colonies; c++) {

    for (let k = 0; k < 500 && !site; k++) {
      const a = rng()*6.283, r = HALF*(0.28 + rng()*0.5), x = Math.sin(a)*r, z = -Math.cos(a)*r;

      const ledge = s.h > 20 && s.h < 44 && s.slope > 0.32 && s.slope < 1.1;   // cliff ledge

    spawnCreature("gull", nest.x, nest.z, { cxx: nest.x, czz: nest.z, alt: 18 });
    const e = life[life.length-1]; e.nest = nest; guards++;
  } }
}

function gullInterest() {
  if (gullLure && clock.t - gullLure.t < GULL.lureLife) return { x: gullLure.x, z: gullLure.z, kind: "lure" };
  // a small find or food sitting out (a fresh hole, a dropped item)
  let best = null, bd = 90;
  for (const e of life) { if (e.kind !== "find" || !GULL_WANTS[e.t]) continue;
    const d = Math.hypot(e.x - player.x, e.z - player.z); if (d < bd) { bd = d; best = { x: e.x, z: e.z, kind: "find", ref: e }; } }

  if (typeof chestGullPoint === "function") { const cp = chestGullPoint(); if (cp) return cp; }   // §12C open/near chests

  for (const s of (typeof digSpots !== "undefined" ? digSpots : [])) {
    if (s.revealed || s.tell !== "gull") continue;

}

}

function updateGulls(dt) {

    player.incline = uphillGrade;
    player.sprinting = (keys["ShiftLeft"] || mobileSprint) && wl > 0.01 && hungerTier() !== "starving"
                       && uphillGrade < SPRINT_SLOPE_MAX && !crouching;  // §13.1 no sprint up a steep pitch; §13.4 or while crouched
    let scrambleTarget = 0;
    _curSpeedMul = 1; _curSlopeDeg = gg.slope * 180 / Math.PI;

    if (wl > 0.01) {
      wx /= wl; wz /= wl;
      let sm = slopeSpeedMul(fwdGrade);
      _curSpeedMul = sm;
      if (fwdGrade > 0.44) scrambleTarget = Math.min(1, (fwdGrade - 0.44) / 0.29);   // ~25°+ = scrambling
      if (scrambleTarget > 0.35 && (exhausted || stamina < 0.03)) sm = 0;
      const depth = waterLevel - here.h;
      let surfMul = 1;
      if (depth > 0.05) surfMul = Math.max(0.25, 1 - depth * 0.45); // deeper wading, slower
      else if (here.h < 12) surfMul = 0.9;                          // soft sand
      const speed = WALK_SPEED * (player.sprinting ? SPRINT : 1) * (crouching ? CROUCH_SPEED : 1) * sm * surfMul * (player.landStun > 0 ? 0.5 : 1) * matSpeedMul(Terrain.materialAt(player.x, player.z));
      const dist = speed * dt;
      // Simple, robust movement: slide X and Z independently (so you glide along walls), blocking only
      // deep water or a near-vertical rise per frame (prevents climbing cliff faces without snagging on bumps).
      const h0 = here.h, maxRise = dist * 3 + 0.65;
      let nx = player.x, nz = player.z;
      const WADE_INTO = SWIM_START + 0.7;   // §14A let wading carry you past the swim threshold so swimming kicks in
      const sX = surfaceAt(player.x + wx*dist, player.z);
      if (waterLevel - sX.h <= WADE_INTO && sX.h - h0 <= maxRise) nx = player.x + wx*dist;
      const sZ = surfaceAt(nx, player.z + wz*dist);
      if (waterLevel - sZ.h <= WADE_INTO && sZ.h - h0 <= maxRise) nz = player.z + wz*dist;
      [nx, nz] = slideCircles(nx, nz);
      player.x = nx; player.z = nz;
      player.bob += dist;
      const stepLen = scrambleTarget > 0.5 ? 1.5 : 1.15;
      if (player.bob - _stepPhase >= stepLen) {
        _stepPhase = player.bob;
        if (onFootstep) onFootstep(surfaceType(here.h, here.slope), scrambleTarget > 0.5 ? 1 : (player.sprinting ? 0.85 : 0.55));
      }
    }
    player.scramble += (scrambleTarget - player.scramble) * Math.min(1, dt * 4);
    if (player.landStun > 0) player.landStun = Math.max(0, player.landStun - dt);
    const g = surfaceAt(player.x, player.z);
    const standH = Math.max(g.h, trunkHeightAt(player.x, player.z));   // stand on a fallen trunk (or terrain)
    // coyote window + buffered jump
    player.coyote = player.airborne ? Math.max(0, player.coyote - dt) : COYOTE_TIME;
    if (jumpBufferT > 0) jumpBufferT -= dt;
    if (jumpBufferT > 0 && canJumpNow()) doJump();
    if (player.airborne) {
      // real world-space vertical integration — no lerp, land exactly at ground contact
      player.vy -= (player.vy > 0 ? GRAVITY_UP : GRAVITY_DOWN) * dt;
      player.feetY += player.vy * dt;
      if (player.vy <= 0 && player.feetY <= standH) {           // actual ground contact
        const fall = -player.vy;
        player.feetY = standH; player.vy = 0; player.airborne = false; player.coyote = COYOTE_TIME;
        player.eyeY = standH + EYE; landJump(g, fall);
      } else {
        player.eyeY = player.feetY + EYE;                       // exact height in the air
      }
    } else {
      const moving = wl > 0.01 ? 1 : 0;
      const amp = (0.06 + (player.sprinting ? 0.05 : 0) + player.scramble * 0.07) * moving;
      const freq = player.scramble > 0.3 ? 1.7 : 2.6;           // heavier when scrambling
      const bob = Math.sin(player.bob * freq) * amp;
      const sit = resting ? -0.8 : (crouching ? -CROUCH_DROP : 0);   // §13.4 lower the camera when crouched (deeper when resting)
      const target = standH + EYE + bob + sit;
      player.eyeY += (target - player.eyeY) * Math.min(1, dt * 14);
      player.feetY = standH;                                    // stay synced with the ground
    }
    cam.pos[0] = player.x; cam.pos[1] = player.eyeY + camYOff; cam.pos[2] = player.z;   // §13.1 landing give is camera-only
   }
  }

  if (mode === "walk") { updateBreath(dt); updateSacks(dt); updateDeepVisitor(dt); updateSpear(dt); }   // §14A/B/C
  updateFade(dt);
  safetyCheck(dt);

  // ---- matrices ----
  let f = camForward();
  const breathe = (resting || stamina < 0.35) ? Math.sin(t * 1.6) * (resting ? 0.03 : (0.35 - stamina) * 0.11) : 0;
  // a bounced-tool jolt: a fast jitter on yaw & pitch that decays (§10.1)
  const shk = camShake > 0.001 ? camShake * 0.09 : 0;
  const shakeYaw = shk ? Math.sin(t * 90) * shk : 0, shakePit = shk ? Math.cos(t * 83) * shk : 0;
  if (mode === "walk" && (player.scramble > 0.01 || camNudge > 0.001 || breathe !== 0 || shk !== 0)) {   // dip + breathe + dig kick + jolt
    const dip = player.scramble * 0.14 + Math.sin(t * 2.2) * player.scramble * 0.025 + camNudge + breathe + shakePit;
    const yaw = cam.yaw + shakeYaw;
    const cp = Math.cos(cam.pitch - dip), sp = Math.sin(cam.pitch - dip);
    f = [Math.sin(yaw) * cp, sp, -Math.cos(yaw) * cp];
  }
  const view = M4.lookAt(cam.pos, [cam.pos[0]+f[0], cam.pos[1]+f[1], cam.pos[2]+f[2]], [0, 1, 0]);
  lastVP = M4.multiply(proj, view);
  const invVP = M4.invert(lastVP);
  lastInvVP = invVP;

  // §14B underwater view: deepen & blue-shift the fog so visibility shortens with depth, and swap the
  // sky/fog colour to the undersea palette. Reds fade into blue-green, darker the deeper you go.
  const camSurf = waterSurfaceAt(cam.pos[0], cam.pos[2]);
  const camUnderwater = mode === "walk" && cam.pos[1] < camSurf - 0.05;
  camUnderwaterNow = camUnderwater;
  let _uwFogD, _uwFogN, _uwSky;
  if (camUnderwater) {
    const depthBelow = Math.max(0, camSurf - cam.pos[1]);
    const murk = Math.min(1, depthBelow / 22);                 // deeper → murkier
    _uwFogD = FOG_DENSITY; _uwFogN = FOG_NEAR;
    FOG_DENSITY = 0.028 + murk * 0.03; FOG_NEAR = 6.0;         // shorter visibility than on land, but still see the seabed
    _uwSky = { z: SKY.zenith, h: SKY.horizon, w: SKY.warm };
    const dk = 1 - murk * 0.4;                                  // gently darker with depth
    SKY.zenith = SKY_UW.zenith.map(v => v*dk); SKY.horizon = SKY_UW.horizon.map(v => v*dk); SKY.warm = SKY_UW.warm.map(v => v*dk);
  }

  // ============ PASS 1: scene → low-res FBO ============
  ensureFBO();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
  gl.viewport(0, 0, fbo.w, fbo.h);
  gl.clearColor(SKY.horizon[0], SKY.horizon[1], SKY.horizon[2], 1.0);
  gl.depthMask(true);   // MUST be writable or clear(DEPTH) is a no-op
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // sky (background, no depth)
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(skyU.uInvVP, false, invVP);
  gl.uniform3fv(skyU.uCamPos, cam.pos);
  gl.uniform3fv(skyU.uSunDir, SKY.sun);
  gl.uniform3fv(skyU.uZenith, SKY.zenith);
  gl.uniform3fv(skyU.uHorizon, SKY.horizon);
  gl.uniform3fv(skyU.uWarm, SKY.warm);
  gl.bindVertexArray(fsTri);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  countDraw(1);

  // terrain
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.useProgram(terrainProg);
  gl.uniformMatrix4fv(terrainU.uProj, false, proj);
  gl.uniformMatrix4fv(terrainU.uView, false, view);
  gl.uniform3fv(terrainU.uSunDir, SKY.sun);
  gl.uniform3fv(terrainU.uCamPos, cam.pos);
  gl.uniform3fv(terrainU.uZenith, SKY.zenith);
  gl.uniform3fv(terrainU.uHorizon, SKY.horizon);
  gl.uniform3fv(terrainU.uWarm, SKY.warm);
  gl.uniform1f(terrainU.uFogDensity, FOG_DENSITY);
  gl.uniform1f(terrainU.uFogNear, FOG_NEAR);
  gl.uniform1f(terrainU.uWaterLevel, waterLevel);
  gl.uniform1f(terrainU.uWetLevel, wetLevel);
  gl.uniform1f(terrainU.uTime, t); gl.uniform1i(terrainU.uUnderwater, camUnderwater ? 1 : 0);   // §14B caustics
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, freshTex);
  gl.uniform1i(terrainU.uFresh, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, materialTex);
  gl.uniform1i(terrainU.uMaterial, 1);
  drawTerrainChunks();
  drawContactShadows(view);   // §13.6 sun shadows on the ground, under the props (High/Ultra)

  // props & points of interest (instanced), before the transparent water
  drawProps(view);
  drawTools(view);
  drawDriftwood(view);
  drawSetPieces(view);
  drawBerryBushes(view);
  drawSacks(view);
  drawCampfires(view);
  drawGoats(view);
  drawNests(view);
  drawChests(view);
  drawStorage(view);
  drawSalt(view);
  drawLife(view);
  drawGulls(view);
  drawTells(view, dt);
  drawRipples(view);
  drawPlaceGhost(view);
  drawParticles(view);
  drawPlankton(view);   // §14B drifting marine snow / bioluminescence, underwater only
  drawDeepVisitor(view);   // §14B a large silhouette far off in the deep
  drawThrownSpears(view);  // §14C spears stuck in the ground / sinking
  drawBounds(view);

  // water
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(waterProg);
  gl.uniformMatrix4fv(waterU.uProj, false, proj);
  gl.uniformMatrix4fv(waterU.uView, false, view);
  gl.uniform3fv(waterU.uCamPos, cam.pos);
  gl.uniform3fv(waterU.uSunDir, SKY.sun);
  gl.uniform3fv(waterU.uZenith, SKY.zenith);
  gl.uniform3fv(waterU.uHorizon, SKY.horizon);
  gl.uniform3fv(waterU.uWarm, SKY.warm);
  gl.uniform1f(waterU.uTime, t);
  gl.uniform1f(waterU.uFogDensity, FOG_DENSITY);
  gl.uniform1f(waterU.uFogNear, FOG_NEAR);
  gl.uniform1f(waterU.uWaterLevel, waterLevel);
  gl.uniform1f(waterU.uWaterQ, GFX.water <= 0 ? 0.2 : 1);   // §13.6 flatter, foam-free water at low quality
  // snap the water sheet to the camera so wave detail stays nearby
  const wsnap = (WATER_HALF * 2) / 256;
  gl.uniform2f(waterU.uCenter, Math.round(cam.pos[0] / wsnap) * wsnap,
                               Math.round(cam.pos[2] / wsnap) * wsnap);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, heightTex);
  gl.uniform1i(waterU.uHeight, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, filledTex);
  gl.uniform1i(waterU.uFilled, 1);
  gl.bindVertexArray(water.vao);
  gl.drawElements(gl.TRIANGLES, water.count, gl.UNSIGNED_INT, 0);
  countDraw(water.count / 3);
  gl.disable(gl.BLEND);

  // §13.1 held tool in its own pass AFTER the world + water, with depth cleared and no fog,
  // so water, transparency and fog never blend into it (still goes through post → palette + dither)
  drawShovel(view);

  // ============ PASS 2: post → screen ============
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fbo.color);
  gl.uniform1i(postU.uScene, 0);
  gl.uniform2f(postU.uSceneSize, fbo.w, fbo.h);
  gl.uniform1i(postU.uDither, ditherOn ? 1 : 0);
  gl.uniform1i(postU.uQuantize, GFX.quantize ? 1 : 0);   // §13.6 palette quantization toggle
  gl.uniform1f(postU.uHungerFx, mode === "walk" && hunger < H_HUNGRY ? Math.min(1, (H_HUNGRY - hunger) / H_HUNGRY) : 0);
  gl.uniform1f(postU.uUnderwater, camUnderwater ? 1 : 0);   // §14A/B
  gl.uniform1f(postU.uBreathLow, camUnderwater ? breathLow : 0);
  gl.bindVertexArray(fsTri);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  countDraw(1);

  gl.bindVertexArray(null);
  if (camUnderwater) { FOG_DENSITY = _uwFogD; FOG_NEAR = _uwFogN; SKY.zenith = _uwSky.z; SKY.horizon = _uwSky.h; SKY.warm = _uwSky.w; }   // §14B restore

  // ---- hud ----
  // stamina ring near the crosshair — only visible while it isn't full (or flashing a "too tired" refusal, §13.2)
  if (staminaFlash > 0) staminaFlash = Math.max(0, staminaFlash - dt * 2.4);
  if (mode === "walk" && (stamina < 0.995 || staminaFlash > 0)) {
    const deg = Math.max(0, stamina) * 360;
    let col = stamina < 0.25 ? "#d9694e" : resting ? "#8fd0a0" : "#79bcc6";
    if (staminaFlash > 0) col = "#ff8a6b";
    staminaEl.style.display = "block";
    staminaEl.style.background = `conic-gradient(${col} ${deg}deg, rgba(255,255,255,.1) ${deg}deg 360deg)`;
    staminaEl.style.transform = staminaFlash > 0 ? `scale(${(1 + staminaFlash * 0.45).toFixed(3)})` : "";
    staminaEl.style.opacity = staminaFlash > 0 ? "1" : "";
  } else { staminaEl.style.display = "none"; staminaEl.style.transform = ""; staminaEl.style.opacity = ""; }
  // hunger arc — a smaller concentric arc, only at Hungry or worse
  const hTier = hungerTier(), hShow = mode === "walk" && (hTier === "hungry" || hTier === "starving");
  const hArc = document.getElementById("hungerArc");
  if (hShow) { const deg = Math.max(0.04, hunger) * 360, col = hTier === "starving" ? "#d05a46" : "#d59a4a";
    hArc.style.display = "block"; hArc.style.background = `conic-gradient(${col} ${deg}deg, rgba(255,255,255,.07) ${deg}deg 360deg)`;
    hArc.style.opacity = hTier === "starving" ? (0.6 + 0.3 * Math.abs(Math.sin(performance.now() * 0.005))) : 0.9;
  } else hArc.style.display = "none";
  // §14A breath arc — outside the stamina ring, only while submerged
  const bArc = document.getElementById("breathArc");
  if (mode === "walk" && player.underwater) {
    const frac = Math.max(0, player.breath / BREATH_MAX), deg = frac * 360;
    const col = frac < 0.3 ? "#e05a4a" : "#6fc4e0";
    bArc.style.display = "block";
    bArc.style.background = `conic-gradient(${col} ${deg}deg, rgba(255,255,255,.08) ${deg}deg 360deg)`;
    bArc.style.opacity = frac < 0.3 ? (0.6 + 0.4 * Math.abs(Math.sin(performance.now() * 0.009))) : 0.92;
  } else bArc.style.display = "none";
  if (IS_TOUCH) { const sw = (mode === "walk" && player.swimming) ? "flex" : "none";   // §14A swim up/down only while swimming
    document.querySelectorAll('.mBtn[data-act="swimup"], .mBtn[data-act="swimdown"]').forEach(b => { if (b.style.display !== sw) b.style.display = sw; });
    const cb = document.querySelector('.mBtn[data-act="climb"]');   // §15 climb button when grabbable or climbing
    if (cb) { const show = (mode === "walk" && (player.climbing || (!player.swimming && !!climbTargetInFront()))) ? "flex" : "none"; if (cb.style.display !== show) cb.style.display = show; } }
  document.getElementById("hotbar").style.display = (mode === "walk") ? "flex" : "none";
  // interaction indicator: a dot that becomes a soft-pulsing ring over anything in reach (§11.2)
  if (mode === "walk") {
    curTarget = targetAlongRay(rayFromNDC(0, 0), curTarget);
    const info = aimInfo();
    // §13.2 Tool Kit Auto: pick the right tool from what we're aiming at, before any click
    if (selectedItem() === "toolkit" && toolkit.mode === "auto" && !workLockActive()) {
      const need = info && (info.need === "axe" || info.need === "pickaxe" || info.need === "shovel") ? info.need : null;
      // never drop back to the shovel during or just after working an entity (§13.2)
      const blockShovel = need === "shovel" && clock.t - lastEntityHitT < 1;
      if (need && need !== toolkit.tool && !blockShovel) { toolkit.tool = need; renderHotbar(); }
    }
    if (info) {
      const dim = !aimAffordable(info);
      crossEl.className = "ring" + (dim ? " dim" : "");
      if (IS_TOUCH && info.obj) {                        // mobile: the ring floats over the object
        const sp = projectToScreen(info.x, surfaceAt(info.x, info.z).h + 0.8, info.z);
        if (sp) { crossEl.style.left = sp[0] + "px"; crossEl.style.top = sp[1] + "px"; crossEl.style.display = "block"; } else crossEl.style.display = "none";
      } else if (IS_TOUCH) { crossEl.style.display = "none"; }
      else { crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = "block"; }
      if (!lastAimShown) { lastAimShown = true;
        if (hintsOn && (hintCount.use || 0) < 3) { hintCount.use = (hintCount.use || 0) + 1; saveHints(); hintText = IS_TOUCH ? "tap to use" : "click / E to use"; hintT = 2.2; } }
    } else {
      crossEl.className = ""; lastAimShown = false;
      if (IS_TOUCH) crossEl.style.display = "none";
      else { crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = "block"; }
    }
    if (tooTiredT > 0) tooTiredT -= dt;
    if (hintT > 0) hintT -= dt;
    if (tooTiredT > 0) {   // §13.2 "Too tired" takes the prompt line and fades out over ~1s
      promptEl.textContent = "Too tired"; promptEl.style.display = "block";
      promptEl.style.color = "#ffbda6"; promptEl.style.opacity = Math.min(0.92, tooTiredT * 1.3).toFixed(2);
    } else if (hintT > 0) { promptEl.textContent = hintText; promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = ""; }
    else { promptEl.style.display = "none"; promptEl.style.color = ""; promptEl.style.opacity = ""; }
  } else { promptEl.style.display = "none"; crossEl.className = ""; crossEl.style.display = "none"; curTarget = null; }
  const titleUp = (mode === "preview" || mode === "intro");       // hide in-world readouts behind the title
  hud.style.display = titleUp ? "none" : "block";
  const helpEl = document.getElementById("help"); if (helpEl) helpEl.style.display = titleUp ? "none" : "";
  const tc = document.getElementById("tidecurve"); if (tc) tc.style.display = titleUp ? "none" : "";
  const ti = tideInfo();
  const mins = Math.floor(ti.tToLow / 60), secs = Math.floor(ti.tToLow % 60);
  if (!titleUp) hud.textContent =
    `seed ${SEED_STR}  ·  ${archetype}\n` +
    `tide ${ti.rising ? "▲ rising" : "▼ falling"}${ti.minusNow ? " ·· MINUS" : ""}  ·  low in ${mins}:${String(secs).padStart(2, "0")}` +
    `${clock.speed > 1 ? `  (${clock.speed}×)` : ""}${clock.paused ? "  (paused)" : ""}\n` +
    `mode ${mode}  ·  POIs ${POIS.map((p) => p.type).join(", ")}`;
  if (mode === "walk") drawTideCurve();
  updateBucketPanel();
  updateBucketLook();
  updateInspectView();

  if (debugOn) {
    dbgEl.style.display = "block";
    dbgEl.textContent =
      `fps   ${fpsSmooth.toFixed(0)}\n` +
      `draws ${frameDraws}\n` +
      `tris  ${(frameTris / 1000).toFixed(0)}k\n` +
      `res   ${fbo.w}x${fbo.h}\n` +
      `pos   ${cam.pos[0].toFixed(0)}, ${cam.pos[1].toFixed(0)}, ${cam.pos[2].toFixed(0)}\n` +
      `slope ${_curSlopeDeg.toFixed(0)}°  spd ×${_curSpeedMul.toFixed(2)}${player.sprinting ? " sprint" : ""}`;
  } else if (dbgEl.style.display !== "none") {
    dbgEl.style.display = "none";
  }

  requestAnimationFrame(frame);
}
booted = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
