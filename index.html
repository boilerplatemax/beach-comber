<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beachcomber</title>
<style>
  :root { --bg: #0e1418; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #eaf2f5; }
  #gl { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: pixelated; }

  /* Overlay / title */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    background: radial-gradient(130% 120% at 50% 35%, rgba(18,34,42,0.55), rgba(8,12,16,0.9));
    backdrop-filter: blur(2px); z-index: 10; transition: opacity .4s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 650; letter-spacing: .04em; }
  #overlay p { opacity: .8; max-width: 440px; line-height: 1.5; padding: 0 16px; }
  .seedline { font-family: ui-monospace, Menlo, Consolas, monospace; opacity: .7; font-size: 13px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; padding: 10px 22px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
    color: #eaf2f5; cursor: pointer; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,.16); }
  button:active { transform: translateY(1px); }
  button.primary { background: #2b6f78; border-color: #3f9aa5; }
  button.primary:hover { background: #357f8a; }

  /* HUD */
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 5; pointer-events: none;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    opacity: .75; line-height: 1.5; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #help {
    position: fixed; right: 12px; bottom: 12px; z-index: 5; pointer-events: none;
    font-size: 12px; opacity: .55; text-align: right; line-height: 1.5;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="overlay">
  <h1>Beachcomber</h1>
  <p>A procedurally generated island, grown entirely from a seed. Milestone 2: low-res dithered rendering, sky, fog & an animated ocean.</p>
  <div class="btns">
    <button id="startBtn" class="primary">Explore</button>
    <button id="newBtn">New island</button>
  </div>
  <div class="seedline">seed: <span id="seedText">…</span></div>
</div>

<div id="hud"></div>
<div id="help">
  WASD — move · Shift — run<br>
  Mouse — look · Esc — pause · G — dither
</div>

<script>
"use strict";
/* ===================================================================== *
 *  BEACHCOMBER  —  Milestone 2  (the "vibe engine")
 *  Low-res FBO + nearest upscale · Bayer dither + palette quantization
 *  View-ray sky gradient · distance fog · animated ocean w/ foam.
 *  Raw WebGL2, no libraries, no asset files.
 * ===================================================================== */

/* --------------------------------------------------------------------- *
 * § PRNG  (one seeded stream for ALL procedural generation)
 * --------------------------------------------------------------------- */

// xmur3: hash an arbitrary string into a well-mixed 32-bit integer seed.
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}

// mulberry32: tiny, fast, deterministic PRNG. Returns floats in [0,1).
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Resolve the seed: read ?seed=, or mint one (crypto entropy, not the stream)
// and write it back to the URL so the island can be shared.
function resolveSeed() {
  const params = new URLSearchParams(location.search);
  let seedStr = params.get("seed");
  if (!seedStr) {
    const buf = new Uint32Array(2);
    crypto.getRandomValues(buf);
    seedStr = (buf[0] >>> 0).toString(36) + (buf[1] >>> 0).toString(36);
    params.set("seed", seedStr);
    history.replaceState(null, "", location.pathname + "?" + params.toString());
  }
  return seedStr;
}

const SEED_STR = resolveSeed();
const SEED_INT = xmur3(SEED_STR)();
const rng = mulberry32(SEED_INT);   // <-- the single shared stream

// Convenience: a fresh independent sub-stream seeded from the main stream,
// so each generator can be reordered later without disturbing the others.
function subStream() { return mulberry32((rng() * 4294967296) >>> 0); }

/* --------------------------------------------------------------------- *
 * § NOISE  (seeded value noise + fbm)
 * --------------------------------------------------------------------- */

function makeNoise(rand) {
  // Permutation table + per-lattice random values, both seeded.
  const perm = new Uint8Array(512);
  const vals = new Float32Array(256);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {           // Fisher–Yates shuffle
    const j = (rand() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) vals[i] = rand();

  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (ix, iy) => perm[(ix + perm[iy & 255]) & 255];

  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fade(fx), uy = fade(fy);
    const v00 = vals[hash(ix,     iy)];
    const v10 = vals[hash(ix + 1, iy)];
    const v01 = vals[hash(ix,     iy + 1)];
    const v11 = vals[hash(ix + 1, iy + 1)];
    return lerp(lerp(v00, v10, ux), lerp(v01, v11, ux), uy); // [0,1]
  }

  // Fractal Brownian motion: summed octaves, normalized to [0,1].
  function fbm(x, y, octaves, lacunarity, gain) {
    let amp = 0.5, freq = 1.0, sum = 0, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += amp * noise2(x * freq, y * freq);
      norm += amp;
      amp *= gain;
      freq *= lacunarity;
    }
    return sum / norm;
  }

  return { noise2, fbm };
}

/* --------------------------------------------------------------------- *
 * § WORLD CONFIG
 * --------------------------------------------------------------------- */

const GRID = 384;             // heightmap resolution (GRID x GRID)
const WORLD = 1200.0;         // island spans WORLD world-units (big, so you feel small)
const HALF = WORLD * 0.5;
const CELL = WORLD / (GRID - 1);
const SEA_LEVEL = 0.0;        // water sits at y = 0

/* --------------------------------------------------------------------- *
 * § TERRAIN CHARACTER  (every seed is unique: it sets continuous shaping
 *   parameters, then a stack of noise fields — domain warp for organic
 *   shapes, a macro field that patchworks plains vs. mountains, ridged
 *   multifractal for sharp peaks & rock formations, rolling fbm hills, and
 *   basin/pool noise for inland lakes, lagoons & tide pools. A tidal-shelf
 *   profile keeps wide gentle intertidal margins near the waterline.)
 * --------------------------------------------------------------------- */

// A light flavour label (kept for the HUD / future content hooks).
const CHARACTER = (function (r) {
  const x = r();                         // FIRST draw from the stream
  if (x < 0.30) return "lowlands";
  if (x < 0.68) return "highlands";
  if (x < 0.88) return "peaks";
  return "atoll";
})(rng);

// Continuous, seed-jittered parameters — no two islands are shaped alike.
const AP = (function (r, ch) {
  const gentle = ch === "lowlands", big = ch === "peaks", atoll = ch === "atoll";
  return {
    character:  ch,
    warp:       0.05 + 0.10 * r(),        // domain-warp strength (organic shapes)
    coastWarp:  0.22 + 0.34 * r(),        // coastline irregularity (bays/capes)
    coastInner: 0.28 + 0.14 * r(),        // full-land radius
    coastOuter: 0.60 + 0.16 * r(),        // where land fades into sea
    baseAmp:    0.10 + 0.12 * r(),        // gentle land body above the shelf
    hillFreq:   2.4 + 2.2 * r(),          // rolling-hill scale
    ridgeFreq:  1.4 + 1.8 * r(),          // mountain-ridge scale
    macroFreq:  0.8 + 0.7 * r(),          // scale of the plains/mountains patchwork
    mtn:        (gentle ? 0.25 : big ? 1.05 : 0.6) + 0.35 * r(),  // mountain intensity
    ridgeLo:    0.40 + 0.10 * r(),        // macro threshold where mountains begin
    lakeFreq:   1.1 + 1.0 * r(),
    lakeAmt:    (atoll ? 1.1 : 0.5) + 0.4 * r(),  // inland-water prevalence
    lakeDepth:  5.0 + 7.0 * r(),
    poolFreq:   6.0 + 5.0 * r(),
    heightScale:(gentle ? 95 : big ? 250 : 165) + 55 * r(),      // vertical scale
  };
})(rng, CHARACTER);
const archetype = CHARACTER;   // HUD alias

// Independent noise fields (fixed draw order → deterministic per seed).
const nWarpX = makeNoise(subStream());
const nWarpY = makeNoise(subStream());
const nCoast = makeNoise(subStream());
const nHills = makeNoise(subStream());
const nRidge = makeNoise(subStream());
const nMacro = makeNoise(subStream());
const nBasin = makeNoise(subStream());
const nPool  = makeNoise(subStream());

// Ridged multifractal → sharp mountain ridgelines & rock formations.
function ridgedMF(n, x, y, oct) {
  let sum = 0, amp = 0.5, freq = 1.0, norm = 0, prev = 1.0;
  for (let o = 0; o < oct; o++) {
    let r = 1.0 - Math.abs(2.0 * n.noise2(x * freq, y * freq) - 1.0); // 0..1
    r *= r;
    sum += r * amp * prev;        // prev-weighting sharpens the ridges
    prev = r;
    norm += amp;
    amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}

const SEA_THRESH = 0.16;     // elevation field value that maps to the waterline
const SHELF_POW = 1.45;      // >1 flattens near shore → wide tidal margins, but
                             // gentle enough that dunes & interior still rise

const heightmap = new Float32Array(GRID * GRID);

function buildHeightmap() {
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const u = x / (GRID - 1);
      const v = z / (GRID - 1);

      // Domain warp → organic, non-radial shapes (peninsulas, inlets).
      const wu = u + (nWarpX.fbm(u * 1.6, v * 1.6, 4, 2, 0.5) - 0.5) * AP.warp;
      const wv = v + (nWarpY.fbm(u * 1.6 + 3.1, v * 1.6 + 1.7, 4, 2, 0.5) - 0.5) * AP.warp;

      // Irregular coastline → island mask (1 inland … 0 open sea).
      const dx = u - 0.5, dz = v - 0.5;
      let d = Math.sqrt(dx * dx + dz * dz) * 2.0;
      d += (nCoast.fbm(u * 2.2, v * 2.2, 4, 2, 0.5) - 0.5) * AP.coastWarp;
      const land = smoothstep(AP.coastOuter, AP.coastInner, d);   // reversed → 1 inside

      // Relief: rolling hills + ridged mountains, patch-worked by a macro field
      // so each island has its own layout of plains, ranges and rock formations.
      const macro = nMacro.fbm(wu * AP.macroFreq, wv * AP.macroFreq, 3, 2, 0.5);
      const mtnMask = smoothstep(AP.ridgeLo, AP.ridgeLo + 0.26, macro);
      const rolling = nHills.fbm(wu * AP.hillFreq, wv * AP.hillFreq, 6, 2, 0.5);
      const ridges = ridgedMF(nRidge, wu * AP.ridgeFreq, wv * AP.ridgeFreq, 5);
      const relief = rolling * 0.45 + mtnMask * ridges * AP.mtn;

      // Elevation field: highest inland, tapering to the coast.
      const elev = land * (AP.baseAmp + relief);

      // Tidal-shelf profile → wide gentle intertidal margins, real relief inland.
      const e0 = elev - SEA_THRESH;
      let height = Math.sign(e0) * Math.pow(Math.abs(e0), SHELF_POW) * AP.heightScale;

      // Inland bodies of water: carve basins (lakes / lagoons) where basin noise
      // is low — the global water plane fills anything below sea level.
      const basin = nBasin.fbm(wu * AP.lakeFreq, wv * AP.lakeFreq, 4, 2, 0.5);
      const lake = smoothstep(0.46, 0.30, basin) * land * AP.lakeAmt;
      height -= lake * AP.lakeDepth;

      // Tide pools: fine dimples in the intertidal band (height near the shore).
      const band = 1.0 - smoothstep(0.0, 4.0, Math.abs(height - 0.5));
      const pool = nPool.fbm(u * AP.poolFreq, v * AP.poolFreq, 3, 2, 0.5);
      height -= band * smoothstep(0.58, 0.72, pool) * 2.4;

      // Deepen toward open sea so the island reads as surrounded (and bounds you).
      height -= smoothstep(AP.coastInner, 1.5, d) * 14.0;

      heightmap[z * GRID + x] = height;
    }
  }
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// Bilinear height query in world space (used by later milestones).
function heightAt(wx, wz) {
  const gx = (wx + HALF) / CELL;
  const gz = (wz + HALF) / CELL;
  const x0 = Math.floor(gx), z0 = Math.floor(gz);
  if (x0 < 0 || z0 < 0 || x0 >= GRID - 1 || z0 >= GRID - 1) return -8.0;
  const fx = gx - x0, fz = gz - z0;
  const h00 = heightmap[z0 * GRID + x0];
  const h10 = heightmap[z0 * GRID + x0 + 1];
  const h01 = heightmap[(z0 + 1) * GRID + x0];
  const h11 = heightmap[(z0 + 1) * GRID + x0 + 1];
  const a = h00 + (h10 - h00) * fx;
  const b = h01 + (h11 - h01) * fx;
  return a + (b - a) * fz;
}

/* --------------------------------------------------------------------- *
 * § ATMOSPHERE  (sun + sky/fog palette driven by one timeOfDay value;
 *                Phase 5 will animate timeOfDay, nothing else changes.)
 * --------------------------------------------------------------------- */

let timeOfDay = 0.34;                 // 0..1 (fixed overcast mood for now)
const FOG_DENSITY = 0.0016;           // see far across the big landscape, still hazy
const FOG_NEAR = 50.0;                // clear band before fog ramps in

// Cohesive eerie-cozy, overcast, early-2000s palette.
const SKY = {
  zenith:  [0.42, 0.54, 0.63],        // cool blue-grey overhead
  horizon: [0.78, 0.77, 0.72],        // pale warm haze at the horizon
  warm:    [1.00, 0.92, 0.78],        // soft sun tint
  sun:     [0, 0, 0],                 // filled by updateSun()
};

function updateSun() {
  // Low sun for long, soft light. (Later: derive elevation/azimuth from time.)
  const el = 0.46, az = 0.85;         // radians
  const ce = Math.cos(el), se = Math.sin(el);
  SKY.sun = [ce * Math.sin(az), se, -ce * Math.cos(az)];
}
updateSun();

/* --------------------------------------------------------------------- *
 * § MATH  (column-major mat4)
 * --------------------------------------------------------------------- */

const M4 = {
  perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0,
    ]);
  },
  lookAt(eye, center, up) {
    const zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
    let zl = Math.hypot(zx, zy, zz) || 1;
    const z = [zx/zl, zy/zl, zz/zl];
    let xx = up[1]*z[2] - up[2]*z[1];
    let xy = up[2]*z[0] - up[0]*z[2];
    let xz = up[0]*z[1] - up[1]*z[0];
    let xl = Math.hypot(xx, xy, xz) || 1;
    const x = [xx/xl, xy/xl, xz/xl];
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
      -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
      -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),
      1,
    ]);
  },
  // result = a * b  (both column-major)
  multiply(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++)
      for (let r = 0; r < 4; r++)
        o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    return o;
  },
  invert(m) {
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
    const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
    const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
    const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
    const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
    const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
    const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    const o = new Float32Array(16);
    if (!det) return o;
    det = 1.0/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det;  o[1]=(a02*b10-a01*b11-a03*b09)*det;
    o[2]=(a31*b05-a32*b04+a33*b03)*det;  o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;  o[5]=(a00*b11-a02*b08+a03*b07)*det;
    o[6]=(a32*b02-a30*b05-a33*b01)*det;  o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;  o[9]=(a01*b08-a00*b10-a03*b06)*det;
    o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
    o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  },
};

/* --------------------------------------------------------------------- *
 * § GL  helpers
 * --------------------------------------------------------------------- */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
if (!gl) alert("WebGL2 is required for this game.");
const floatLinear = gl.getExtension("OES_texture_float_linear");

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + "\n" + src);
  return s;
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}
// Collect every active uniform's location into a lookup object.
function uniforms(p) {
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return u;
}

// Shared GLSL: the ONE sky function, injected into sky/terrain/water so fog
// melts seamlessly into the sky. Pure function — no uniform-name coupling.
const SKY_GLSL = `
vec3 skyColor(vec3 dir, vec3 sunDir, vec3 zen, vec3 hor, vec3 warm) {
  dir = normalize(dir);
  float t = clamp(dir.y * 1.4 + 0.15, 0.0, 1.0);
  vec3 col = mix(hor, zen, pow(t, 0.65));
  col = mix(col, hor * 0.92, clamp(-dir.y * 3.0, 0.0, 1.0));   // soft below-horizon
  float s = max(dot(dir, normalize(sunDir)), 0.0);
  col += warm * pow(s, 48.0) * 0.9;    // tight sun disc
  col += warm * pow(s, 7.0)  * 0.12;   // broad glow
  return col;
}`;

/* --------------------------------------------------------------------- *
 * § TERRAIN  (indexed mesh; flat shading, banded color, fog → sky)
 * --------------------------------------------------------------------- */

const terrainVS = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
in vec3 aPos;
out vec3 vWorld;
void main() {
  vWorld = aPos;
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}`;

const terrainFS = `#version 300 es
precision highp float;
in vec3 vWorld;
out vec4 frag;
uniform vec3 uSunDir, uCamPos, uZenith, uHorizon, uWarm;
uniform float uFogDensity, uFogNear;
${SKY_GLSL}
void main() {
  // Flat shading: face normal from screen-space derivatives of world pos.
  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
  if (n.y < 0.0) n = -n;
  float h = vWorld.y;
  float slope = 1.0 - clamp(n.y, 0.0, 1.0);

  vec3 cSeafloor = vec3(0.42, 0.46, 0.40);
  vec3 cSandWet  = vec3(0.74, 0.67, 0.51);
  vec3 cSandDry  = vec3(0.87, 0.79, 0.60);
  vec3 cGrass    = vec3(0.44, 0.53, 0.31);
  vec3 cForest   = vec3(0.23, 0.35, 0.21);
  vec3 cRock     = vec3(0.46, 0.43, 0.40);

  vec3 col = cSeafloor;
  col = mix(col, cSandWet, smoothstep(-2.0, 0.15, h));
  col = mix(col, cSandDry, smoothstep(0.2, 1.4, h));
  col = mix(col, cGrass,   smoothstep(2.0, 4.5, h));
  col = mix(col, cForest,  smoothstep(8.0, 13.0, h));
  col = mix(col, cRock,    smoothstep(0.35, 0.62, slope));

  // Directional light: warm in the sun, gently cool in shadow.
  float diff = max(dot(n, normalize(uSunDir)), 0.0);
  col *= (0.55 + 0.55 * diff);
  col *= mix(vec3(0.88, 0.91, 0.99), uWarm, diff);

  // Distance fog → the sky color for this fragment's own view direction.
  vec3 viewVec = vWorld - uCamPos;
  float dist = length(viewVec);
  float fd = max(dist - uFogNear, 0.0) * uFogDensity;
  float fog = 1.0 - exp(-fd * fd);
  vec3 fogCol = skyColor(viewVec, uSunDir, uZenith, uHorizon, uWarm);
  col = mix(col, fogCol, fog);

  frag = vec4(col, 1.0);
}`;

const terrainProg = program(terrainVS, terrainFS);
const terrainU = uniforms(terrainProg);

function buildTerrainMesh() {
  const positions = new Float32Array(GRID * GRID * 3);
  let p = 0;
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      positions[p++] = x * CELL - HALF;
      positions[p++] = heightmap[z * GRID + x];
      positions[p++] = z * CELL - HALF;
    }
  }
  const indices = new Uint32Array((GRID - 1) * (GRID - 1) * 6);
  let i = 0;
  for (let z = 0; z < GRID - 1; z++) {
    for (let x = 0; x < GRID - 1; x++) {
      const a = z * GRID + x, b = a + 1, c = a + GRID, d = c + 1;
      indices[i++] = a; indices[i++] = c; indices[i++] = b;
      indices[i++] = b; indices[i++] = c; indices[i++] = d;
    }
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(terrainProg, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: indices.length };
}

/* --------------------------------------------------------------------- *
 * § HEIGHT TEXTURE  (heightmap sampled by the ocean shaders)
 * --------------------------------------------------------------------- */

function buildHeightTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, heightmap);
  const hf = floatLinear ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

/* --------------------------------------------------------------------- *
 * § WATER  (dense grid, summed-sine waves, shoreline foam, transparency)
 * --------------------------------------------------------------------- */

const HALF_F = HALF.toFixed(1);
const WORLD_F = WORLD.toFixed(1);

const waterVS = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
uniform float uTime;
uniform vec2 uCenter;          // grid follows the camera across the big map
uniform sampler2D uHeight;
in vec2 aXZ;
out vec3 vWorld;

float waveH(vec2 p, float t) {
  float h = 0.0;
  h += sin(p.x * 0.18 + t * 0.9) * 0.35;
  h += sin(p.y * 0.15 - t * 0.7) * 0.30;
  h += sin((p.x + p.y) * 0.09 + t * 1.3) * 0.18;
  h += sin((p.x - p.y) * 0.22 - t * 1.7) * 0.10;
  return h;
}
void main() {
  vec2 xz = aXZ + uCenter;
  vec2 uv = clamp((xz + ${HALF_F}) / ${WORLD_F}, 0.0, 1.0);
  float terr = texture(uHeight, uv).r;
  float depth = max(0.0, -terr);
  float damp = smoothstep(0.0, 2.0, depth);      // calm the waves in shallows
  float wy = waveH(xz, uTime) * damp;
  vWorld = vec3(xz.x, wy, xz.y);
  gl_Position = uProj * uView * vec4(vWorld, 1.0);
}`;

const waterFS = `#version 300 es
precision highp float;
in vec3 vWorld;
out vec4 frag;
uniform vec3 uCamPos, uSunDir, uZenith, uHorizon, uWarm;
uniform float uTime, uFogDensity, uFogNear;
uniform sampler2D uHeight;
${SKY_GLSL}
void main() {
  vec2 uv = clamp((vWorld.xz + ${HALF_F}) / ${WORLD_F}, 0.0, 1.0);
  float terr = texture(uHeight, uv).r;
  if (terr > 0.08) discard;                       // don't draw water on land
  float depth = -terr;                            // >0 = underwater depth

  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));  // faceted wave normals
  if (n.y < 0.0) n = -n;
  vec3 v = normalize(uCamPos - vWorld);

  vec3 deep    = vec3(0.05, 0.20, 0.26);
  vec3 shallow = vec3(0.30, 0.52, 0.52);
  float dmix = smoothstep(0.0, 6.0, depth);
  vec3 col = mix(shallow, deep, dmix);

  // Light sky reflection (fresnel) + a warm sun glint.
  vec3 refl = reflect(-v, n);
  vec3 skyR = skyColor(refl, uSunDir, uZenith, uHorizon, uWarm);
  float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  col = mix(col, skyR, fres * 0.5);
  vec3 r = reflect(-normalize(uSunDir), n);
  col += uWarm * pow(max(dot(v, r), 0.0), 48.0) * 0.6;

  // Foam band hugging the shoreline, animated so it laps.
  float lap = sin(vWorld.x * 0.6 + uTime * 2.0) * sin(vWorld.z * 0.55 - uTime * 1.6);
  float band = 1.0 - smoothstep(0.0, 1.3, depth);
  float foam = clamp(band * (0.5 + 0.5 * lap), 0.0, 1.0);
  col = mix(col, vec3(0.92, 0.95, 0.95), foam * 0.85);

  // Transparent over shallows (sand shows through), opaque in deep water.
  float alpha = mix(0.4, 0.9, dmix);
  alpha = max(alpha, foam * 0.9);

  // Fog → sky; fully-fogged water becomes opaque sky so no far edge shows.
  vec3 viewVec = vWorld - uCamPos;
  float dist = length(viewVec);
  float fd = max(dist - uFogNear, 0.0) * uFogDensity;
  float fog = 1.0 - exp(-fd * fd);
  vec3 fogCol = skyColor(viewVec, uSunDir, uZenith, uHorizon, uWarm);
  col = mix(col, fogCol, fog);
  alpha = mix(alpha, 1.0, fog);

  frag = vec4(col, alpha);
}`;

const waterProg = program(waterVS, waterFS);
const waterU = uniforms(waterProg);

const WATER_HALF = 820.0;             // half-extent of the camera-following sheet
function buildWaterMesh() {
  const WHALF = WATER_HALF, SEG = 256; // covers out to the fog; follows the camera
  const n = SEG + 1;
  const pos = new Float32Array(n * n * 2);
  let k = 0;
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      pos[k++] = -WHALF + (i / SEG) * WHALF * 2;
      pos[k++] = -WHALF + (j / SEG) * WHALF * 2;
    }
  const idx = new Uint32Array(SEG * SEG * 6);
  let m = 0;
  for (let j = 0; j < SEG; j++)
    for (let i = 0; i < SEG; i++) {
      const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
      idx[m++] = a; idx[m++] = c; idx[m++] = b;
      idx[m++] = b; idx[m++] = c; idx[m++] = d;
    }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(waterProg, "aXZ");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: idx.length };
}

/* --------------------------------------------------------------------- *
 * § SKY  (fullscreen view-ray gradient, drawn as scene background)
 * --------------------------------------------------------------------- */

const fsTriVS = `#version 300 es
precision highp float;
in vec2 aClip;
out vec2 vNdc;
out vec2 vUv;
void main() {
  vNdc = aClip;
  vUv = aClip * 0.5 + 0.5;
  gl_Position = vec4(aClip, 1.0, 1.0);
}`;

const skyFS = `#version 300 es
precision highp float;
in vec2 vNdc;
out vec4 frag;
uniform mat4 uInvVP;
uniform vec3 uCamPos, uSunDir, uZenith, uHorizon, uWarm;
${SKY_GLSL}
void main() {
  vec4 world = uInvVP * vec4(vNdc, 1.0, 1.0);   // unproject far plane
  vec3 dir = normalize(world.xyz / world.w - uCamPos);
  frag = vec4(skyColor(dir, uSunDir, uZenith, uHorizon, uWarm), 1.0);
}`;

const skyProg = program(fsTriVS, skyFS);
const skyU = uniforms(skyProg);

function buildFsTri() {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(skyProg, "aClip");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return vao;
}

/* --------------------------------------------------------------------- *
 * § POST  (nearest upscale + Bayer dither + palette quantization)
 * --------------------------------------------------------------------- */

const postFS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform sampler2D uScene;
uniform vec2 uSceneSize;
uniform int uDither;
const float bayer[16] = float[16](
  0.0, 8.0, 2.0, 10.0,  12.0, 4.0, 14.0, 6.0,
  3.0, 11.0, 1.0, 9.0,  15.0, 7.0, 13.0, 5.0);
void main() {
  vec3 c = clamp(texture(uScene, vUv).rgb, 0.0, 1.0);
  float levels = 8.0;
  ivec2 p = ivec2(vUv * uSceneSize);            // low-res texel → chunky pattern
  int idx = (p.x & 3) * 4 + (p.y & 3);
  vec3 q;
  if (uDither == 1) q = floor(c * levels + bayer[idx] / 16.0) / levels;
  else              q = floor(c * levels + 0.5) / levels;
  frag = vec4(q, 1.0);
}`;

const postProg = program(fsTriVS, postFS);
const postU = uniforms(postProg);

// Low-res scene framebuffer (reallocated only when its size changes).
const fbo = { w: 0, h: 0, fb: null, color: null, depth: null };
function ensureFBO() {
  const aspect = canvas.width / canvas.height;
  const w = IS_TOUCH ? 300 : 400;
  const h = Math.max(1, Math.round(w / aspect));
  if (w === fbo.w && h === fbo.h) return;
  fbo.w = w; fbo.h = h;
  if (!fbo.fb) {
    fbo.fb = gl.createFramebuffer();
    fbo.color = gl.createTexture();
    fbo.depth = gl.createRenderbuffer();
  }
  gl.bindTexture(gl.TEXTURE_2D, fbo.color);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindRenderbuffer(gl.RENDERBUFFER, fbo.depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbo.color, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fbo.depth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* --------------------------------------------------------------------- *
 * § CAMERA  (free-fly; walker + head-bob come in Phase 3)
 * --------------------------------------------------------------------- */

const cam = { pos: [0, 150, 700], yaw: 0, pitch: -0.14, speed: 120 };

// Modes: "preview" = slow orbit of the island (title screen); "walk" = first
// person on foot; "free" = debug fly (enabled by ?cam=).
let mode = "preview";
let previewAngle = 0;

// Optional ?cam=x,y,z[,yaw,pitch] — share a seed together with a viewpoint.
(function camFromURL() {
  const p = new URLSearchParams(location.search).get("cam");
  if (!p) return;
  const a = p.split(",").map(Number);
  if (a.length >= 3 && a.every((n) => isFinite(n))) cam.pos = [a[0], a[1], a[2]];
  if (a.length >= 4) cam.yaw = a[3];
  if (a.length >= 5) cam.pitch = a[4];
  mode = "free";
})();
function camForward() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [Math.sin(cam.yaw) * cp, sp, -Math.cos(cam.yaw) * cp];
}

/* --------------------------------------------------------------------- *
 * § PLAYER  (first-person walker: follows the terrain with a gentle head
 *   bob and can't wade into deep water, so the sea bounds the island.)
 * --------------------------------------------------------------------- */

const EYE = 1.7;              // eye height above the ground
const WALK_SPEED = 9.5;       // units / second (vast map, so not too slow)
const WADE_LIMIT = -1.4;      // can't step where the ground is deeper than this
const player = { x: 0, z: 0, bob: 0 };

// Spawn on a beach: march inland from a seeded bearing to the first dry land.
function findSpawn() {
  const ang = rng() * Math.PI * 2;
  const dx = Math.sin(ang), dz = -Math.cos(ang);
  for (let rr = HALF * 0.95; rr > 0; rr -= 4) {
    const h = heightAt(dx * rr, dz * rr);
    if (h > 1.2) {                                  // first land above water
      const sx = dx * (rr - 12), sz = dz * (rr - 12);  // a few steps inland
      return { x: sx, z: sz, yaw: Math.atan2(-sx, sz) };  // face inland
    }
  }
  return { x: 0, z: 0, yaw: 0 };
}

function enterWalk() {
  const s = findSpawn();
  player.x = s.x; player.z = s.z; player.bob = 0;
  cam.yaw = s.yaw; cam.pitch = -0.02;
  mode = "walk";
}

/* --------------------------------------------------------------------- *
 * § INPUT
 * --------------------------------------------------------------------- */

const keys = Object.create(null);
let ditherOn = true;

// Single flag for the (temporary) mobile build; drives lower res too.
const IS_TOUCH = matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0;
// Analog movement axis (mobile joystick writes here; stays 0 on desktop).
const analog = { x: 0, y: 0 };   // x = strafe, y = forward, each -1..1
addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyG") ditherOn = !ditherOn;
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

canvas.addEventListener("click", () => {
  if (IS_TOUCH) return;   // no pointer lock on touch devices
  if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
});
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== canvas) return;
  const s = 0.0022;
  cam.yaw += e.movementX * s;
  cam.pitch -= e.movementY * s;
  const lim = Math.PI / 2 - 0.02;
  cam.pitch = Math.max(-lim, Math.min(lim, cam.pitch));
});
addEventListener("wheel", (e) => {
  cam.speed = Math.max(8, Math.min(160, cam.speed * (e.deltaY < 0 ? 1.12 : 0.89)));
}, { passive: true });

/* --------------------------------------------------------------------- *
 * § UI
 * --------------------------------------------------------------------- */

const overlay = document.getElementById("overlay");
document.getElementById("seedText").textContent = SEED_STR;
document.getElementById("startBtn").addEventListener("click", () => {
  overlay.classList.add("hidden");
  if (mode === "preview") enterWalk();      // first time: step onto the island
  if (!IS_TOUCH) canvas.requestPointerLock();
});
document.getElementById("newBtn").addEventListener("click", () => {
  const buf = new Uint32Array(2);
  crypto.getRandomValues(buf);
  const s = (buf[0] >>> 0).toString(36) + (buf[1] >>> 0).toString(36);
  location.href = location.pathname + "?seed=" + s;
});
document.addEventListener("pointerlockchange", () => {
  if (document.pointerLockElement !== canvas) overlay.classList.remove("hidden");
});
const hud = document.getElementById("hud");

/* ===================================================================== *
 * § MOBILE CONTROLS  (TEMPORARY — delete this whole block to remove)
 *   Activates only on touch devices via the IS_TOUCH flag; desktop is
 *   untouched. Self-contained: injects its own CSS + DOM + handlers, and
 *   only writes to `analog` (movement) and `cam` (look). Left half of the
 *   screen = floating joystick; right half = drag to look; on-screen
 *   Pick up / Journal / Pause buttons. Blocks page scroll / zoom / menus.
 * ===================================================================== */
if (IS_TOUCH) (function mobileControls() {
  let lookSensMobile = 0.0045;   // becomes a Settings slider in Phase 6

  // ---- injected styles ----
  const css = document.createElement("style");
  css.textContent = `
    html, body { touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; }
    #mUI { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
    #mLayer { position: absolute; inset: 0; pointer-events: auto; }
    #mJoy { position: absolute; width: 120px; height: 120px; margin:-60px 0 0 -60px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.08); display: none; }
    #mKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
      margin: -26px 0 0 -26px; border-radius: 50%;
      background: rgba(255,255,255,.35); }
    #mBtns { position: absolute; right: 16px; bottom: 22px; display: flex;
      flex-direction: column; gap: 12px; pointer-events: auto; }
    .mBtn { width: 76px; height: 48px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.3); background: rgba(10,20,24,.5);
      color: #eaf2f5; font: 600 13px system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; }
    .mBtn:active { background: rgba(60,120,130,.6); }
    #mRotate { position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #0e1418; color: #eaf2f5; font: 500 18px system-ui, sans-serif;
      padding: 0 32px; line-height: 1.6; }`;
  document.head.appendChild(css);

  // ---- injected DOM ----
  const ui = document.createElement("div");
  ui.id = "mUI";
  ui.innerHTML =
    `<div id="mLayer"></div>
     <div id="mJoy"><div id="mKnob"></div></div>
     <div id="mBtns">
       <div class="mBtn" data-key="KeyE">Pick up</div>
       <div class="mBtn" data-key="Tab">Journal</div>
       <div class="mBtn" data-act="pause">Pause</div>
     </div>`;
  document.body.appendChild(ui);
  const rotate = document.createElement("div");
  rotate.id = "mRotate";
  rotate.textContent = "Rotate your device to landscape to play.";
  document.body.appendChild(rotate);

  const layer = ui.querySelector("#mLayer");
  const joy = ui.querySelector("#mJoy");
  const knob = ui.querySelector("#mKnob");
  const JOY_R = 48;

  // ---- unlock synthesized audio on first touch (Phase 6 fills startAudio) ----
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (typeof window.startAudio === "function") window.startAudio();
  }

  // ---- forward a button press as a key event (Phase 4 adds E / Journal) ----
  function tapKey(code) {
    dispatchEvent(new KeyboardEvent("keydown", { code }));
    setTimeout(() => dispatchEvent(new KeyboardEvent("keyup", { code })), 60);
  }

  // ---- buttons ----
  ui.querySelectorAll(".mBtn").forEach((btn) => {
    btn.addEventListener("touchstart", (e) => {
      e.preventDefault(); e.stopPropagation();
      unlockAudio();
      if (btn.dataset.act === "pause") overlay.classList.remove("hidden");
      else tapKey(btn.dataset.key);
    }, { passive: false });
  });

  // ---- joystick (left half) + look (right half), multi-touch ----
  let moveId = null, lookId = null;
  const origin = { x: 0, y: 0 }, lookLast = { x: 0, y: 0 };

  layer.addEventListener("touchstart", (e) => {
    unlockAudio();
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth * 0.5 && moveId === null) {
        moveId = t.identifier;
        origin.x = t.clientX; origin.y = t.clientY;
        joy.style.left = t.clientX + "px";
        joy.style.top = t.clientY + "px";
        joy.style.display = "block";
        knob.style.left = "50%"; knob.style.top = "50%";
      } else if (lookId === null) {
        lookId = t.identifier;
        lookLast.x = t.clientX; lookLast.y = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });

  layer.addEventListener("touchmove", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === moveId) {
        let dx = t.clientX - origin.x, dy = t.clientY - origin.y;
        const len = Math.hypot(dx, dy);
        if (len > JOY_R) { dx *= JOY_R / len; dy *= JOY_R / len; }
        analog.x = dx / JOY_R;
        analog.y = -dy / JOY_R;                 // push up = forward
        knob.style.left = 60 + dx + "px";
        knob.style.top = 60 + dy + "px";
      } else if (t.identifier === lookId) {
        cam.yaw += (t.clientX - lookLast.x) * lookSensMobile;
        cam.pitch -= (t.clientY - lookLast.y) * lookSensMobile;
        const lim = Math.PI / 2 - 0.02;
        cam.pitch = Math.max(-lim, Math.min(lim, cam.pitch));
        lookLast.x = t.clientX; lookLast.y = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });

  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === moveId) {
        moveId = null; analog.x = 0; analog.y = 0; joy.style.display = "none";
      } else if (t.identifier === lookId) {
        lookId = null;
      }
    }
  }
  layer.addEventListener("touchend", endTouch);
  layer.addEventListener("touchcancel", endTouch);

  // ---- block page scroll / pull-to-refresh / pinch-zoom / long-press menu ----
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---- rotate-to-landscape hint in portrait ----
  function orient() {
    rotate.style.display = innerHeight > innerWidth ? "flex" : "none";
  }
  addEventListener("resize", orient);
  addEventListener("orientationchange", orient);
  orient();
})();

/* --------------------------------------------------------------------- *
 * § BUILD + LOOP
 * --------------------------------------------------------------------- */

buildHeightmap();
const terrain = buildTerrainMesh();
const water = buildWaterMesh();
const heightTex = buildHeightTexture();
const fsTri = buildFsTri();

let proj = new Float32Array(16);
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, IS_TOUCH ? 1 : 2);
  const w = Math.floor(innerWidth * dpr);
  const h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  proj = M4.perspective(Math.PI / 3, canvas.width / canvas.height, 0.1, 3200);
  ensureFBO();
}
addEventListener("resize", resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now * 0.001;

  // ---- movement ----
  const fwd = camForward();
  const flen = Math.hypot(fwd[0], fwd[2]) || 1;
  const right = [fwd[2] / flen, 0, -fwd[0] / flen];

  if (mode === "preview") {
    // slow establishing orbit of the island
    previewAngle += dt * 0.04;
    const R = 720, H = 155;
    cam.pos[0] = Math.sin(previewAngle) * R;
    cam.pos[1] = H;
    cam.pos[2] = Math.cos(previewAngle) * R;
    cam.yaw = Math.atan2(-cam.pos[0], cam.pos[2]);
    cam.pitch = -0.15;
  } else if (mode === "free") {
    // debug fly
    let mx = 0, my = 0, mz = 0;
    if (keys["KeyW"]) { mx += fwd[0]; my += fwd[1]; mz += fwd[2]; }
    if (keys["KeyS"]) { mx -= fwd[0]; my -= fwd[1]; mz -= fwd[2]; }
    if (keys["KeyD"]) { mx += right[0]; mz += right[2]; }
    if (keys["KeyA"]) { mx -= right[0]; mz -= right[2]; }
    if (keys["Space"]) my += 1;
    if (keys["ShiftLeft"] || keys["ControlLeft"]) my -= 1;
    mx += right[0] * analog.x + fwd[0] * analog.y;
    mz += right[2] * analog.x + fwd[2] * analog.y;
    const ml = Math.hypot(mx, my, mz);
    if (ml > 0) {
      const step = cam.speed * dt / ml;
      cam.pos[0] += mx * step; cam.pos[1] += my * step; cam.pos[2] += mz * step;
    }
  } else {
    // ---- walk: horizontal wish-dir, collide, follow terrain, head bob ----
    const hf = [fwd[0] / flen, fwd[2] / flen];   // forward on the ground plane
    let wx = 0, wz = 0;
    if (keys["KeyW"]) { wx += hf[0]; wz += hf[1]; }
    if (keys["KeyS"]) { wx -= hf[0]; wz -= hf[1]; }
    if (keys["KeyD"]) { wx += right[0]; wz += right[2]; }
    if (keys["KeyA"]) { wx -= right[0]; wz -= right[2]; }
    wx += right[0] * analog.x + hf[0] * analog.y;
    wz += right[2] * analog.x + hf[1] * analog.y;
    const wl = Math.hypot(wx, wz);
    if (wl > 0) {
      const run = keys["ShiftLeft"] ? 1.7 : 1.0;
      const step = WALK_SPEED * run * dt / wl;
      const nx = player.x + wx * step, nz = player.z + wz * step;
      // collide against deep water, sliding along each axis independently
      if (heightAt(nx, player.z) > WADE_LIMIT) player.x = nx;
      if (heightAt(player.x, nz) > WADE_LIMIT) player.z = nz;
      player.bob += step;
    } else {
      player.bob += dt * 0.6;    // settle the bob back toward rest
    }
    const ground = heightAt(player.x, player.z);
    const bob = Math.sin(player.bob * 1.1) * 0.09 * (wl > 0 ? 1 : 0);
    cam.pos[0] = player.x;
    cam.pos[1] = ground + EYE + bob;
    cam.pos[2] = player.z;
  }

  // ---- matrices ----
  const f = camForward();
  const view = M4.lookAt(cam.pos, [cam.pos[0]+f[0], cam.pos[1]+f[1], cam.pos[2]+f[2]], [0, 1, 0]);
  const invVP = M4.invert(M4.multiply(proj, view));

  // ============ PASS 1: scene → low-res FBO ============
  ensureFBO();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
  gl.viewport(0, 0, fbo.w, fbo.h);
  gl.clearColor(SKY.horizon[0], SKY.horizon[1], SKY.horizon[2], 1.0);
  gl.depthMask(true);   // MUST be writable or clear(DEPTH) is a no-op
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // sky (background, no depth)
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(skyU.uInvVP, false, invVP);
  gl.uniform3fv(skyU.uCamPos, cam.pos);
  gl.uniform3fv(skyU.uSunDir, SKY.sun);
  gl.uniform3fv(skyU.uZenith, SKY.zenith);
  gl.uniform3fv(skyU.uHorizon, SKY.horizon);
  gl.uniform3fv(skyU.uWarm, SKY.warm);
  gl.bindVertexArray(fsTri);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // terrain
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.useProgram(terrainProg);
  gl.uniformMatrix4fv(terrainU.uProj, false, proj);
  gl.uniformMatrix4fv(terrainU.uView, false, view);
  gl.uniform3fv(terrainU.uSunDir, SKY.sun);
  gl.uniform3fv(terrainU.uCamPos, cam.pos);
  gl.uniform3fv(terrainU.uZenith, SKY.zenith);
  gl.uniform3fv(terrainU.uHorizon, SKY.horizon);
  gl.uniform3fv(terrainU.uWarm, SKY.warm);
  gl.uniform1f(terrainU.uFogDensity, FOG_DENSITY);
  gl.uniform1f(terrainU.uFogNear, FOG_NEAR);
  gl.bindVertexArray(terrain.vao);
  gl.drawElements(gl.TRIANGLES, terrain.count, gl.UNSIGNED_INT, 0);

  // water
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(waterProg);
  gl.uniformMatrix4fv(waterU.uProj, false, proj);
  gl.uniformMatrix4fv(waterU.uView, false, view);
  gl.uniform3fv(waterU.uCamPos, cam.pos);
  gl.uniform3fv(waterU.uSunDir, SKY.sun);
  gl.uniform3fv(waterU.uZenith, SKY.zenith);
  gl.uniform3fv(waterU.uHorizon, SKY.horizon);
  gl.uniform3fv(waterU.uWarm, SKY.warm);
  gl.uniform1f(waterU.uTime, t);
  gl.uniform1f(waterU.uFogDensity, FOG_DENSITY);
  gl.uniform1f(waterU.uFogNear, FOG_NEAR);
  // snap the water sheet to the camera so wave detail stays nearby
  const wsnap = (WATER_HALF * 2) / 256;
  gl.uniform2f(waterU.uCenter, Math.round(cam.pos[0] / wsnap) * wsnap,
                               Math.round(cam.pos[2] / wsnap) * wsnap);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, heightTex);
  gl.uniform1i(waterU.uHeight, 0);
  gl.bindVertexArray(water.vao);
  gl.drawElements(gl.TRIANGLES, water.count, gl.UNSIGNED_INT, 0);
  gl.disable(gl.BLEND);

  // ============ PASS 2: post → screen ============
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fbo.color);
  gl.uniform1i(postU.uScene, 0);
  gl.uniform2f(postU.uSceneSize, fbo.w, fbo.h);
  gl.uniform1i(postU.uDither, ditherOn ? 1 : 0);
  gl.bindVertexArray(fsTri);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindVertexArray(null);

  // ---- hud ----
  hud.textContent =
    `seed ${SEED_STR}  ·  ${archetype}\n` +
    `res  ${fbo.w}x${fbo.h}  dither ${ditherOn ? "on" : "off"}\n` +
    `pos  ${cam.pos[0].toFixed(0)}, ${cam.pos[1].toFixed(0)}, ${cam.pos[2].toFixed(0)}  spd ${cam.speed.toFixed(0)}`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
