  :root {
    --bg: #0e1418;
    --ink: #ecdfc4;           /* warm pale sand — primary text, never pure white */
    --ink-dim: #b7b196;       /* muted labels */
    --ink-shadow: #0c1210;    /* subtle shadow in a darker palette shade */
    --panel: rgba(20,32,34,.94);
    --panel-lit: rgba(32,50,52,.96);
    --panel-edge: rgba(10,20,22,.96);
    --facet: linear-gradient(150deg, var(--panel-lit) 0 46%, var(--panel) 46% 100%);
    --accent: #2b6f78; --accent-lit: #3f9aa5;
    --chamfer: 9px;
    --ui: "Chakra Petch", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--ui); color: var(--ink); text-shadow: 0 1px 2px var(--ink-shadow); letter-spacing: .01em; }
  #gl { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: pixelated; }
  /* §12A chamfered, faceted panels & buttons — cut from the same geometry as the world */
  .chamfer { clip-path: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--chamfer)); }

  /* Overlay / title (§12A) */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: radial-gradient(150% 130% at 50% 30%, rgba(14,26,32,0.25), rgba(8,12,16,0.72));
    z-index: 10; transition: opacity .5s ease; padding: 24px 16px;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #wordmark { width: min(680px, 92vw); height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
  #islandName { font-size: clamp(16px, 2.6vw, 22px); font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  #titlemenu { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(340px, 90vw); }
  .menucol { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .menucol button { width: 100%; font-size: 16px; padding: 13px 22px; }
  .seedrow { display: flex; align-items: center; gap: 8px; width: 100%; }
  .seedrow label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  #seedInput { flex: 1; font: 600 14px var(--ui); letter-spacing: .06em; color: var(--ink); padding: 9px 12px;
    background: var(--panel-edge); border: none; text-shadow: 0 1px 1px var(--ink-shadow);
    clip-path: polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px); }
  #seedInput:focus { outline: none; background: rgba(8,16,18,.98); }
  #diceBtn { padding: 9px 13px; font-size: 18px; line-height: 1; }
  #recentWrap { width: 100%; margin-top: 4px; }
  .reclabel { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 7px; }
  #recentList { display: flex; flex-direction: column; gap: 6px; }
  .recitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer;
    font-size: 13px; padding: 8px 12px; background: var(--facet); text-align: left; letter-spacing: .02em;
    clip-path: polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px); }
  .recitem:hover { filter: brightness(1.2); }
  .recitem .pct { font-size: 12px; color: var(--accent-lit); font-weight: 600; }
  .recitem.empty { justify-content: center; color: var(--ink-dim); cursor: default; }
  .recitem.empty:hover { filter: none; }
  #settingspanel { position: fixed; z-index: 14; display: none; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(340px, 92vw); max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain; background: var(--facet); padding: 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    clip-path: polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px); }
  #settingspanel h3 { font-size: 18px; letter-spacing: .04em; margin-bottom: 14px; }
  #settingspanel h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin: 16px 0 8px; font-weight: 600; }
  #settingspanel .spresets { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
  #settingspanel .spreset { flex: 1; min-width: 52px; font-size: 11.5px; padding: 7px 4px; cursor: pointer; opacity: .7;
    border: none; background: var(--panel-edge); color: var(--ink);
    clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px); }
  #settingspanel .spreset.on { opacity: 1; background: var(--facet); color: #ffe6b0; box-shadow: inset 0 0 0 1px rgba(255,220,150,.5); }
  #settingspanel .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 11px 0; font-size: 13px; }
  #settingspanel .srow button { min-width: 64px; font-size: 12px; padding: 6px 12px; }
  #settingspanel label { font-size: 13px; letter-spacing: .02em; color: var(--ink); }
  #settingspanel input[type=range] { width: 130px; }
  #settingspanel .closebtn { width: 100%; margin-top: 14px; }
  @media (max-width: 560px) {
    #titlemenu { width: min(420px, 94vw); }
    .menucol button { font-size: 18px; padding: 16px 22px; }
    #diceBtn { padding: 12px 16px; }
    .recitem { padding: 11px 14px; font-size: 14px; }
  }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .04em; padding: 11px 22px;
    border: none; background: var(--facet); color: var(--ink); cursor: pointer;
    text-shadow: 0 1px 1px var(--ink-shadow); transition: filter .15s, transform .1s;
    clip-path: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--chamfer));
  }
  button:hover { filter: brightness(1.22); }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(150deg, var(--accent-lit) 0 46%, var(--accent) 46% 100%); color: #f2ede0; }
  button.primary:hover { filter: brightness(1.15); }

  /* HUD */
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 5; pointer-events: none;
    font-family: var(--ui); font-size: 12px; letter-spacing: .04em;
    opacity: .78; line-height: 1.55; text-shadow: 0 1px 2px var(--ink-shadow);
  }
  #tidecurve {
    position: fixed; left: 12px; bottom: 76px; z-index: 5; pointer-events: none;
    opacity: .82; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  #dbg {
    position: fixed; left: 12px; top: 12px; z-index: 5; pointer-events: none;

<script>
"use strict";
/* ===================================================================== *
 *  BEACHCOMBER  —  Milestone 2  (the "vibe engine")
 *  Low-res FBO + nearest upscale · Bayer dither + palette quantization
 *  View-ray sky gradient · distance fog · animated ocean w/ foam.
 *  Raw WebGL2, no libraries, no asset files.
 * ===================================================================== */

/* --------------------------------------------------------------------- *
 * § PRNG  (one seeded stream for ALL procedural generation)
 * --------------------------------------------------------------------- */

// xmur3: hash an arbitrary string into a well-mixed 32-bit integer seed.
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}

// mulberry32: tiny, fast, deterministic PRNG. Returns floats in [0,1).
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Resolve the seed: read ?seed=, or mint one (crypto entropy, not the stream)
// and write it back to the URL so the island can be shared.
function resolveSeed() {
  const params = new URLSearchParams(location.search);
  let seedStr = params.get("seed");
  if (!seedStr) {
    const buf = new Uint32Array(2);
    crypto.getRandomValues(buf);
    seedStr = (buf[0] >>> 0).toString(36) + (buf[1] >>> 0).toString(36);
    params.set("seed", seedStr);
    history.replaceState(null, "", location.pathname + "?" + params.toString());
  }
  return seedStr;
}

const SEED_STR = resolveSeed();
const SEED_INT = xmur3(SEED_STR)();
const rng = mulberry32(SEED_INT);   // <-- the single shared stream

// Convenience: a fresh independent sub-stream seeded from the main stream,
// so each generator can be reordered later without disturbing the others.
function subStream() { return mulberry32((rng() * 4294967296) >>> 0); }

/* --------------------------------------------------------------------- *
 * § NOISE  (seeded value noise + fbm)
 * --------------------------------------------------------------------- */

function makeNoise(rand) {
  // Permutation table + per-lattice random values, both seeded.
  const perm = new Uint8Array(512);
  const vals = new Float32Array(256);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {           // Fisher–Yates shuffle
    const j = (rand() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) vals[i] = rand();

  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (ix, iy) => perm[(ix + perm[iy & 255]) & 255];

  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fade(fx), uy = fade(fy);
    const v00 = vals[hash(ix,     iy)];
    const v10 = vals[hash(ix + 1, iy)];
    const v01 = vals[hash(ix,     iy + 1)];
    const v11 = vals[hash(ix + 1, iy + 1)];
    return lerp(lerp(v00, v10, ux), lerp(v01, v11, ux), uy); // [0,1]
  }

  // Fractal Brownian motion: summed octaves, normalized to [0,1].
  function fbm(x, y, octaves, lacunarity, gain) {
    let amp = 0.5, freq = 1.0, sum = 0, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += amp * noise2(x * freq, y * freq);
      norm += amp;
      amp *= gain;
      freq *= lacunarity;
    }
    return sum / norm;
  }

  return { noise2, fbm };
}

/* --------------------------------------------------------------------- *
 * § WORLD CONFIG
 * --------------------------------------------------------------------- */

const GRID = 384;             // heightmap resolution (GRID x GRID)
const WORLD = 1200.0;         // island spans WORLD world-units (big, so you feel small)
const HALF = WORLD * 0.5;
const CELL = WORLD / (GRID - 1);
const SEA_LEVEL = 0.0;        // water sits at y = 0

/* --------------------------------------------------------------------- *
 * § TERRAIN CHARACTER  (every seed is unique: it sets continuous shaping
 *   parameters, then a stack of noise fields — domain warp for organic
 *   shapes, a macro field that patchworks plains vs. mountains, ridged
 *   multifractal for sharp peaks & rock formations, rolling fbm hills, and
 *   basin/pool noise for inland lakes, lagoons & tide pools. A tidal-shelf
 *   profile keeps wide gentle intertidal margins near the waterline.)
 * --------------------------------------------------------------------- */

// A light flavour label (kept for the HUD / future content hooks).
const CHARACTER = (function (r) {
  const x = r();                         // FIRST draw from the stream
  if (x < 0.30) return "lowlands";
  if (x < 0.68) return "highlands";
  if (x < 0.88) return "peaks";
  return "atoll";
})(rng);

// Continuous, seed-jittered parameters — no two islands are shaped alike.
const AP = (function (r, ch) {
  const gentle = ch === "lowlands", big = ch === "peaks", atoll = ch === "atoll";
  return {
    character:  ch,
    warp:       0.05 + 0.10 * r(),        // domain-warp strength (organic shapes)
    coastWarp:  0.22 + 0.34 * r(),        // coastline irregularity (bays/capes)
    coastInner: 0.28 + 0.14 * r(),        // full-land radius
    coastOuter: 0.60 + 0.16 * r(),        // where land fades into sea
    baseAmp:    0.10 + 0.12 * r(),        // gentle land body above the shelf
    hillFreq:   2.4 + 2.2 * r(),          // rolling-hill scale
    ridgeFreq:  1.4 + 1.8 * r(),          // mountain-ridge scale
    macroFreq:  0.8 + 0.7 * r(),          // scale of the plains/mountains patchwork
    mtn:        (gentle ? 0.25 : big ? 1.05 : 0.6) + 0.35 * r(),  // mountain intensity
    ridgeLo:    0.40 + 0.10 * r(),        // macro threshold where mountains begin
    lakeFreq:   1.1 + 1.0 * r(),
    lakeAmt:    (atoll ? 1.1 : 0.5) + 0.4 * r(),  // inland-water prevalence
    lakeDepth:  5.0 + 7.0 * r(),
    poolFreq:   6.0 + 5.0 * r(),
    heightScale:(gentle ? 95 : big ? 250 : 165) + 55 * r(),      // vertical scale
    tideRange:  (gentle || atoll ? 9.5 : big ? 6.0 : 7.5) + 2.5 * r(),  // tidal range (bigger for drama, §B)
    barFreq:    10 + 8 * r(),             // sandbar/channel count across the intertidal band
    barAmp:     1.3 + 1.1 * r(),          // sandbar height / channel depth
  };
})(rng, CHARACTER);
const archetype = CHARACTER;   // HUD alias

// Independent noise fields (fixed draw order → deterministic per seed).
const nWarpX = makeNoise(subStream());
const nWarpY = makeNoise(subStream());
const nCoast = makeNoise(subStream());
const nHills = makeNoise(subStream());
const nRidge = makeNoise(subStream());
const nMacro = makeNoise(subStream());
const nBasin = makeNoise(subStream());
const nPool  = makeNoise(subStream());
const nBar   = makeNoise(subStream());    // sandbars & tidal channels in the intertidal band (§B)
// Per-seed causeway to a small low-tide islet (present on some seeds).
const CAUSEWAY = (function (r) {
  const has = r() < 0.5;
  const ang = r() * 6.2831853;
  return { has, ang, dx: Math.sin(ang), dz: -Math.cos(ang),
           dist: 0.62 + r() * 0.12,         // islet distance as a fraction of HALF
           width: 9 + r() * 5 };            // causeway half-width (world units)
})(subStream());

/* --------------------------------------------------------------------- *
 * § COASTAL BIOMES  (Phase 9 Part C): the coast is split into seeded
 *   angular segments (soft-blended), each with its own look, props,
 *   critters, loot weights, dig-tell density and walking feel.
 * --------------------------------------------------------------------- */
// mat ids are the fixed MAT.* values (grass1 dirt2 sand3 gravel4 stone5 mud6), hardcoded
// here because MAT is declared further down; keep in sync with the MAT block.
const COAST_BIOMES = {
  sandy:   { mat: 3, feet: "sand",   speed: 1.0,  tell: 1.0,  crit: ["crab","gull","piper"],
             finds: ["shell","seaglass","sanddollar","moonsnail","cockle"], label: "Sandy beach" },
  cobble:  { mat: 4, feet: "gravel", speed: 0.92, tell: 0.5,  crit: ["crab","hopper","gull"],
             finds: ["seaglass","agate","stone","shell","driftwood"], label: "Cobble beach", flip: true },
  reef:    { mat: 5, feet: "rock",   speed: 0.85, tell: 0.4,  crit: ["star","anemone","urchin"],
             finds: ["mussel","limpet","seaglass","shell","cuttle"], label: "Rocky reef shelf" },
  mudflat: { mat: 6, feet: "mud",    speed: 0.6,  tell: 1.3,  crit: ["heron","piper","gull"],
             finds: ["clam","cockle","wormcast","mud","worm"], label: "Mudflat" },
  marsh:   { mat: 1, feet: "grass",  speed: 0.8,  tell: 0.7,  crit: ["heron","piper","gull"],
             finds: ["pickleweed","salt","cockle","shell","worm"], label: "Salt marsh" },
};
const BIOME_SEG = (function (r, ch) {
  const w = { sandy: 3, cobble: 2, reef: 2, mudflat: 2, marsh: 1 };
  if (ch === "atoll")     { w.reef = 4; w.sandy = 4; w.mudflat = 1; w.marsh = 1; }
  if (ch === "lowlands")  { w.sandy = 4; w.mudflat = 3; w.marsh = 3; w.cobble = 1; }
  if (ch === "peaks")     { w.cobble = 4; w.reef = 4; w.sandy = 1; w.mudflat = 1; }
  if (ch === "highlands") { w.cobble = 3; w.reef = 3; w.sandy = 2; }
  const pool = []; for (const k in w) for (let i = 0; i < w[k]; i++) pool.push(k);
  const segs = 5 + (r() * 3 | 0), sizes = []; let acc = 0;
  for (let i = 0; i < segs; i++) { const s = 0.6 + r(); sizes.push(s); acc += s; }
  const list = []; let a = 0;
  for (let i = 0; i < segs; i++) { const frac = sizes[i] / acc * 6.2831853; list.push({ start: a, end: a + frac, biome: pool[(r() * pool.length) | 0] }); a += frac; }
  list[list.length - 1].end = 6.2831854;
  return list;
})(subStream(), CHARACTER);
function coastBiomeAt(x, z) {
  let ang = Math.atan2(z, x);
  ang += (nBar.fbm(x * 0.004 + 11, z * 0.004 + 7, 2, 2, 0.5) - 0.5) * 0.35;   // soft, wavy boundaries
  ang = (ang % 6.2831853 + 6.2831853) % 6.2831853;
  for (const s of BIOME_SEG) if (ang >= s.start && ang < s.end) return s.biome;
  return BIOME_SEG[0].biome;
}

// Ridged multifractal → sharp mountain ridgelines & rock formations.
function ridgedMF(n, x, y, oct) {
  let sum = 0, amp = 0.5, freq = 1.0, norm = 0, prev = 1.0;
  for (let o = 0; o < oct; o++) {
    let r = 1.0 - Math.abs(2.0 * n.noise2(x * freq, y * freq) - 1.0); // 0..1
    r *= r;
    sum += r * amp * prev;        // prev-weighting sharpens the ridges
    prev = r;
    norm += amp;
    amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}

const SEA_THRESH = 0.16;     // elevation field value that maps to the waterline
const SHELF_POW = 1.7;       // >1 flattens near shore → wide tidal margins, but
                             // gentle enough that dunes & interior still rise

const heightmap = new Float32Array(GRID * GRID);   // base generated terrain (never mutated by play)
const dig = new Float32Array(GRID * GRID);    // digging offset layer; +spoil / -holes (heals back)
const built = new Float32Array(GRID * GRID);  // player-built height — permanent, kept apart from dig so healing can't erase it
const fresh = new Float32Array(GRID * GRID);  // "freshness" of dug soil 0..1 (Phase 6; darkens, fades back)
const material = new Uint8Array(GRID * GRID); // surface material id (0 = natural/by-height, else MAT.*)
const matField = new Float32Array(GRID * GRID);    // float copy of `material` for the GPU texture
const builtCells = new Set();                 // grid indices with built height (for intertidal erosion)
const hcombined = new Float32Array(GRID * GRID);   // scratch for base+dig texture uploads

// Surface materials. 0 = "natural" (coloured by height/slope as before).
const MAT = { NATURAL: 0, GRASS: 1, DIRT: 2, SAND: 3, GRAVEL: 4, STONE: 5, MUD: 6 };
const MAT_NAME = ["natural", "grass", "dirt", "sand", "gravel", "stone", "mud"];
const MAT_ITEM = { dirt: MAT.DIRT, sand: MAT.SAND, gravel: MAT.GRAVEL, stone: MAT.STONE, mud: MAT.MUD };  // placeable material items
// natural material of a base cell, from its height & local slope
function defaultMat(i) {
  const hb = heightmap[i];
  const gx = i % GRID, gz = (i / GRID) | 0;
  let slope = 0;
  if (gx > 0 && gx < GRID - 1 && gz > 0 && gz < GRID - 1) {
    const dhx = (heightmap[i+1] - heightmap[i-1]) / (2 * CELL), dhz = (heightmap[i+GRID] - heightmap[i-GRID]) / (2 * CELL);
    slope = Math.atan(Math.hypot(dhx, dhz));
  }
  if (slope > 0.62 || hb > 34) return MAT.STONE;
  if (hb > 20) return MAT.GRAVEL;
  if (hb < 6) return MAT.SAND;
  return MAT.GRASS;
}

function buildHeightmap() {
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const u = x / (GRID - 1);
      const v = z / (GRID - 1);

      // Domain warp → organic, non-radial shapes (peninsulas, inlets).
      const wu = u + (nWarpX.fbm(u * 1.6, v * 1.6, 4, 2, 0.5) - 0.5) * AP.warp;
      const wv = v + (nWarpY.fbm(u * 1.6 + 3.1, v * 1.6 + 1.7, 4, 2, 0.5) - 0.5) * AP.warp;

      // Irregular coastline → island mask (1 inland … 0 open sea).
      const dx = u - 0.5, dz = v - 0.5;
      let d = Math.sqrt(dx * dx + dz * dz) * 2.0;
      d += (nCoast.fbm(u * 2.2, v * 2.2, 4, 2, 0.5) - 0.5) * AP.coastWarp;
      const land = smoothstep(AP.coastOuter, AP.coastInner, d);   // reversed → 1 inside

      // Relief: rolling hills + ridged mountains, patch-worked by a macro field
      // so each island has its own layout of plains, ranges and rock formations.
      const macro = nMacro.fbm(wu * AP.macroFreq, wv * AP.macroFreq, 3, 2, 0.5);
      const mtnMask = smoothstep(AP.ridgeLo, AP.ridgeLo + 0.26, macro);
      const rolling = nHills.fbm(wu * AP.hillFreq, wv * AP.hillFreq, 6, 2, 0.5);
      const ridges = ridgedMF(nRidge, wu * AP.ridgeFreq, wv * AP.ridgeFreq, 5);
      const relief = rolling * 0.45 + mtnMask * ridges * AP.mtn;

      // Elevation field: highest inland, tapering to the coast.
      const elev = land * (AP.baseAmp + relief);

      // Tidal-shelf profile → wide gentle intertidal margins, real relief inland.
      const e0 = elev - SEA_THRESH;
      let height = Math.sign(e0) * Math.pow(Math.abs(e0), SHELF_POW) * AP.heightScale;

      // Inland bodies of water: carve basins (lakes / lagoons) where basin noise
      // is low — the global water plane fills anything below sea level.
      const basin = nBasin.fbm(wu * AP.lakeFreq, wv * AP.lakeFreq, 4, 2, 0.5);
      const lake = smoothstep(0.46, 0.30, basin) * land * AP.lakeAmt;
      height -= lake * AP.lakeDepth;

      // Tide pools: fine dimples in the intertidal band (height near the shore).
      const band = 1.0 - smoothstep(0.0, 4.0, Math.abs(height - 0.5));
      const pool = nPool.fbm(u * AP.poolFreq, v * AP.poolFreq, 3, 2, 0.5);
      height -= band * smoothstep(0.58, 0.72, pool) * 2.4;

      // Sandbars & tidal channels: alternating ridges/troughs across the wide
      // intertidal band so a falling tide drains through the channels first (§B).
      const barBand = 1 - smoothstep(0, 9, Math.abs(height));
      const barPhase = d * AP.barFreq + (nBar.fbm(wu * 2.6, wv * 2.6, 3, 2, 0.5) - 0.5) * 1.6;
      height += barBand * Math.sin(barPhase * 6.2831853) * AP.barAmp;

      // Deepen toward open sea so the island reads as surrounded (and bounds you).
      height -= smoothstep(AP.coastInner, 1.5, d) * 14.0;

      // Causeway + small islet, walkable only at low tide, on some seeds (§B).
      if (CAUSEWAY.has) {
        const wx = x * CELL - HALF, wz = z * CELL - HALF;
        const proj = wx * CAUSEWAY.dx + wz * CAUSEWAY.dz, perp = Math.abs(-wx * CAUSEWAY.dz + wz * CAUSEWAY.dx);
        const isletR = HALF * CAUSEWAY.dist;
        const across = 1 - smoothstep(CAUSEWAY.width, CAUSEWAY.width + 6, perp);
        const along = smoothstep(HALF * 0.26, HALF * 0.33, proj) * (1 - smoothstep(isletR - 8, isletR + 6, proj));
        const mask = across * along;
        if (mask > 0.01) { const lvl = -TIDE_RANGE * 0.22; height = height * (1 - mask) + Math.max(height, lvl) * mask; }
        const dIslet = Math.hypot(wx - CAUSEWAY.dx * isletR, wz - CAUSEWAY.dz * isletR);
        if (dIslet < 46) height = Math.max(height, (1 - smoothstep(10, 46, dIslet)) * (TIDE_RANGE * 0.4 + 8));
      }

      heightmap[z * GRID + x] = height;
    }
  }
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
// Paint the coastal band with each segment's biome material (§C palette).
function paintBiomes() {
  for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++) {
    const i = z * GRID + x, hb = heightmap[i];
    if (hb < -TIDE_RANGE * 0.7 || hb > 8.5) continue;          // only the coastal / intertidal band
    const bi = COAST_BIOMES[coastBiomeAt(x * CELL - HALF, z * CELL - HALF)];
    material[i] = bi.mat; matField[i] = bi.mat;
  }
}

// Bilinear height query (fast, used for generation / placement).
function heightAt(wx, wz) {
  const gx = (wx + HALF) / CELL;
  const gz = (wz + HALF) / CELL;
  const x0 = Math.floor(gx), z0 = Math.floor(gz);
  if (x0 < 0 || z0 < 0 || x0 >= GRID - 1 || z0 >= GRID - 1) return -8.0;
  const fx = gx - x0, fz = gz - z0;
  const i00 = z0 * GRID + x0, i10 = i00 + 1, i01 = i00 + GRID, i11 = i01 + 1;
  const h00 = heightmap[i00] + dig[i00] + built[i00], h10 = heightmap[i10] + dig[i10] + built[i10];
  const h01 = heightmap[i01] + dig[i01] + built[i01], h11 = heightmap[i11] + dig[i11] + built[i11];
  const a = h00 + (h10 - h00) * fx;
  const b = h01 + (h11 - h01) * fx;
  return a + (b - a) * fz;
}

// Exact surface query on the SAME two triangles the terrain mesh renders, so
// the camera never floats or clips. Returns height, unit normal and slope.
const _surf = { h: 0, nx: 0, ny: 1, nz: 0, slope: 0 };
function surfaceAt(wx, wz) {
  const gx = (wx + HALF) / CELL, gz = (wz + HALF) / CELL;
  const x0 = Math.floor(gx), z0 = Math.floor(gz);
  if (x0 < 0 || z0 < 0 || x0 >= GRID - 1 || z0 >= GRID - 1) {
    _surf.h = -8.0; _surf.nx = 0; _surf.ny = 1; _surf.nz = 0; _surf.slope = 0;
    return _surf;
  }
  const fx = gx - x0, fz = gz - z0;
  const i00 = z0 * GRID + x0, i10 = i00 + 1, i01 = i00 + GRID, i11 = i01 + 1;
  const h00 = heightmap[i00] + dig[i00] + built[i00], h10 = heightmap[i10] + dig[i10] + built[i10];
  const h01 = heightmap[i01] + dig[i01] + built[i01], h11 = heightmap[i11] + dig[i11] + built[i11];
  let h, e1x, e1y, e1z, e2x, e2y, e2z;
  if (fx + fz < 1.0) {                       // lower triangle (a, b, c)
    h = h00 + (h10 - h00) * fx + (h01 - h00) * fz;
    e1x = CELL; e1y = h10 - h00; e1z = 0;  e2x = 0; e2y = h01 - h00; e2z = CELL;
  } else {                                   // upper triangle (b, d, c)
    h = h10 + (fx + fz - 1) * (h11 - h10) + (1 - fx) * (h01 - h10);
    e1x = 0; e1y = h11 - h10; e1z = CELL;  e2x = -CELL; e2y = h01 - h10; e2z = CELL;
  }
  let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
  const L = Math.hypot(nx, ny, nz) || 1;
  nx /= L; ny /= L; nz /= L;
  if (ny < 0) { nx = -nx; ny = -ny; nz = -nz; }
  _surf.h = h; _surf.nx = nx; _surf.ny = ny; _surf.nz = nz;
  _surf.slope = Math.acos(Math.max(-1, Math.min(1, ny)));
  return _surf;
}

// Highest point on the island (spawn faces it; a sightline anchor for POIs).
let HIGH = { x: 0, z: 0, h: -1e9 };
function findHighPoint() {
  for (let z = 0; z < GRID; z += 2)
    for (let x = 0; x < GRID; x += 2) {
      const h = heightmap[z * GRID + x];
      if (h > HIGH.h) { HIGH.h = h; HIGH.x = x * CELL - HALF; HIGH.z = z * CELL - HALF; }
    }
}

/* --------------------------------------------------------------------- *
 * § BASINS  (Priority-Flood → "filled" DEM: the level at which each cell
 *   connects to the open sea. filled>terrain ⇒ a depression that holds a
 *   tide pool up to its rim when the sea drops below it. Also extracts
 *   discrete pools for seeding contents and the debug view.)
 * --------------------------------------------------------------------- */

const filled = new Float32Array(GRID * GRID);
let pools = [];     // { cx, cz, rim, floor, n, x, z }  (world-space centroid)

function computeBasins() {
  const N = GRID * GRID;
  for (let i = 0; i < N; i++) filled[i] = Infinity;
  const done = new Uint8Array(N);
  const hl = new Float64Array(N + 1), hi = new Int32Array(N + 1);
  let hn = 0;
  const push = (l, i) => {
    hn++; hl[hn] = l; hi[hn] = i; let c = hn;
    while (c > 1) { const p = c >> 1; if (hl[p] <= hl[c]) break; [hl[p],hl[c]]=[hl[c],hl[p]]; [hi[p],hi[c]]=[hi[c],hi[p]]; c = p; }
  };
  const pop = () => {
    const i = hi[1]; hl[1] = hl[hn]; hi[1] = hi[hn]; hn--; let c = 1;
    while (true) { let m = c, l = c*2, r = c*2+1;
      if (l <= hn && hl[l] < hl[m]) m = l; if (r <= hn && hl[r] < hl[m]) m = r;
      if (m === c) break; [hl[m],hl[c]]=[hl[c],hl[m]]; [hi[m],hi[c]]=[hi[c],hi[m]]; c = m; }
    return i;
  };
  for (let z = 0; z < GRID; z++)            // seed the map border
    for (let x = 0; x < GRID; x++) {
      if (x === 0 || z === 0 || x === GRID-1 || z === GRID-1) {
        const i = z*GRID+x; filled[i] = heightmap[i]; done[i] = 1; push(filled[i], i);
      }
    }
  const nb = [-1, 1, -GRID, GRID];
  while (hn > 0) {
    const c = pop(), lvl = filled[c], cx = c % GRID, cz = (c / GRID) | 0;
    for (let k = 0; k < 4; k++) {
      const nx = cx + (k===0?-1:k===1?1:0), nz = cz + (k===2?-1:k===3?1:0);
      if (nx < 0 || nz < 0 || nx >= GRID || nz >= GRID) continue;
      const ni = c + nb[k];
      if (done[ni]) continue;
      filled[ni] = Math.max(heightmap[ni], lvl);
      done[ni] = 1; push(filled[ni], ni);
    }
  }
  // §12A drop any trapped water sitting above the shore band — tide pools and seeping
  // water belong in the intertidal / shore zone, never as ponds up the mountain.
  for (let i = 0; i < N; i++) if (heightmap[i] > SHORE_WATER_MAX) filled[i] = heightmap[i];
  extractPools();
}

// Group depression cells into discrete pools (small, coastal-ish ones).
function extractPools() {
  pools = [];
  const N = GRID * GRID, seen = new Uint8Array(N), EPS = 0.25;
  const stack = [];
  for (let s = 0; s < N; s++) {
    if (seen[s] || filled[s] <= heightmap[s] + EPS) continue;
    // BFS this connected depression
    stack.length = 0; stack.push(s); seen[s] = 1;
    let n = 0, sx = 0, sz = 0, rim = -Infinity, floor = Infinity;
    while (stack.length) {
      const c = stack.pop(), cx = c % GRID, cz = (c / GRID) | 0;
      n++; sx += cx; sz += cz;
      rim = Math.max(rim, filled[c]); floor = Math.min(floor, heightmap[c]);
      const ns = [c-1, c+1, c-GRID, c+GRID];
      for (let k = 0; k < 4; k++) {
        const ni = ns[k];
        if (ni < 0 || ni >= N || seen[ni]) continue;
        const nx = ni % GRID;
        if (k === 0 && nx === GRID-1) continue;      // wrap guard
        if (k === 1 && nx === 0) continue;
        if (filled[ni] > heightmap[ni] + EPS) { seen[ni] = 1; stack.push(ni); }
      }
    }
    if (n < 4 || n > 2500) continue;                 // skip specks & big lakes
    if (rim - floor < 0.5) continue;
    const mx = (sx / n) * CELL - HALF, mz = (sz / n) * CELL - HALF;
    pools.push({ x: mx, z: mz, rim, floor, n });
  }
}

function buildFilledTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, filled);
  const hf = floatLinear ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

/* --------------------------------------------------------------------- *
 * § ATMOSPHERE  (sun + sky/fog palette driven by one timeOfDay value;

 * --------------------------------------------------------------------- */

// ONE shared game clock drives tides, day/night, creatures and spawns.
const clock = { t: 0, speed: 1, paused: false };
const MORNING_TIME = 0.15;           // §13.9 mid-morning (0.05 sunrise · 0.3 noon · 0.55 sunset)
let timeOfDay = MORNING_TIME;        // 0..1 across a day; the game opens in the morning
const DAY_PERIOD = 600;              // seconds per full day (~10 min)
// §13.9 day/night cycle off by default (sun frozen at morning); toggle in settings.
let dayNightEnabled = false;
try { dayNightEnabled = localStorage.getItem("bc_daynight") === "1"; } catch (e) {}
function setDayNight(on) { dayNightEnabled = on; if (!on) { timeOfDay = MORNING_TIME; updateSun(); } try { localStorage.setItem("bc_daynight", on ? "1" : "0"); } catch (e) {} }
const BASE_FOG_DENSITY = 0.0016, BASE_FOG_NEAR = 50.0;   // §13.6 base; graphics settings scale these live
let FOG_DENSITY = BASE_FOG_DENSITY;   // see far across the big landscape, still hazy
let FOG_NEAR = BASE_FOG_NEAR;         // clear band before fog ramps in

// Day & night palettes; SKY is the blended current state (uploaded each frame).
const SKY_DAY = { zenith: [0.42, 0.54, 0.63], horizon: [0.78, 0.77, 0.72], warm: [1.00, 0.92, 0.78] };
const SKY_NIGHT = { zenith: [0.05, 0.07, 0.13], horizon: [0.10, 0.12, 0.18], warm: [0.35, 0.40, 0.55] };
const SKY = { zenith: [0,0,0], horizon: [0,0,0], warm: [0,0,0], sun: [0,0,0] };
// §14B underwater palette — the fog/haze everything fades into when the camera is submerged
const SKY_UW = { zenith: [0.14, 0.42, 0.5], horizon: [0.1, 0.34, 0.44], warm: [0.45, 0.72, 0.72] };
let camUnderwaterNow = false;   // §14B set each frame for the underwater-only draws (plankton etc.)

function dayFactor() { return smoothstep(-0.32, 0.5, Math.cos((timeOfDay - 0.3) * 6.2831853)); }
let booted = false;              // true once init finishes (gates runtime-only telegraphs in updateSun)
function updateSun() {
  const ang = (timeOfDay - 0.3) * 6.2831853;           // 0 at the day's peak
  const el = Math.cos(ang) * 0.9, az = 0.5 + timeOfDay * 3.0;
  const ce = Math.cos(el);
  SKY.sun = [ce * Math.sin(az), Math.max(0.06, el), -ce * Math.cos(az)];
  const f = dayFactor();
  for (const k of ["zenith", "horizon", "warm"])
    SKY[k] = SKY_DAY[k].map((v, i) => v * f + SKY_NIGHT[k][i] * (1 - f));
  // telegraph an approaching storm: grey, flatten the sky
  const mood = booted ? eventMood() : 0;
  if (mood > 0) { const grey = [0.5, 0.52, 0.55];
    for (const k of ["zenith", "horizon"]) SKY[k] = SKY[k].map((v, i) => v * (1 - mood * 0.6) + grey[i] * mood * 0.6);
    SKY.warm = SKY.warm.map(v => v * (1 - mood * 0.45));
  }
}
updateSun();

/* --------------------------------------------------------------------- *
 * § TIDES  (waterLevel oscillates on a slow cycle with slack at the
 *   extremes; wetLevel is a lagging high-water mark that dries back.)
 * --------------------------------------------------------------------- */

let TIDE_PERIOD = 300;          // seconds for a full high→low→high cycle (~5 min)
const TIDE_RANGE = AP.tideRange;
const TIDE_MID = 0.0;
let tideT = 0.60;               // phase 0..1 (start part-way down)
let tideDay = 0;                // in-game days elapsed (drives the spring/neap envelope)
let waterLevel = 0.0;           // THE variable everything reads
let wetLevel = 0.0;             // lagging high-water mark (wet sand)
// Spring / neap: amplitude swells and shrinks over a ~7-day cycle (§B).
const TIDE_CYCLE_DAYS = 7, NEAP_AMP = 0.55, SPRING_AMP = 1.35;
const MINUS_AMP = 1.15, MINUS_DROP = 0.9;    // above this amp, lows drop extra (minus tides)
// The highest the ocean ever reaches (spring high). Nothing dry should sit at or below this.
const MAX_HIGH_TIDE = TIDE_MID + TIDE_RANGE * 0.5 * SPRING_AMP;
// §12A trapped inland water (ponds/lagoons) is only honoured in the shore band; no water up the mountain.
const SHORE_WATER_MAX = MAX_HIGH_TIDE + 3;
function ampAtDay(day) { const ph = (day / TIDE_CYCLE_DAYS) % 1; return NEAP_AMP + (SPRING_AMP - NEAP_AMP) * (0.5 + 0.5 * Math.cos(ph * 6.2831853)); }
// Shaped so the tide lingers (slack) near high and low.
function tideShape(ph) { const s = Math.sin(ph * 6.2831853); return Math.sign(s) * Math.pow(Math.abs(s), 0.7); }
// Water level at a given phase + spring/neap day. Strong springs pull the low extra-low (minus tide).
function levelAt(ph, day) {
  const s = tideShape(ph), amp = ampAtDay(day);
  let lvl = s * TIDE_RANGE * 0.5 * amp;
  if (s < -0.25 && amp > MINUS_AMP) lvl -= (amp - MINUS_AMP) * TIDE_RANGE * MINUS_DROP * ((-s - 0.25) / 0.75);
  return TIDE_MID + lvl;
}
function tideLevelAt(ph) { return levelAt(ph, tideDay); }
function levelFuture(sec) { return levelAt((tideT + sec / TIDE_PERIOD) % 1, tideDay + sec / DAY_PERIOD); }
function isMinusTideNow() { return ampAtDay(tideDay) > MINUS_AMP && tideShape(tideT) < -0.25; }
// Is a minus tide coming within `sec` seconds? returns seconds-until or -1.
function nextMinusTide(sec) {
  const step = TIDE_PERIOD / 40;
  for (let t = step; t < sec; t += step) {
    const amp = ampAtDay(tideDay + t / DAY_PERIOD), ph = (tideT + t / TIDE_PERIOD) % 1;
    if (amp > MINUS_AMP && Math.abs(ph - 0.75) < 0.03) return t;    // near a low during a strong spring
  }
  return -1;
}
function updateTide(gdt) {       // gdt = game-time seconds (already clock-scaled)
  tideT = (tideT + gdt / TIDE_PERIOD) % 1;
  if (tideT < 0) tideT += 1;
  tideDay += gdt / DAY_PERIOD;
  if (dayNightEnabled) timeOfDay = (timeOfDay + gdt / DAY_PERIOD) % 1;   // §13.9 frozen at morning when disabled
  updateSun();
  waterLevel = levelAt(tideT, tideDay);
  if (waterLevel >= wetLevel) wetLevel = waterLevel;          // instantly wet
  else wetLevel += (waterLevel - wetLevel) * Math.min(1, gdt * 0.05);  // slow dry-back
  // roll the next event once per high tide (near tideT 0.25)
  if (tideT > 0.2 && tideT < 0.3) { if (!eventRolled) { nextEvent = rollTideEvent(); eventRolled = true; } }
  else if (tideT > 0.45) eventRolled = false;
}
function tideInfo() {
  const rising = tideLevelAt((tideT + 0.002) % 1) > waterLevel;
  const lowPhase = 0.75;                                      // sin() minimum
  let d = (lowPhase - tideT + 1) % 1;
  return { rising, tToLow: d * TIDE_PERIOD / Math.max(0.01, clock.speed), minusNow: isMinusTideNow() };
}
// HUD tide clock: the level curve for the next in-game day, "now" dot, and any upcoming minus tide.
let tideCanvas = null, tideCtx = null;
function drawTideCurve() {
  if (!tideCanvas) { tideCanvas = document.getElementById("tidecurve"); if (!tideCanvas) return; tideCtx = tideCanvas.getContext("2d"); }
  const W = tideCanvas.width, H = tideCanvas.height, ctx = tideCtx, span = DAY_PERIOD, N = 60;
  const vals = []; let lo = 1e9, hi = -1e9;
  for (let k = 0; k <= N; k++) { const v = levelFuture(span * k / N); vals.push(v); if (v < lo) lo = v; if (v > hi) hi = v; }
  const full = TIDE_RANGE * SPRING_AMP * 0.5 + TIDE_RANGE * MINUS_DROP * 0.3;
  lo = Math.min(lo, -full); hi = Math.max(hi, full * 0.85);
  const pad = 3, Y = v => pad + (H - 2 * pad) * (1 - (v - lo) / (hi - lo + 1e-6));
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(0, H); for (let k = 0; k <= N; k++) ctx.lineTo(W * k / N, Y(vals[k])); ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = "rgba(88,148,178,0.35)"; ctx.fill();
  ctx.beginPath(); for (let k = 0; k <= N; k++) { const px = W * k / N, py = Y(vals[k]); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.strokeStyle = "rgba(190,225,235,0.95)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(1, Y(vals[0]), 2.6, 0, 6.3); ctx.fill();
  const mt = nextMinusTide(span);
  if (mt > 0) { const px = W * mt / span, py = Y(levelFuture(mt));
    ctx.strokeStyle = "#9fe8ff"; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, H - 1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#9fe8ff"; ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.3); ctx.fill();
    ctx.font = "8px 'Chakra Petch', monospace"; ctx.fillText("minus", Math.min(W - 28, px + 3), 9);
  }
}
// Surf: a soft filtered-noise wash whose level rises with the tide (§B). The game's
// first sound; built lazily on the first user gesture (startAudio) so autoplay rules allow it.
let surfAudio = null;
window.startAudio = function () {
  if (surfAudio) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5;   // white noise (not the seeded stream)
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 550; bp.Q.value = 0.4;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300;
    const gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(bp); bp.connect(lp); lp.connect(gain); gain.connect(ctx.destination); src.start();
    surfAudio = { ctx, gain };
  } catch (e) { surfAudio = null; }
};
function updateSurf() {
  if (!surfAudio) return;
  try {
    const rel = Math.max(0, Math.min(1, (waterLevel + TIDE_RANGE * 0.6) / (TIDE_RANGE * 1.2)));  // 0 low … 1 high
    const target = (mode === "walk" ? 0.02 + rel * 0.07 + eventMood() * 0.06 : 0);   // louder surf before a storm
    surfAudio.gain.gain.value += (target - surfAudio.gain.gain.value) * 0.04;
  } catch (e) {}
}

/* ---- tide events (§C): each high tide rolls what the next low washes up ---- */
const TIDE_EVENTS = [
  { id: "calm", w: 50 }, { id: "storm", w: 14 }, { id: "kelp", w: 12 }, { id: "stars", w: 8 },
  { id: "jelly", w: 8 }, { id: "driftseed", w: 6 }, { id: "floats", w: 3 }, { id: "oddity", w: 1 },
];
const EVENT_LABEL = { calm: "A calm tide", storm: "A storm surge", kelp: "A kelp storm", stars: "A sea-star stranding",
  jelly: "A jellyfish bloom", driftseed: "A drift-seed day", floats: "Glass floats washed in", oddity: "Something rare washed in" };
let nextEvent = "calm", currentEvent = "calm", eventRolled = false, starsRescued = 0, carryingStars = 0;
function rollTideEvent() { let tot = 0; for (const e of TIDE_EVENTS) tot += e.w; let x = rng() * tot; for (const e of TIDE_EVENTS) { x -= e.w; if (x <= 0) return e.id; } return "calm"; }

function eventMood() {

// Ripple marks: the ebbing tide leaves ripples in the sand it just uncovered (§B).
let ripples = [], rippleT = 0, lastWater = 0;

function updateRipples(dt, gdt) {
  const falling = waterLevel < lastWater - 1e-4; lastWater = waterLevel;
  rippleT += gdt;
  if (falling && rippleT > 1.5 && mode === "walk") { rippleT = 0;
    for (let k = 0; k < 3; k++) {
      const a = cam.yaw + (Math.random() - 0.5) * 1.6, r = 5 + Math.random() * 24;
      const x = cam.pos[0] + Math.sin(a) * r, z = cam.pos[2] - Math.cos(a) * r, h = surfaceAt(x, z).h;

function drawRipples(view) {

/* --------------------------------------------------------------------- *
 * § MATH  (column-major mat4)
 * --------------------------------------------------------------------- */

const M4 = {
  perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0,
    ]);
  },
  lookAt(eye, center, up) {
    const zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
    let zl = Math.hypot(zx, zy, zz) || 1;
    const z = [zx/zl, zy/zl, zz/zl];
    let xx = up[1]*z[2] - up[2]*z[1];
    let xy = up[2]*z[0] - up[0]*z[2];
    let xz = up[0]*z[1] - up[1]*z[0];
    let xl = Math.hypot(xx, xy, xz) || 1;
    const x = [xx/xl, xy/xl, xz/xl];
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
      -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
      -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),
      1,
    ]);
  },
  // result = a * b  (both column-major)
  multiply(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++)
      for (let r = 0; r < 4; r++)
        o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    return o;
  },
  invert(m) {
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
    const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
    const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
    const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
    const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
    const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
    const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    const o = new Float32Array(16);
    if (!det) return o;
    det = 1.0/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det;  o[1]=(a02*b10-a01*b11-a03*b09)*det;
    o[2]=(a31*b05-a32*b04+a33*b03)*det;  o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;  o[5]=(a00*b11-a02*b08+a03*b07)*det;
    o[6]=(a32*b02-a30*b05-a33*b01)*det;  o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;  o[9]=(a01*b08-a00*b10-a03*b06)*det;
    o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
    o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  },
};

/* --------------------------------------------------------------------- *
 * § GL  helpers
 * --------------------------------------------------------------------- */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
if (!gl) alert("WebGL2 is required for this game.");
const floatLinear = gl.getExtension("OES_texture_float_linear");

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + "\n" + src);
  return s;
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}
// Collect every active uniform's location into a lookup object.
function uniforms(p) {
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return u;
}

// Shared GLSL: the ONE sky function, injected into sky/terrain/water so fog
// melts seamlessly into the sky. Pure function — no uniform-name coupling.
const SKY_GLSL = `
vec3 skyColor(vec3 dir, vec3 sunDir, vec3 zen, vec3 hor, vec3 warm) {
  dir = normalize(dir);
  float t = clamp(dir.y * 1.4 + 0.15, 0.0, 1.0);
  vec3 col = mix(hor, zen, pow(t, 0.65));
  col = mix(col, hor * 0.92, clamp(-dir.y * 3.0, 0.0, 1.0));   // soft below-horizon
  float s = max(dot(dir, normalize(sunDir)), 0.0);
  col += warm * pow(s, 48.0) * 0.9;    // tight sun disc
  col += warm * pow(s, 7.0)  * 0.12;   // broad glow
  return col;
}`;

/* --------------------------------------------------------------------- *
 * § TERRAIN  (indexed mesh; flat shading, banded color, fog → sky)
 * --------------------------------------------------------------------- */

const terrainVS = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
in vec3 aPos;
out vec3 vWorld;
void main() {
  vWorld = aPos;
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}`;

const terrainFS = `#version 300 es
precision highp float;
in vec3 vWorld;
out vec4 frag;
uniform vec3 uSunDir, uCamPos, uZenith, uHorizon, uWarm;
uniform float uFogDensity, uFogNear, uWaterLevel, uWetLevel;
uniform float uTime; uniform int uUnderwater;        // §14B animated seabed caustics
uniform sampler2D uFresh;
uniform sampler2D uMaterial;
${SKY_GLSL}
void main() {
  // Flat shading: face normal from screen-space derivatives of world pos.
  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
  if (n.y < 0.0) n = -n;
  float h = vWorld.y;
  float slope = 1.0 - clamp(n.y, 0.0, 1.0);

  vec3 cSeafloor = vec3(0.42, 0.46, 0.40);
  vec3 cSandWet  = vec3(0.74, 0.67, 0.51);
  vec3 cSandDry  = vec3(0.87, 0.79, 0.60);
  vec3 cGrass    = vec3(0.44, 0.53, 0.31);
  vec3 cForest   = vec3(0.23, 0.35, 0.21);
  vec3 cRock     = vec3(0.46, 0.43, 0.40);

  // Bands rescaled for the big world: a wide sand beach before the dunes.
  vec3 col = cSeafloor;
  col = mix(col, cSandWet, smoothstep(-3.0, 0.4, h));
  col = mix(col, cSandDry, smoothstep(0.6, 4.0, h));
  col = mix(col, cGrass,   smoothstep(10.0, 20.0, h));
  col = mix(col, cForest,  smoothstep(30.0, 58.0, h));
  col = mix(col, cRock,    smoothstep(0.45, 0.70, slope));

  // Painted surface material (dug or player-placed) overrides the height bands.
  vec2 muv = clamp((vWorld.xz + ${HALF.toFixed(1)}) / ${WORLD.toFixed(1)}, 0.0, 1.0);
  float m = texture(uMaterial, muv).r;
  if (m > 0.5) {
    vec3 mc = cGrass;
    if      (m < 1.5) mc = vec3(0.44, 0.53, 0.31);   // grass
    else if (m < 2.5) mc = vec3(0.40, 0.30, 0.20);   // dirt
    else if (m < 3.5) mc = vec3(0.86, 0.78, 0.59);   // sand
    else if (m < 4.5) mc = vec3(0.56, 0.55, 0.51);   // gravel
    else if (m < 5.5) mc = vec3(0.47, 0.44, 0.41);   // stone
    else              mc = vec3(0.34, 0.28, 0.20);   // mud
    col = mix(col, mc, 0.82);
  }

  // Wet sand: darker from the waterline up to the recent high-water mark,
  // drying back toward dry sand above it (wetLevel lags the tide).
  float wet = (1.0 - smoothstep(uWaterLevel, uWetLevel + 0.6, h)) * (1.0 - smoothstep(0.55, 0.72, slope));
  col = mix(col, col * 0.62, clamp(wet, 0.0, 1.0));

  // Fresh-dug soil is darker and browner, fading back as the ground heals.
  vec2 fuv = clamp((vWorld.xz + ${HALF.toFixed(1)}) / ${WORLD.toFixed(1)}, 0.0, 1.0);
  float fresh = texture(uFresh, fuv).r;
  col = mix(col, col * vec3(0.52, 0.42, 0.33), clamp(fresh, 0.0, 1.0) * 0.6);

  // Directional light: warm in the sun, gently cool in shadow.
  float diff = max(dot(n, normalize(uSunDir)), 0.0);
  col *= (0.55 + 0.55 * diff);
  col *= mix(vec3(0.88, 0.91, 0.99), uWarm, diff);

  // §14B animated caustics on the seabed (strongest in the shallows)
  if (uUnderwater == 1 && h < uWaterLevel - 0.1) {
    float shallow = clamp(1.0 - (uWaterLevel - h) / 12.0, 0.0, 1.0);
    vec2 cp = vWorld.xz * 0.33;
    float c = sin(cp.x + uTime*0.9) * sin(cp.y - uTime*0.7) + sin((cp.x + cp.y)*0.6 + uTime*1.1) * 0.6;
    float caust = smoothstep(0.35, 1.0, c*0.5 + 0.5);
    col += col * caust * shallow * 0.6;
  }

  // Distance fog → the sky color for this fragment's own view direction.
  vec3 viewVec = vWorld - uCamPos;
  float dist = length(viewVec);
  float fd = max(dist - uFogNear, 0.0) * uFogDensity;
  float fog = 1.0 - exp(-fd * fd);
  vec3 fogCol = skyColor(viewVec, uSunDir, uZenith, uHorizon, uWarm);
  col = mix(col, fogCol, fog);

  frag = vec4(col, 1.0);
}`;

const terrainProg = program(terrainVS, terrainFS);
const terrainU = uniforms(terrainProg);

// Chunked terrain so digging only rebuilds the touched chunk's vertices.
const CHUNKS = 4;                                  // CHUNKS × CHUNKS tiles
const chunkCells = Math.ceil((GRID - 1) / CHUNKS);
const terrainChunks = [];
function chunkRange(c) { return [c * chunkCells, Math.min(GRID - 1, (c + 1) * chunkCells)]; }
function fillChunkPositions(ch, out) {
  let p = 0;
  for (let z = ch.z0; z <= ch.z1; z++)
    for (let x = ch.x0; x <= ch.x1; x++) {
      const i = z * GRID + x;
      out[p++] = x * CELL - HALF; out[p++] = heightmap[i] + dig[i] + built[i]; out[p++] = z * CELL - HALF;
    }
}
function buildTerrainMesh() {
  const loc = gl.getAttribLocation(terrainProg, "aPos");
  for (let cz = 0; cz < CHUNKS; cz++)
    for (let cx = 0; cx < CHUNKS; cx++) {
      const [x0, x1] = chunkRange(cx), [z0, z1] = chunkRange(cz);
      const nx = x1 - x0 + 1, nz = z1 - z0 + 1;
      const ch = { cx, cz, x0, x1, z0, z1, nx, nz };
      const positions = new Float32Array(nx * nz * 3);
      fillChunkPositions(ch, positions);
      const indices = new Uint32Array((nx - 1) * (nz - 1) * 6);
      let i = 0;
      for (let z = 0; z < nz - 1; z++) for (let x = 0; x < nx - 1; x++) {
        const a = z * nx + x, b = a + 1, c = a + nx, d = c + 1;
        indices[i++] = a; indices[i++] = c; indices[i++] = b;
        indices[i++] = b; indices[i++] = c; indices[i++] = d;
      }
      ch.vao = gl.createVertexArray(); gl.bindVertexArray(ch.vao);
      ch.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ch.vbo);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
      const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
      ch.count = indices.length; ch.scratch = positions;
      terrainChunks[cz * CHUNKS + cx] = ch;
    }
  gl.bindVertexArray(null);
  return { count: terrainChunks.reduce((a, c) => a + c.count, 0) };
}
function rebuildChunkAt(gx, gz) {                   // rebuild chunk(s) covering a grid cell
  const cx = Math.min(CHUNKS - 1, (gx / chunkCells) | 0), cz = Math.min(CHUNKS - 1, (gz / chunkCells) | 0);
  const done = new Set();
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const c = (cz + dz) * CHUNKS + (cx + dx);
    const ch = terrainChunks[c];
    if (!ch || done.has(c)) continue;
    // only rebuild neighbours whose shared edge the cell touches
    if (gx < ch.x0 - 1 || gx > ch.x1 + 1 || gz < ch.z0 - 1 || gz > ch.z1 + 1) continue;
    done.add(c); fillChunkPositions(ch, ch.scratch);
    gl.bindBuffer(gl.ARRAY_BUFFER, ch.vbo); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ch.scratch);
  }
}
function drawTerrainChunks() {
  for (const ch of terrainChunks) { gl.bindVertexArray(ch.vao); gl.drawElements(gl.TRIANGLES, ch.count, gl.UNSIGNED_INT, 0); countDraw(ch.count / 3); }
}

/* --------------------------------------------------------------------- *
 * § HEIGHT TEXTURE  (heightmap sampled by the ocean shaders)
 * --------------------------------------------------------------------- */

function buildHeightTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, heightmap);
  const hf = floatLinear ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, hf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

// "Freshness" texture: how recently each cell was dug (darkens the terrain).
function buildFreshTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, fresh);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
// Surface-material texture: the painted material id per cell (NEAREST; 0 = natural).
function buildMaterialTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, GRID, GRID, 0, gl.RED, gl.FLOAT, matField);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

/* --------------------------------------------------------------------- *
 * § WATER  (dense grid, summed-sine waves, shoreline foam, transparency)
 * --------------------------------------------------------------------- */

const HALF_F = HALF.toFixed(1);
const WORLD_F = WORLD.toFixed(1);

const waterVS = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
uniform float uTime, uWaterLevel;
uniform float uWaterQ;         // §13.6 water quality: scales wave height (0 = flat)
uniform vec2 uCenter;          // grid follows the camera across the big map
uniform sampler2D uHeight, uFilled;
in vec2 aXZ;
out vec3 vWorld;
out float vDepth;
out float vPool;

float waveH(vec2 p, float t) {
  float h = 0.0;
  h += sin(p.x * 0.18 + t * 0.9) * 0.35;
  h += sin(p.y * 0.15 - t * 0.7) * 0.30;
  h += sin((p.x + p.y) * 0.09 + t * 1.3) * 0.18;
  h += sin((p.x - p.y) * 0.22 - t * 1.7) * 0.10;
  return h;
}
void main() {
  vec2 xz = aXZ + uCenter;
  vec2 uv = clamp((xz + ${HALF_F}) / ${WORLD_F}, 0.0, 1.0);
  float terr = texture(uHeight, uv).r;
  float rim = texture(uFilled, uv).r;            // level this cell connects to the sea
  float local = max(uWaterLevel, rim);           // isolated pools hold water to the rim
  float pool = (rim > uWaterLevel + 0.05 && rim > terr + 0.02) ? 1.0 : 0.0;
  float depth = local - terr;
  float damp = pool > 0.5 ? 0.05 : smoothstep(0.0, 2.0, max(0.0, depth)); // pools are still
  float wy = waveH(xz, uTime) * damp * uWaterQ;
  vDepth = depth; vPool = pool;
  vWorld = vec3(xz.x, local + wy, xz.y);
  gl_Position = uProj * uView * vec4(vWorld, 1.0);
}`;

const waterFS = `#version 300 es
precision highp float;
in vec3 vWorld;
in float vDepth;
in float vPool;
out vec4 frag;
uniform vec3 uCamPos, uSunDir, uZenith, uHorizon, uWarm;
uniform float uTime, uFogDensity, uFogNear, uWaterLevel, uWaterQ;
uniform sampler2D uHeight, uFilled;
${SKY_GLSL}
void main() {
  vec2 uv = clamp((vWorld.xz + ${HALF_F}) / ${WORLD_F}, 0.0, 1.0);
  float terr = texture(uHeight, uv).r;
  float rim = texture(uFilled, uv).r;
  float local = max(uWaterLevel, rim);
  if (terr > local - 0.02) discard;               // ground above the local surface
  float depth = local - terr;

  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));  // faceted wave normals
  if (n.y < 0.0) n = -n;
  vec3 v = normalize(uCamPos - vWorld);
  vec3 col; float alpha;

  if (vPool > 0.5) {
    // still, clear tide pool: see the bottom, slight green tint
    vec3 pdeep = vec3(0.12, 0.28, 0.28), pshallow = vec3(0.34, 0.47, 0.42);
    float dm = smoothstep(0.0, 1.6, depth);
    col = mix(pshallow, pdeep, dm);
    vec3 refl = reflect(-v, n);
    col = mix(col, skyColor(refl, uSunDir, uZenith, uHorizon, uWarm), pow(1.0 - max(dot(n, v), 0.0), 3.0) * 0.3);
    alpha = clamp(0.3 + depth * 0.25, 0.25, 0.72);
  } else {
    vec3 deep = vec3(0.05, 0.20, 0.26), shallow = vec3(0.30, 0.52, 0.52);
    float dmix = smoothstep(0.0, 6.0, depth);
    col = mix(shallow, deep, dmix);
    vec3 refl = reflect(-v, n);
    col = mix(col, skyColor(refl, uSunDir, uZenith, uHorizon, uWarm), pow(1.0 - max(dot(n, v), 0.0), 3.0) * 0.5);
    col += uWarm * pow(max(dot(v, reflect(-normalize(uSunDir), n)), 0.0), 48.0) * 0.6;
    // foam band that follows the shoreline as the tide moves (dialled down at low water quality)
    float lap = sin(vWorld.x * 0.6 + uTime * 2.0) * sin(vWorld.z * 0.55 - uTime * 1.6);
    float foam = clamp((1.0 - smoothstep(0.0, 1.3, depth)) * (0.5 + 0.5 * lap), 0.0, 1.0) * smoothstep(0.1, 0.6, uWaterQ);
    col = mix(col, vec3(0.92, 0.95, 0.95), foam * 0.85);
    alpha = max(mix(0.4, 0.9, dmix), foam * 0.9);
  }

  // Fog → sky; fully-fogged water becomes opaque sky so no far edge shows.
  vec3 viewVec = vWorld - uCamPos;
  float dist = length(viewVec);
  float fd = max(dist - uFogNear, 0.0) * uFogDensity;
  float fog = 1.0 - exp(-fd * fd);
  col = mix(col, skyColor(viewVec, uSunDir, uZenith, uHorizon, uWarm), fog);
  alpha = mix(alpha, 1.0, fog);
  frag = vec4(col, alpha);
}`;

const waterProg = program(waterVS, waterFS);
const waterU = uniforms(waterProg);

const WATER_HALF = 820.0;             // half-extent of the camera-following sheet
function buildWaterMesh() {
  const WHALF = WATER_HALF, SEG = 256; // covers out to the fog; follows the camera
  const n = SEG + 1;
  const pos = new Float32Array(n * n * 2);
  let k = 0;
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      pos[k++] = -WHALF + (i / SEG) * WHALF * 2;
      pos[k++] = -WHALF + (j / SEG) * WHALF * 2;
    }
  const idx = new Uint32Array(SEG * SEG * 6);
  let m = 0;
  for (let j = 0; j < SEG; j++)
    for (let i = 0; i < SEG; i++) {
      const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
      idx[m++] = a; idx[m++] = c; idx[m++] = b;
      idx[m++] = b; idx[m++] = c; idx[m++] = d;
    }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(waterProg, "aXZ");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: idx.length };
}

/* --------------------------------------------------------------------- *
 * § SKY  (fullscreen view-ray gradient, drawn as scene background)
 * --------------------------------------------------------------------- */

const fsTriVS = `#version 300 es
precision highp float;
in vec2 aClip;
out vec2 vNdc;
out vec2 vUv;
void main() {
  vNdc = aClip;
  vUv = aClip * 0.5 + 0.5;
  gl_Position = vec4(aClip, 1.0, 1.0);
}`;

const skyFS = `#version 300 es
precision highp float;
in vec2 vNdc;
out vec4 frag;
uniform mat4 uInvVP;
uniform vec3 uCamPos, uSunDir, uZenith, uHorizon, uWarm;
${SKY_GLSL}
void main() {
  vec4 world = uInvVP * vec4(vNdc, 1.0, 1.0);   // unproject far plane
  vec3 dir = normalize(world.xyz / world.w - uCamPos);
  frag = vec4(skyColor(dir, uSunDir, uZenith, uHorizon, uWarm), 1.0);
}`;

const skyProg = program(fsTriVS, skyFS);
const skyU = uniforms(skyProg);

function buildFsTri() {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(skyProg, "aClip");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return vao;
}

/* --------------------------------------------------------------------- *
 * § POST  (nearest upscale + Bayer dither + palette quantization)
 * --------------------------------------------------------------------- */

const postFS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform sampler2D uScene;
uniform vec2 uSceneSize;
uniform int uDither;
uniform int uQuantize;                          // §13.6 palette quantization on/off
uniform float uHungerFx;                        // 0..1 starving: desaturate + darken edges
uniform float uUnderwater;                      // §14A 0..1 submerged: blue-green tint + vignette
uniform float uBreathLow;                       // §14A 0..1 running out of air: darker vignette
const float bayer[16] = float[16](
  0.0, 8.0, 2.0, 10.0,  12.0, 4.0, 14.0, 6.0,
  3.0, 11.0, 1.0, 9.0,  15.0, 7.0, 13.0, 5.0);
void main() {
  vec3 c = clamp(texture(uScene, vUv).rgb, 0.0, 1.0);
  if (uHungerFx > 0.001) { float g = dot(c, vec3(0.299, 0.587, 0.114)); c = mix(c, vec3(g), uHungerFx * 0.7); }  // desaturate when starving
  float levels = 8.0;
  ivec2 p = ivec2(vUv * uSceneSize);            // low-res texel → chunky pattern
  int idx = (p.x & 3) * 4 + (p.y & 3);
  vec3 q;
  if (uQuantize == 0)    q = c;                                              // §13.6 full colour (Ultra)
  else if (uDither == 1) q = floor(c * levels + bayer[idx] / 16.0) / levels;

// Low-res scene framebuffer (reallocated only when its size changes).
const fbo = { w: 0, h: 0, fb: null, color: null, depth: null };
function ensureFBO() {
  const aspect = canvas.width / canvas.height;
  // §13.6 resolution scale: a fraction of the native target width (chunky → crisp); AA supersamples past native.
  const gfx = (typeof GFX !== "undefined") ? GFX : { resScale: IS_TOUCH ? 0.34 : 0.78, aa: false, ssaa: 1.4 };
  let w = Math.round(canvas.width * (gfx.resScale || 0.5) * (gfx.aa ? (gfx.ssaa || 1.4) : 1));
  w = Math.max(200, Math.min(2400, w));
  const h = Math.max(1, Math.round(w / aspect));
  const filter = gfx.aa ? gl.LINEAR : gl.NEAREST;
  if (w === fbo.w && h === fbo.h && filter === fbo.filter) return;
  fbo.w = w; fbo.h = h; fbo.filter = filter;

    fbo.color = gl.createTexture();
    fbo.depth = gl.createRenderbuffer();

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindRenderbuffer(gl.RENDERBUFFER, fbo.depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbo.color, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fbo.depth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

const cam = { pos: [0, 150, 700], yaw: 0, pitch: -0.14, speed: 120 };

// Optional ?cam=x,y,z[,yaw,pitch] — share a seed together with a viewpoint.

/* --------------------------------------------------------------------- *

// Spawn on dry sand at the shore, facing the island's highest point.
// Uses its OWN seeded stream so the spawn is deterministic per seed, independent
// of how much live gameplay randomness (goats, particles) ran before you entered.
function findSpawn() {
  const ang = mulberry32(SEED_INT ^ 0x53504e31)() * Math.PI * 2;
  const dx = Math.sin(ang), dz = -Math.cos(ang);
  for (let rr = HALF * 0.98; rr > 0; rr -= 3) {
    const h = heightAt(dx * rr, dz * rr);
    if (h > 1.8) {                                   // first dry sand above water
      const sx = dx * (rr - 6), sz = dz * (rr - 6);  // a step onto the sand
      return { x: sx, z: sz, yaw: Math.atan2(HIGH.x - sx, -(HIGH.z - sz)) };
    }

  return { x: 0, z: 0, yaw: 0 };

let spawnPoint = null;
function enterWalk() {
  const s = findSpawn();
  spawnPoint = spawnPoint || { x: s.x, z: s.z, yaw: s.yaw };
  player.x = s.x; player.z = s.z; player.bob = 0;
  player.eyeY = surfaceAt(s.x, s.z).h + EYE;
  player.feetY = surfaceAt(s.x, s.z).h; player.vy = 0; player.airborne = false; player.landStun = 0; jumpBufferT = 0;
  lastSafe.x = s.x; lastSafe.z = s.z;

/* ===================================================================== *
 * § 14A  SWIMMING, BREATH & DROWNING
 * ===================================================================== */
let onSplash = null, onHeartbeat = null, onDrown = null;   // sound hooks (Phase 18)
function startSwim() {
  if (player.swimming) return;
  player.swimming = true; player.vy = 0; player.airborne = false;
  const surf = waterSurfaceAt(player.x, player.z);
  player.eyeY = Math.min(player.eyeY, surf + 0.1);
  spawnSand(player.x, surf + 0.1, player.z, 14, [0.72, 0.86, 0.96]); if (onSplash) onSplash();
}

  const g = surfaceAt(player.x, player.z).h;
  player.feetY = g; player.eyeY = g + EYE; player.vy = 0;
  spawnSand(player.x, waterSurfaceAt(player.x, player.z) + 0.1, player.z, 8, [0.72, 0.86, 0.96]); if (onSplash) onSplash();
}
// Full-3D swim movement; run in place of the walk logic while player.swimming.
function swimStep(dt, right) {
  const camF = camForward();
  let wx = 0, wy = 0, wz = 0, moving = false;
  if (keys["KeyW"]) { wx += camF[0]; wy += camF[1]; wz += camF[2]; moving = true; }
  if (keys["KeyS"]) { wx -= camF[0]; wy -= camF[1]; wz -= camF[2]; moving = true; }
  if (keys["KeyD"]) { wx += right[0]; wz += right[2]; moving = true; }
  if (keys["KeyA"]) { wx -= right[0]; wz -= right[2]; moving = true; }
  if (Math.abs(analog.x) + Math.abs(analog.y) > 0.01) { wx += right[0]*analog.x + camF[0]*analog.y; wy += camF[1]*analog.y; wz += right[2]*analog.x + camF[2]*analog.y; moving = true; }
  if (keys["Space"] || mobileSwimUp) { wy += 1; moving = true; }
  if (keys[crouchKey] || mobileSwimDown) { wy -= 1; moving = true; }
  const diving = keys[crouchKey] || mobileSwimDown || (moving && wy < -0.05);
  const wl = Math.hypot(wx, wy, wz);
  const tired = exhausted || stamina < 0.02;
  player.sprinting = (keys["ShiftLeft"] || mobileSprint) && wl > 0.01 && !tired && !isPanelOpen();
  if (isPanelOpen()) { moving = false; }
  let spd = SWIM_SPEED * (player.sprinting ? SWIM_SPRINT : 1) * (tired ? 0.45 : 1);
  if (moving && wl > 0.01 && !isPanelOpen()) {
    wx /= wl; wy /= wl; wz /= wl;
    spendStamina((player.sprinting ? SWIM_SPRINT_DRAIN : SWIM_DRAIN) * dt, false);
  } else { wx = wy = wz = 0; }

    nx = sx ? nx : player.x; nz = sz ? nz : player.z; }
  player.x = nx; player.z = nz;

  player.eyeY = ny; player.feetY = ny - 1.0;

}

      const a = Math.atan2(s.x, -s.z); for (let rr = HALF*0.95; rr > 4; rr -= 2) { const bx = Math.sin(a)*rr, bz = -Math.cos(a)*rr; if (heightAt(bx,bz) > 1.5 && heightAt(bx,bz) < 4) { s.x = bx; s.z = bz; break; } }

    player.x = s.x; player.z = s.z;
    stopSwim();
    const g = surfaceAt(s.x, s.z).h; player.feetY = g; player.eyeY = g + EYE; player.vy = 0; player.airborne = false;
    player.breath = BREATH_MAX; breathLow = 0;

// screen fade: to black, run mid() at the peak, then back
const fade = { active: false, t: 0, dur: 1.4, mid: null, fired: false };
function startFade(mid) { fade.active = true; fade.t = 0; fade.mid = mid; fade.fired = false; }

/* ===================================================================== *
 * § 15  CLIMBING — grab a steep rock face (hold E / climb button), WASD

// §13.2 the Tool Kit counts as owning the shovel, axe and pickaxe

// Debug: audit every registry mesh for invisible / degenerate geometry.
function auditRegistries() {
  const bad = [];
  const check = (name, fn) => { try { const m = fn(); const nv = m.pos.length / 3;
    if (nv === 0) bad.push(name + ": empty geometry");
    else if (m.col.length !== m.pos.length) bad.push(name + ": color/pos mismatch");
    else if (m.pos.every((v) => Math.abs(v) < 1e-4)) bad.push(name + ": zero extent");
    else if (m.pos.some((v) => !isFinite(v))) bad.push(name + ": NaN positions");
  } catch (e) { bad.push(name + ": threw " + e.message); } };
  for (const k in CREATURES) check("creature:" + k, CREATURES[k].mesh);
  for (const k in FINDS) check("find:" + k, FINDS[k].mesh);
  for (const k in ITEMS) check("item:" + k, ITEMS[k].model);
  const total = Object.keys(CREATURES).length + Object.keys(FINDS).length + Object.keys(ITEMS).length;
  if (bad.length) console.warn("[visibility audit] " + bad.length + " problem(s):\n  " + bad.join("\n  "));
  else console.log("[visibility audit] all " + total + " registry meshes build with valid geometry");
  return bad;
}

    arr[o]=x; arr[o+1]=gy; arr[o+2]=z; arr[o+3]=rad*2; arr[o+4]=0; arr[o+5]=0; arr[o+6]=0;

/* --------------------------------------------------------------------- *
 * § PROP & POI MESH BUILDER  (tiny procedural models; triangle soup, flat
 *   shaded in the fragment shader like everything else)
 * --------------------------------------------------------------------- */

function Mesh() { return { pos: [], col: [] }; }
function mV(m, x, y, z, c) { m.pos.push(x, y, z); m.col.push(c[0], c[1], c[2]); }

// Tapered cylinder / cone around the Y axis (r1=0 → cone).
function mCyl(m, y0, y1, r0, r1, sides, col) {
  for (let i = 0; i < sides; i++) {
    const a0 = (i / sides) * 6.2832, a1 = ((i + 1) / sides) * 6.2832;
    const p00 = [Math.cos(a0) * r0, y0, Math.sin(a0) * r0];
    const p10 = [Math.cos(a1) * r0, y0, Math.sin(a1) * r0];
    const p01 = [Math.cos(a0) * r1, y1, Math.sin(a0) * r1];
    const p11 = [Math.cos(a1) * r1, y1, Math.sin(a1) * r1];

    else mQuad(m, p00, p10, p11, p01, col);

  mQuad(m, s[4],s[5],s[6],s[7], col); mQuad(m, s[1],s[0],s[3],s[2], col);
  mQuad(m, s[0],s[1],s[5],s[4], col); mQuad(m, s[2],s[3],s[7],s[6], col);

function mRock(m, rand, col) {

    mTri(m, p[t[0]], p[t[1]], p[t[2]], [col[0]*k, col[1]*k, col[2]*k]);
