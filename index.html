  }
  gl.uniform1i(propU.uWetBand, 0);                         // §13.7 reset so creatures / tools / icons aren't affected
  gl.uniform1f(propU.uSway, 0);                            // §14B reset sway
  gl.uniform1i(propU.uClampTop, 0);                        // §14B reset surface clamp
}

/* §13.6 SUN SHADOWS — soft contact shadows grounded under props & creatures (High/Ultra).

const shadowProg = program(`#version 300 es
precision highp float;
uniform mat4 uProj, uView;

in vec4 iInst;            // x, y, z, radius

/* §3 GULL SHADOWS — soft, elongated, oriented along flight; shrink & fade with height,

// §14B a single wavy blade of seaweed: a tapering vertical ribbon curved into a gentle S, so
// the tip bends most. Drawn double-sided (props aren't face-culled) and animated by the sway shader.
function wavyRibbon(m, o) {
  const seg = o.seg || 7, h = o.h, dir = o.dir || 0, amp = o.amp || 0.2, freq = o.freq || 1.0,
        phase = o.phase || 0, droop = o.droop || 0, bx = o.bx || 0, bz = o.bz || 0,
        y0 = o.y0 || 0, twist = o.twist || 0;
  const px = Math.cos(dir + 1.5708), pz = Math.sin(dir + 1.5708);   // width axis (across the blade)
  const wx = Math.cos(dir), wz = Math.sin(dir);                      // curve axis (the blade bends this way)
  let pL = null, pR = null, pC = null;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const y = y0 + t * h - droop * t * t;
    const bend = Math.sin(t * freq * Math.PI + phase) * amp * t;     // base anchored, tip sweeps
    const cx = bx + wx * bend, cz = bz + wz * bend;
    const w = o.w0 * (1 - t) + o.w1 * t;
    const tw = twist * t, ct = Math.cos(tw), st = Math.sin(tw);
    const qx = px * ct + wx * st, qz = pz * ct + wz * st;            // width axis, gently twisting
    const col = [o.c0[0] + (o.c1[0]-o.c0[0])*t, o.c0[1] + (o.c1[1]-o.c0[1])*t, o.c0[2] + (o.c1[2]-o.c0[2])*t];
    const L = [cx - qx*w, y, cz - qz*w], R = [cx + qx*w, y, cz + qz*w];
    if (pL) mQuad(m, pL, pR, R, L, col);
    pL = L; pR = R; pC = col;
  }
}

function latinName() { return ODD_GENUS[(rng()*ODD_GENUS.length)|0] + " " + ODD_SPECIES[(rng()*ODD_SPECIES.length)|0]; }

function spawnCreature(t, x, z, extra) {
  const e = { kind: "creature", t, x, z, yaw: rng()*6.283, scale: CREATURES[t].base*(0.85+rng()*0.3),
              phase: rng()*6.283, state: "idle", timer: rng()*3, vx: 0, vz: 0, hx: x, hz: z, hr: extra?.hr||6,
              closed: 0, special: false, name: CREATURES[t].label, tint: [1,1,1], id: _critId++ };
  Object.assign(e, extra); if (!e.variant) applyVariant(e); life.push(e); if (crabLog && t === "crab") console.log(`crab#${e.id} spawn at ${x.toFixed(1)},${z.toFixed(1)}`); return e;
}
function spawnFind(t, x, z) {
  life.push({ kind: "find", t, x, z, yaw: rng()*6.283, scale: FINDS[t].base*(0.85+rng()*0.3),
              phase: rng()*6.283, name: FINDS[t].label, tint: [1,1,1], pickAt: clock.t });
}
/* §22 ANOMALIES — every eligible spawn rolls for a rare variant: a Giant, or a
   colour morph (blue like the famous blue lobster, albino, or two-tone). */
const VARIANT_GIANT_P = 0.015, VARIANT_MORPH_P = 0.02;   // per spawn (tunable)
const VARIANT_MORPHS = ["blue","albino","twotone"];
const VARIANT_TINT = { blue:[0.32,0.5,0.98], albino:[0.97,0.95,0.97], twotone:[0.6,0.52,0.78] };
const VARIANT_LABEL = { giant:"Giant", blue:"Blue", albino:"Albino", twotone:"Two-tone" };
const VARIANT_BADGE = { giant:"◆", blue:"🔵", albino:"⚪", twotone:"◑" };
let variantsSeen = {};   // species → { giant:n, blue:n, albino:n, twotone:n } (persisted)
function variantEligible(t) { const r = CREATURES[t]; return !!(r && (FISH[t] || r.stoneCritter || t==="crab" || t==="star" || t==="horseshoe" || t==="gull" || t==="hermit" || t==="urchin")); }
function applyVariant(e) {
  if (!variantEligible(e.t)) return;
  const r = rng();
  if (r < VARIANT_GIANT_P) { e.variant = "giant"; e.scale *= 1.8 + rng()*0.7; }
  else if (r < VARIANT_GIANT_P + VARIANT_MORPH_P) { const m = VARIANT_MORPHS[(rng()*VARIANT_MORPHS.length)|0]; e.variant = m; e.tint = VARIANT_TINT[m].slice(); }
}
function variantBadge(e) { const v = e && e.variant; return v ? "  " + (VARIANT_BADGE[v]||"◆") + " " + VARIANT_LABEL[v] : ""; }
function recordVariant(e) {
  const v = e && e.variant; if (!v) return;
  if (!variantsSeen[e.t]) variantsSeen[e.t] = {};
  variantsSeen[e.t][v] = (variantsSeen[e.t][v]||0) + 1;
  if (typeof saveState === "function") saveState();
}

function populateLife() {
  life = [];
  // pools: fish, anemones, stars, urchins, hermits
  for (const p of pools) {
    const area = p.n, cx = p.x, cz = p.z, rad = Math.min(14, Math.sqrt(area) * CELL * 0.4);
    const nFish = Math.min(6, 1 + (area / 120) | 0);
    for (let i = 0; i < nFish; i++) spawnCreature("fish", cx + (rng()-0.5)*rad, cz + (rng()-0.5)*rad, { hx: cx, hz: cz, hr: rad, poolRim: p.rim });
    for (let i = 0; i < 2 + (rng()*3|0); i++) spawnCreature(rng()<0.5?"anemone":"star", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { poolRim: p.rim });
    if (rng() < 0.6) spawnCreature("urchin", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { poolRim: p.rim });
    if (rng() < 0.5) spawnCreature("hermit", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { hr: rad, poolRim: p.rim });
    // §16.1 more pool life: shrimp flicking about, grazing snails, the occasional shy octopus
    for (let i = 0; i < 1 + (rng()*3|0); i++) spawnCreature("shrimp", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { hx: cx, hz: cz, hr: rad, poolRim: p.rim });
    for (let i = 0; i < (rng()*3|0); i++) spawnCreature("snail", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { hx: cx, hz: cz, hr: rad, poolRim: p.rim });
    if (rng() < 0.3) spawnCreature("octopus", cx+(rng()-0.5)*rad, cz+(rng()-0.5)*rad, { hx: cx, hz: cz, hr: rad, poolRim: p.rim });
  }
  // crabs along the shore band (wet sand zone)
  for (let i = 0; i < 70; i++) {
    const a = rng()*6.283, r = HALF*(0.3 + rng()*0.6), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = heightAt(x, z); if (h > 1 && h < 9) spawnCreature("crab", x, z, { hr: 10 });
  }
  // gulls over the beaches
  for (let i = 0; i < 10; i++) {
    const a = rng()*6.283, r = HALF*(0.35+rng()*0.4), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    spawnCreature("gull", x, z, { state: "circle", cxx: x, czz: z, orbit: 20+rng()*25, alt: 22+rng()*18 });
  }
  // sandpipers along the wave edge
  for (let i = 0; i < 24; i++) {
    const a = rng()*6.283, r = HALF*(0.3 + rng()*0.55), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = heightAt(x, z); if (h > -1 && h < 5) spawnCreature("piper", x, z, { timer: rng(), side: rng()<0.5?1:-1 });
  }
  // biome-specific critters along the coast (herons on flats/marsh, hoppers on cobble)
  for (let i = 0; i < 70; i++) {
    const a = rng()*6.283, r = HALF*(0.3 + rng()*0.52), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = heightAt(x, z); if (h < -2 || h > 6) continue;
    const t = COAST_BIOMES[coastBiomeAt(x, z)].crit[(rng()*COAST_BIOMES[coastBiomeAt(x, z)].crit.length)|0];
    if (t === "heron" && rng() < 0.3) spawnCreature("heron", x, z, { timer: rng()*3, tx: x, tz: z });
    else if (t === "hopper" && rng() < 0.5) spawnCreature("hopper", x, z, { timer: rng() });
    else if (t === "crab" && rng() < 0.4) spawnCreature("crab", x, z, { hr: 10 });
  }
  // §14B underwater finds scattered on the seabed — reward for diving (shells, sand dollars, glass floats)
  const SEABED_FINDS = ["sanddollar","shell","moonsnail","seaglass","mussel","limpet","oyster","nautilus","barnacle"];
  for (let i = 0; i < 130; i++) {
    const a = rng()*6.283, r = HALF*(0.35 + rng()*0.55), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = surfaceAt(x, z).h, ci = cellIndex(x, z);
    if (h > -1 || h < -16 || ci < 0 || filled[ci] > waterLevel + 0.35) continue;   // open seabed only
    const t = rng() < 0.06 ? "glassfloat" : SEABED_FINDS[(rng()*SEABED_FINDS.length)|0];
    spawnFind(t, x, z);
  }
  // §14C huntable fish by depth zone + schooling minnows in the shallows
  for (let i = 0; i < 90; i++) {                                  // flounder on sandy shallows
    const a = rng()*6.283, r = HALF*(0.35 + rng()*0.5), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = surfaceAt(x, z).h, ci = cellIndex(x, z), d = -h;
    if (ci < 0 || filled[ci] > waterLevel+0.35 || d < 0.6 || d > 4.5) continue;
    if (rng() < 0.45) spawnCreature("flounder", x, z, { hx:x, hz:z, hr:6, timer: rng()*2 });
  }
  for (let i = 0; i < 80; i++) {                                  // rockfish hover in the kelp / mid-depths
    const a = rng()*6.283, r = HALF*(0.3 + rng()*0.5), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = surfaceAt(x, z).h, ci = cellIndex(x, z), d = -h;
    if (ci < 0 || filled[ci] > waterLevel+0.35 || d < 4 || d > 15) continue;
    if (rng() < 0.4) spawnCreature("rockfish", x, z, { hx:x, hz:z, hr:7, timer: rng()*2 });
  }
  for (let i = 0; i < 30; i++) {                                  // lingcod — rare, on the deep reef drop-off
    const a = rng()*6.283, r = HALF*(0.4 + rng()*0.45), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = surfaceAt(x, z).h, ci = cellIndex(x, z), d = -h;
    if (ci < 0 || filled[ci] > waterLevel+0.35 || d < 8 || d > 20) continue;
    if (rng() < 0.3) spawnCreature("lingcod", x, z, { hx:x, hz:z, hr:9, timer: rng()*3 });
  }
  for (let s = 0; s < 10; s++) {                                  // minnow schools in the shallows
    const a = rng()*6.283, r = HALF*(0.35 + rng()*0.45), cx = Math.sin(a)*r, cz = -Math.cos(a)*r;
    const h = surfaceAt(cx, cz).h; if (filled[Math.max(0,cellIndex(cx,cz))] > waterLevel+0.35 || -h < 1 || -h > 8) continue;
    const nn = 6 + (rng()*6|0);
    for (let k = 0; k < nn; k++) spawnCreature("minnow", cx+(rng()-0.5)*4, cz+(rng()-0.5)*4, { hx:cx, hz:cz, hr:5, timer: rng()*2 });
  }

    const a = rng()*6.283, r = HALF*(0.28 + rng()*0.5), cx = Math.sin(a)*r, cz = -Math.cos(a)*r;
    const ci = cellIndex(cx, cz), d = -surfaceAt(cx, cz).h;

    const nn = 2 + (rng()*3|0);
    for (let k = 0; k < nn; k++) spawnCreature("seaduck", cx+(rng()-0.5)*6, cz+(rng()-0.5)*6, { hx: cx, hz: cz, hr: 12 });
    duckRafts++;
  }
  // oddities: 1–2 special creatures
  const oddN = 1 + (rng()<0.5?1:0);
  for (let i = 0; i < oddN; i++) {
    const pool = ["crab","star","anemone","fish","urchin"][(rng()*5)|0];
    const base = life.filter((e) => e.t === pool);
    if (base.length) {
      const e = base[(rng()*base.length)|0];
      e.special = true; e.scale *= 1.7; e.tint = [1.4, 0.7 + rng()*0.5, 1.4]; e.name = latinName();
    }
  }

  washUp(true);
}

// Wash fresh finds along the current wrack line + exposed flats at low tide.
let lastLowCount = 0;
const LITTER = ["plasticbottle", "drinkcan", "bottlecap", "plasticbag", "foamchunk", "netscrap", "strawbit"];   // §17.1
function washUp(initial) {
  const ev = currentEvent;
  if (ev === "kelp") addFlotsam(3 + (rng()*3|0), 0.95);   // §gulls a kelp storm sets loose bull kelp drifting on the water
  const baseN = initial ? 60 : 30, n = ev === "storm" ? baseN * 2 : baseN;
  for (let i = 0; i < n; i++) {
    const a = rng()*6.283, r = HALF*(0.25 + rng()*0.72), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const h = heightAt(x, z);
    if (!(h > waterLevel + 0.3 && h < wetLevel + 4)) continue;       // only on exposed sand near the wrack line
    const cb = COAST_BIOMES[coastBiomeAt(x, z)], roll = rng();
    // §17.1 occasional washed-up litter (a bit more after a storm) — collect it to clean the shore
    if (rng() < (ev === "storm" ? 0.16 : 0.09)) { spawnFind(LITTER[(rng()*LITTER.length)|0], x, z); continue; }
    // event flavour (rare finds weighted down; see §C variety)
    if (ev === "kelp" && roll < 0.55) { spawnFind("kelp", x, z); if (rng() < 0.5) { const p = cb.finds[(rng()*cb.finds.length)|0]; if (FINDS[p]) spawnFind(p, x+(rng()-0.5), z+(rng()-0.5)); } continue; }
    if (ev === "driftseed" && roll < 0.5) { spawnFind(rng() < 0.65 ? "seabean" : "coconut", x, z); continue; }
    if (ev === "floats" && roll < 0.4) { spawnFind("float", x, z); continue; }
    if (ev === "storm" && roll < 0.28) { spawnFind(["driftwood","float","bottle","rope","crate"][(rng()*5)|0], x, z); continue; }   // generic flotsam, not wreck debris
    // otherwise biome-weighted: mostly commons, rarer finds sit lower / farther out
    const low = h < waterLevel + 1.6;
    let pick;
    if (low && rng() < (ev === "storm" ? 0.42 : 0.22)) pick = ["float","egg","bottle","bone","agate"][(rng()*5)|0];
    else pick = cb.finds[(rng()*cb.finds.length)|0];
    if (FINDS[pick]) spawnFind(pick, x, z);
  }
  // sea-star stranding: scatter rescuable stars across the just-bared sand
  if (ev === "stars") for (let i = 0; i < 40; i++) { const a = rng()*6.283, r = HALF*(0.28+rng()*0.55), x = Math.sin(a)*r, z = -Math.cos(a)*r, h = heightAt(x, z);
    if (h > waterLevel + 0.1 && h < wetLevel + 2.5) spawnCreature("star", x, z, { stranded: true }); }
  // jellyfish bloom across the flats
  if (ev === "jelly") for (let i = 0; i < 36; i++) { const a = rng()*6.283, r = HALF*(0.28+rng()*0.55), x = Math.sin(a)*r, z = -Math.cos(a)*r, h = heightAt(x, z);
    if (h > waterLevel + 0.1 && h < wetLevel + 2.0) spawnCreature("jelly", x, z, {}); }
  // very rare: the island oddity washes up
  if (ev === "oddity" && ODDITY_ITEM) { const a = rng()*6.283, r = HALF*(0.35+rng()*0.4), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    if (heightAt(x, z) > waterLevel + 0.2) spawnFind(ODDITY_ITEM, x, z); }
  // Minus tide: the outer zone, normally underwater, is bared — the best wash-up (§B).
  if (isMinusTideNow()) {
    for (let i = 0; i < 24; i++) {
      const a = rng()*6.283, r = HALF*(0.3 + rng()*0.62), x = Math.sin(a)*r, z = -Math.cos(a)*r, h = heightAt(x, z);
      if (h > waterLevel + 0.2 && h < waterLevel + 2.2) {                 // the freshly-bared outer shelf
        const pick = rng() < 0.3 ? ["float","bell","tin","bone"][(rng()*4)|0] : ["float","egg","bottle","cuttle","seaglass"][(rng()*5)|0];
        if (FINDS[pick]) spawnFind(pick, x, z);
      }
    }
  }
  // cap total finds
  const finds = life.filter((e) => e.kind === "find");
  if (finds.length > 500) life = life.filter((e) => e.kind !== "find").concat(finds.slice(-500));
  if (!initial) addFlotsam(2 + (currentEvent === "storm" ? 3 : 0));   // §5 each tide drifts a little more flotsam in
}

/* ===================================================================== *
 * § 5  FLOATING DEBRIS (flotsam) — litter that bobs & drifts on the water,
 *      beaches itself into a wash-up, and can be scooped straight from the sea.
 *      A running "beach cleanup" tally climbs whenever you clear litter.
 * ===================================================================== */
let flotsam = [];            // { id, x, z, ph, yaw, spin, lat }
let beachCleanup = 0;        // litter removed from shore & water (shown in the journal)
const FLOTSAM_CAP = 16, FLOTSAM_R = 0.55;
const _flotScratch = {};     // per-litter-type instance scratch
function flotsamSpawnPoint() {
  // prefer the near-shore water band where it'll drift in and be seen
  for (let k = 0; k < 60; k++) { const a = rng()*6.283, r = HALF*(0.45 + rng()*0.5), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const d = waterDepthAt(x, z); if (d > 0.6 && d < 8) return { x, z }; }
  return null;
}
function addFlotsam(n, kelpBias) {
  for (let i = 0; i < n && flotsam.length < FLOTSAM_CAP; i++) { const sp = flotsamSpawnPoint(); if (!sp) continue;
    const id = rng() < (kelpBias != null ? kelpBias : 0.22) ? "kelp" : LITTER[(rng()*LITTER.length)|0];   // §gulls loose bull kelp drifts among the litter
    flotsam.push({ id, x: sp.x, z: sp.z, ph: rng()*6.283, yaw: rng()*6.283, spin: (rng()-0.5)*0.5, lat: (rng()-0.5) }); }
}
function seedFlotsam() { flotsam = []; addFlotsam(5 + (rng()*4|0)); }
function updateFlotsam(dt) {
  const flood = tideInfo().rising;                          // a flood tide pushes debris shoreward; an ebb barely holds it
  for (let i = flotsam.length - 1; i >= 0; i--) { const f = flotsam[i];
    f.ph += dt*1.4; f.yaw += f.spin*dt;
    const grad = groundGradient(f.x, f.z);                  // dx,dz point downhill → out to deeper water
    const sh = flood ? 0.6 : 0.18;                          // net shoreward pull
    const dx = -grad.dx*sh + (-grad.dz)*f.lat*0.35, dz = -grad.dz*sh + (grad.dx)*f.lat*0.35;
    f.x += dx*dt*0.7; f.z += dz*dt*0.7;
    const depth = waterDepthAt(f.x, f.z);
    if (depth < 0.22) { const w = nearestWalkable(f.x, f.z); spawnFind(f.id, w[0], w[1]); flotsam.splice(i, 1); continue; }   // §5 beached → a wash-up on the sand
    if (depth > 11 || Math.hypot(f.x, f.z) > HALF*0.95) flotsam.splice(i, 1);   // drifted out to sea → gone
  }
}
function collectFlotsam(f) {
  const i = flotsam.indexOf(f); if (i < 0) return;
  const added = Inv.add(f.id, 1);
  if (added <= 0) { showCard("Pack full", "Drop something to make room."); bagShake(); return; }
  flotsam.splice(i, 1);
  const first = !discovered.has("f_" + f.id); discovered.add("f_" + f.id); notify(f.id, 1, first);
  if (f.id !== "kelp") beachCleanup++;   // §gulls kelp is a harvest, not litter cleanup
  saveState();
}
function drawFlotsam(view) {
  if (!flotsam.length) return;
  propUniforms(view);
  const px = cam.pos[0], pz = cam.pos[2], byType = {};
  for (const f of flotsam) { const dx = f.x-px, dz = f.z-pz; if (dx*dx+dz*dz > DRAW_R*DRAW_R) continue; (byType[f.id] = byType[f.id] || []).push(f); }
  for (const id in byType) {
    const dyn = id === "kelp" ? (looseKelpDyn || (looseKelpDyn = makeDynamic(looseKelpMesh(), FLOTSAM_CAP))) : (FINDS[id] && FINDS[id].dyn);   // §gulls loose kelp has its own float mesh
    if (!dyn) continue; const arr = byType[id];
    let s = _flotScratch[id]; if (!s || s.length < arr.length*10) s = _flotScratch[id] = new Float32Array(Math.max(16, arr.length)*10);
    let n = 0; for (const f of arr) { const o = n*10, y = waterSurfaceAt(f.x, f.z) + 0.02 + Math.sin(f.ph)*0.04;
      s[o]=f.x; s[o+1]=y; s[o+2]=f.z; s[o+3]=1; s[o+4]=f.yaw; s[o+5]=Math.sin(f.ph*0.7)*0.18; s[o+6]=f.yaw; s[o+7]=1; s[o+8]=1; s[o+9]=1; n++; }
    dyn.draw(s, n); }
}

/* ===================================================================== *
 * § 5  BARNACLES — acorn-barnacle crusts on intertidal rocks (below the high-tide
 *      line). Scrape them with the Tool Kit for bait; they regrow over a few days.
 * ===================================================================== */
let barnacles = [];          // { x, z, g, rsc, yaw, amt, max, regrowAt }  — each is a little intertidal rock crusted with barnacles
const BARNACLE_REGROW_DAYS = 3;
let barnacleDyn = null, barnacleRockDyn = null;
function barnTop(b) { return b.g + b.rsc*0.3; }                 // where the crust sits on the rock
function seedBarnacles() {
  barnacles = [];
  const want = 9 + (rng()*8|0);
  for (let k = 0; k < 700 && barnacles.length < want; k++) {
    const a = rng()*6.283, r = HALF*(0.46 + rng()*0.48), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    const s = surfaceAt(x, z), g = s.h;
    if (g > MAX_HIGH_TIDE - 0.3 || g < MAX_HIGH_TIDE - 4 || s.slope > 0.55) continue;   // the intertidal band, just below the high-tide line
    if (bigPropBlocking(x, z, 1.2)) continue;
    if (barnacles.some(b => Math.hypot(b.x-x, b.z-z) < 6)) continue;                     // keep them spread out
    const max = 3 + (rng()*4|0);
    barnacles.push({ x, z, g, rsc: 0.55 + rng()*0.7, yaw: rng()*6.283, amt: max, max, regrowAt: 0 });
  }
}
function updateBarnacles() {
  for (const b of barnacles) if (b.amt < b.max && b.regrowAt && clock.t >= b.regrowAt) {
    b.amt++; b.regrowAt = b.amt < b.max ? clock.t + BARNACLE_REGROW_DAYS*DAY_PERIOD : 0;
  }
}
function barnacleExposed(b) { return waterLevel < barnTop(b) + 0.35; }    // reachable when the tide isn't covering the rock
function scrapeBarnacle(b) {
  if (!b || b.amt <= 0) { showCard("Bare rock", "Give the barnacles a few days to grow back."); return; }
  if (!(selectedItem() === "toolkit" || selectedTool() === "shovel")) { showCard("Scrape them off", "Scrape barnacles with the Tool Kit (or a shovel)."); return; }
  if (!canHeavyAction()) { if (digCommit <= 0) tooTired(); return; }
  shovelSwing = 1; spendStamina(CHOP_COST*0.5, true); rootPlayer(); if (onDig) onDig("chop");
  const added = Inv.add("barnacle", 1);
  if (added <= 0) { showCard("Pack full", "Drop something to make room."); bagShake(); return; }
  b.amt--; b.regrowAt = clock.t + BARNACLE_REGROW_DAYS*DAY_PERIOD;
  const first = !discovered.has("f_barnacle"); discovered.add("f_barnacle"); notify("barnacle", 1, first);
  spawnSand(b.x, barnTop(b), b.z, 4, [0.9,0.86,0.8]);
  if (b.amt <= 0) showCard("Scraped clean", "Good bait. They'll crust back over in time.");
}
function drawBarnacles(view) {
  if (!barnacles.length) return;
  if (!barnacleDyn) barnacleDyn = makeDynamic(barnacleMesh(), 200);
  if (!barnacleRockDyn) barnacleRockDyn = makeDynamic(rockMesh((SEED_INT^0x5b)>>>0, "rounded", [0.4,0.4,0.42]), 64);   // dark wet intertidal rock
  propUniforms(view);
  const px = cam.pos[0], pz = cam.pos[2];
  // the little rocks first
  let nr = 0; for (const b of barnacles) { if (nr >= 64) break; const dx = b.x-px, dz = b.z-pz; if (dx*dx+dz*dz > DRAW_R*DRAW_R) continue;
    const o = nr*10; digScratch[o]=b.x; digScratch[o+1]=b.g; digScratch[o+2]=b.z; digScratch[o+3]=b.rsc; digScratch[o+4]=b.yaw; digScratch[o+5]=0; digScratch[o+6]=0;
    digScratch[o+7]=0.78; digScratch[o+8]=0.8; digScratch[o+9]=0.84; nr++; }
  if (nr) barnacleRockDyn.draw(digScratch, nr);
  // then the barnacle crust on top, shrinking as it's scraped away
  let n = 0; for (const b of barnacles) { if (b.amt <= 0 || n >= 200) continue; const dx = b.x-px, dz = b.z-pz; if (dx*dx+dz*dz > DRAW_R*DRAW_R) continue;
    const sc = (0.55 + 0.6*(b.amt/Math.max(1,b.max))) * (0.7+b.rsc*0.3), o = n*10;
    digScratch[o]=b.x; digScratch[o+1]=barnTop(b); digScratch[o+2]=b.z; digScratch[o+3]=sc; digScratch[o+4]=b.yaw*1.7; digScratch[o+5]=0; digScratch[o+6]=0;
    digScratch[o+7]=1; digScratch[o+8]=1; digScratch[o+9]=1; n++; }
  if (n) barnacleDyn.draw(digScratch, n);
}

// §1c crab lifecycle logging (toggle with K in debug mode) + a stable id per creature
let _critId = 0, crabLog = false;
// §1c a point on the wet sand band (just above the current waterline) near (cx,cz), or null
function wetBandSpot(cx, cz) {
  for (let t = 0; t < 22; t++) {
    const a = rng()*6.283, r = 1.5 + rng()*8, x = cx + Math.cos(a)*r, z = cz + Math.sin(a)*r;
    const b = waterLevel - heightAt(x, z);                 // negative = above the water
    if (b < -0.1 && b > -3.2 && waterDepthAt(x, z) < 0.12) return [x, z];
  }
  return null;
}
// visibility: is this entity currently present given tide/time?
function lifeVisible(e) {
  if (e.dying !== undefined) return true;                              // §R4 always show the death animation
  const g = heightAt(e.x, e.z);
  if (e.kind === "find") return waterLevel < g + 1.6 || g < -1;        // exposed/shallow, or resting on the seabed (§14B)
  if (e.t === "crab") { const d = waterLevel - g; return d < 0.1 && d > -4; }  // wet sand
  if (e.t === "flounder") return waterDepthAt(e.x, e.z) > 0.12;        // §1e only while submerged — never beached
  if (e.t === "jelly") return waterLevel < g + 0.2;                    // stranded low tide
  if (e.t === "seal") return waterLevel < g + 0.6 && e.state !== "gone";
  if (e.t === "gull") return true;
  if (e.t === "piper") return Math.abs(waterLevel - g) < 6;           // stays near the wave edge
  if (e.poolRim !== undefined) return true;                           // pool life always (pool holds water)
  return true;
}

const BASE_UPDATE_R = 70, BASE_DRAW_R = 190;   // §13.6 base radii; graphics settings scale these live
let UPDATE_R = BASE_UPDATE_R, DRAW_R = BASE_DRAW_R;
// §R4 populations replenish: remember the starting census, and slowly top each species back up toward it after kills.
let creatureCensus = {}, _replenishT = 25;
function recordCensus() { creatureCensus = {}; for (const e of life) if (e.kind === "creature" && !FISH[e.t]) creatureCensus[e.t] = (creatureCensus[e.t]||0) + 1; }
function queueRespawn() {}   // kept for call-site clarity; the census top-up handles it
function respawnOne(t) {
  const reg = CREATURES[t]; if (!reg) return false;
  // find a spot in a plausible band, away from the player
  for (let k = 0; k < 120; k++) {
    const a = rng()*6.283, r = HALF*(0.2 + rng()*0.72), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    if (Math.hypot(x-player.x, z-player.z) < 25) continue;
    // §gulls (and all life) spawn OUT OF VIEW — never pop into existence on screen
    { const sdx = x - cam.pos[0], sdz = z - cam.pos[2], sd = Math.hypot(sdx, sdz) || 1;
      if (sd < DRAW_R) { const f = camForward(); if ((sdx*f[0] + sdz*f[2]) / sd > 0.1) continue; } }   // in front of the camera & within draw range → skip
    const g = heightAt(x, z), band = waterLevel - g;
    const ok = (t === "crab" || t === "piper" || t === "hopper") ? (band < 0.2 && band > -3.2) :
               (t === "gull" || t === "heron" || t === "seaduck" || t === "seal") ? (band < 1.5 && band > -8) :
               (band > -0.5 && band < 4);                    // pool / shallow life wants water
    if (!ok) continue;
    spawnCreature(t, x, z, { hx: x, hz: z, hr: 6, timer: rng()*2 }); return true;
  }
  return false;
}
function updateReplenish(dt) {
  _replenishT -= dt; if (_replenishT > 0) return; _replenishT = 18 + rng()*18;
  const now = {}; for (const e of life) if (e.kind === "creature" && !FISH[e.t] && e.dying === undefined) now[e.t] = (now[e.t]||0) + 1;
  for (const t in creatureCensus) if ((now[t]||0) < creatureCensus[t]) { respawnOne(t); break; }   // one per tick, gradual
}
function updateLife(dt, tSec) {
  const px = cam.pos[0], pz = cam.pos[2];
  for (let i = life.length - 1; i >= 0; i--) {
    const e = life[i];
    const dx = e.x - px, dz = e.z - pz, d2 = dx*dx + dz*dz;
    // §urgent5 the dying/fade timeline runs even for distant corpses, so they never linger forever if you walk off
    if (e.dying !== undefined) {
      e.dying += dt;
      if (!e.dropped && e.dying > 0.55) { e.dropped = true; const drop = CREATURE_DROP[e.t];
        if (drop) { const a = (e.deathYaw||0) + 1.57; spawnFind(drop, e.x + Math.cos(a)*0.6, e.z + Math.sin(a)*0.6); } }
      if (e.fade === undefined && e.dying > 1.2 && (e.dying > (e.lingerT || 40) || !creatureOnScreen(e))) e.fade = 0;
      if (e.fade !== undefined) { e.fade += dt / 1.3; if (e.fade >= 1) { queueRespawn(e.t); life.splice(i, 1); } }
      continue;
    }
    if (d2 > UPDATE_R*UPDATE_R) continue;                // sleep distant entities
    const d = Math.sqrt(d2);
    e.phase += dt;
    if (e.kind === "find") continue;
    if (e.hurtT > 0) e.hurtT = Math.max(0, e.hurtT - dt);
    behave(e, dt, d, dx, dz);
    if (e.dead) life.splice(i, 1);                       // §13.3 dried out — removed, remains already dropped

        else if (e.t === "fish") y = (e.poolRim !== undefined ? Math.max(waterLevel, e.poolRim) : waterLevel) - 0.3 + Math.sin(e.phase*4)*0.05;
        else if (e.t === "gull") {                      // §12B flap-and-glide
          const overW = waterDepthAt(e.x, e.z) > 0.4, lowAlt = (e.alt || 0) < 1.5, floating = overW && lowAlt;
          // §gulls height references the SURFACE over water (never the seabed), so a gull never flies through the water and never pops vertically as it descends
          const baseY = overW ? waterSurfaceAt(e.x, e.z) : g;
          y = baseY + (e.alt || 0) + (floating ? 0.1 + Math.sin(e.phase*2)*0.05 : 0.3);
          // §R4 wings folded (no flutter) while settled on the ground/water/perch; a half-open flap during a ground hop; full beats aloft
          const settled = (e.gstate === "forage" || e.gstate === "float" || e.gstate === "perch");
          const amp = settled ? 0 : (e.gstate === "hopflee") ? 0.5 : (e.gstate === "soar" || e.gstate === "approach") ? 0.16 : 0.42;
          // §3 combine the wing-beat flutter + bank (roll about heading) with pitch (nose up/down about the wing line) into one small tilt
          const head = (e.yaw || 0) - 1.57;
          const roll = Math.sin(e.flap || 0) * amp + (e.bank || 0);
          const pit = e.pitch || 0;
          const tx = roll*Math.cos(head) + pit*Math.cos(head + 1.5708), tz = roll*Math.sin(head) + pit*Math.sin(head + 1.5708);
          lean = Math.hypot(tx, tz); ld = Math.atan2(tz, tx);

        else if (e.t === "jelly") sc = e.scale * (0.9 + Math.sin(e.phase*2)*0.1);
        if (e.t === "crab") y = g - (e.burrow || 0) * 0.6;                      // §13.1 sink into the sand (no pop)
        else if (e.t === "anemone") sc = e.scale * (1 - 0.6*e.closed);
        else if (e.t === "seaduck") y = waterSurfaceAt(e.x, e.z) + 0.03 + Math.sin(e.phase*2)*0.03;   // §16.1 bobs on the water
        if (e.t === "star" || e.t === "anemone" || e.t === "urchin" || e.t === "snail" || e.t === "octopus") y += 0.02;
        else if (e.t === "shrimp") y += 0.06;
      } else { y = g + 0.05; lean = 0.2; }
      // §urgent5 death: topple onto its side with a small settle, then lie still (NO shrink; the fade is a dither-dissolve)
      if (e.dying !== undefined) {
        const tp = Math.min(1, e.dying / 0.45);
        lean = 1.5 * (1 - (1-tp)*(1-tp));                                            // ease over onto its side
        if (e.dying > 0.45 && e.dying < 0.95) lean += Math.sin((e.dying-0.45)/0.5*Math.PI) * 0.06;   // a little settle bounce
        ld = e.deathYaw || e.yaw; y = g + 0.04;
      }
      if (e.flop && e.beached) { lean = Math.sin(e.phase * 16) * 0.55; ld = (e.yaw || 0) + 1.5708; }   // §playtest1 a stranded fish/shrimp flops in place
      e._sc = sc;                                          // §urgent5 remember the drawn scale so the fade pass matches it (no pop)
      const o = n*10;
      lifeScratch[o]=e.x; lifeScratch[o+1]=y; lifeScratch[o+2]=e.z;
      lifeScratch[o+3]=sc; lifeScratch[o+4]=e.yaw; lifeScratch[o+5]=lean; lifeScratch[o+6]=ld;
      lifeScratch[o+7]=e.tint[0]; lifeScratch[o+8]=e.tint[1]; lifeScratch[o+9]=e.tint[2];
      if (e.hurtT > 0) { const h = e.hurtT/0.32; lifeScratch[o+7]=e.tint[0]*(1-h)+1.0*h; lifeScratch[o+8]=e.tint[1]*(1-h)+0.3*h; lifeScratch[o+9]=e.tint[2]*(1-h)+0.3*h; }   // §R4 red hurt flash
      if (showAlert && FISH[e.t]) { const al = e.alert || 0; lifeScratch[o+7]=0.3+al*0.7; lifeScratch[o+8]=0.9-al*0.7; lifeScratch[o+9]=0.3; }   // §14C green→red by alertness
      n++;
    }
    reg.dyn.draw(lifeScratch, n);
  };
  for (const k in CREATURES) drawType(k, CREATURES[k], (e) => e.kind === "creature" && e.t === k);
  for (const k in FINDS) drawType(k, FINDS[k], (e) => e.kind === "find" && e.t === k);
  // §urgent5 fade pass: each fading corpse drawn on its own with a dither-dissolve amount (no shrink)
  for (const e of life) {
    if (e.kind !== "creature" || e.fade === undefined) continue;
    const dx = e.x - px, dz = e.z - pz; if (dx*dx + dz*dz > DRAW_R*DRAW_R) continue;
    const reg = CREATURES[e.t]; if (!reg) continue;
    const g = heightAt(e.x, e.z), o = 0;
    lifeScratch[0]=e.x; lifeScratch[1]=g+0.04; lifeScratch[2]=e.z;
    lifeScratch[3]=e._sc || e.scale; lifeScratch[4]=e.yaw; lifeScratch[5]=1.5; lifeScratch[6]=e.deathYaw || e.yaw;

    gl.uniform1f(propU.uDissolve, Math.min(0.98, e.fade));
    reg.dyn.draw(lifeScratch, 1);
  }
  gl.uniform1f(propU.uDissolve, 0);
}

}

function renderInventory() {

  } else {
    const groups = { Finds: [], Food: [], Materials: [], Misc: [] };
    for (let i = 0; i < INV_SLOTS; i++) { const c = Inv.main[i]; if (c) groups[itemCompartment(c.id)].push(i); }
    html = `<div class="ihead"><h2>Satchel</h2>${tabs}<button id="sortBtn">Tidy ▾</button></div>`;

// §16 Make tab: list every revealed recipe, grouped by how you make it.
function renderMakeHTML() {

function invPointerDown(e) {

function maxStamina() { if (!hungerEnabled) return 1; const t = hungerTier(); return t === "starving" ? 0.55 : t === "hungry" ? 0.8 : 1; }
function heavyCostMul() { return 1; }    // §Cooking no extra cost when hungry
function swingRateMul() { return 1; }    // §Cooking no slower swings when hungry
// §tools effort & hunger: labour burns hunger (∝ stamina spent), recovery scales with fullness, and being fed makes heavy jobs land harder
let EFFORT_HUNGER = 0.05;                 // hunger burned per unit of stamina spent on work (sprint/swim/dig/chop/mine/sift); walking spends ~none
function hungerRegenMul() { return hungerEnabled ? 0.55 + 0.75 * Math.max(0, Math.min(1, hunger)) : 1; }   // fuller = faster stamina recovery (0.55×…1.3×)
function jobEffortMul() { if (!hungerEnabled) return 1; const t = hungerTier();   // fed = a few fewer hits to fell/break; hungry = slightly more (never punishing)
  return t === "full" ? 1.5 : t === "peckish" ? 1.0 : 0.85; }
function spendStamina(a, heavy) { stamina = Math.max(0, stamina - a); if (stamina <= 0.001) exhausted = true;
  if (hungerEnabled) hunger = Math.max(0, hunger - a * EFFORT_HUNGER); }   // §tools labour makes you hungrier
function canHeavyAction() { return !exhausted && stamina > 0.02 && digCommit <= 0; }
function rootPlayer() { digCommit = COMMIT_TIME; }              // short wind-up: rooted ~0.5s per strike
function updateHunger(gdt) { if (!hungerEnabled) { hunger = 1; return; }
  hunger = Math.max(0, hunger - HUNGER_DRAIN * gdt);                       // slow passive drain (game-time)
  if (noStarvation && hunger < H_HUNGRY + 0.03) hunger = H_HUNGRY + 0.03;  // §climb no-starvation mode: never drops into the starving tier
  if (hungerTier() === "starving") { growlT -= gdt; if (growlT <= 0) { growlT = 11 + rng()*7; if (onDig) onDig("growl"); } } }
function updateStamina(dt) {
  if (mode !== "walk") { stamina = 1; resting = false; exhausted = false; digCommit = 0; crouching = false; crouchStillT = 0; return; }
  if (digCommit > 0) digCommit = Math.max(0, digCommit - dt);
  const moving = Math.abs(analog.x) + Math.abs(analog.y) > 0.01 || keys["KeyW"] || keys["KeyA"] || keys["KeyS"] || keys["KeyD"];
  if (moving) resting = false;
  const tier = hungerTier();
  // §13.1 sprinting drains fast, and much faster up any incline
  if (player.sprinting) spendStamina(SPRINT_DRAIN * dt * (1 + Math.max(0, player.incline || 0) * 4) * (tier === "hungry" ? 2 : 1));
  if (player.scramble > 0.3) spendStamina(SCRAMBLE_DRAIN * dt * player.scramble);
  // §playtest1 don't regen while actively sprinting — otherwise regen cancels the drain and sprint is effectively infinite
  const regen = player.sprinting ? 0 : (resting ? REGEN_REST : (moving ? REGEN_ACTIVE : REGEN_IDLE)) * hungerRegenMul() * staminaBoostMult();
  const cap = maxStamina();
  stamina = Math.min(cap, stamina + regen * dt);
  if (stamina > cap) stamina = cap;
  if (exhausted && stamina >= Math.min(EXHAUST_RECOVER, cap - 0.02)) exhausted = false;
}

/* ---- water flowing into a fresh hole: a quick foam swirl ---- */
function spawnInflow(x, z) {
  if (onDig) onDig("splash");
  const wy = waterSurfaceAt(x, z);
  for (let i = 0; i < 14 && particles.length < 200; i++) {
    const a = rng() * 6.283, sp = 1.5 + rng() * 2;              // tangential = swirl
    particles.push({ x: x + Math.cos(a) * 1.5, y: wy + 0.1, z: z + Math.sin(a) * 1.5,
      vx: -Math.sin(a) * sp, vy: 0.5 + rng(), vz: Math.cos(a) * sp, t: 0, life: 0.6 + rng() * 0.5, col: [0.9, 0.94, 0.95] });
  }
}

// Live water surface at a point (sea level or an isolated pool's rim), and depth above ground.
const ponded = new Map();          // §10.4: cell index → standing-water level (a hole you poured a bucket into)
function waterSurfaceAt(x, z) {
  const i = cellIndex(x, z); if (i < 0) return waterLevel;
  if (ponded.has(i)) return Math.max(waterLevel, ponded.get(i));   // a filled pond holds its own water
  const inBasin = filled[i] > heightmap[i] + 0.1;
  const rim = (dig[i] < -0.05 && !inBasin) ? -1000 : filled[i];
  return Math.max(waterLevel, rim);
}
function waterDepthAt(x, z) { return waterSurfaceAt(x, z) - surfaceAt(x, z).h; }

// texture updates so water/pathfinding see the new ground
function updateHeightTex(x0, z0, x1, z1) {
  x0 = Math.max(0, x0 | 0); z0 = Math.max(0, z0 | 0); x1 = Math.min(GRID - 1, x1 | 0); z1 = Math.min(GRID - 1, z1 | 0);
  const w = x1 - x0 + 1, h = z1 - z0 + 1; if (w <= 0 || h <= 0) return;
  const buf = new Float32Array(w * h); let p = 0;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) { const i = z * GRID + x; buf[p++] = heightmap[i] + dig[i] + built[i]; }
  gl.bindTexture(gl.TEXTURE_2D, heightTex); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, z0, w, h, gl.RED, gl.FLOAT, buf);
  // Filled DEM: a hole on DRY land fills only to the water table (−1000 → local=waterLevel);
  // a hole inside a real basin/pool keeps the pool's rim so the pool water stays over it.
  const fb = new Float32Array(w * h); p = 0;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    const i = z * GRID + x, inBasin = filled[i] > heightmap[i] + 0.1;
    fb[p++] = ponded.has(i) ? ponded.get(i) : ((dig[i] < -0.05 && !inBasin) ? -1000 : filled[i]);
  }
  gl.bindTexture(gl.TEXTURE_2D, filledTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, z0, w, h, gl.RED, gl.FLOAT, fb);
  // Fresh-dug soil darkening.
  const ff = new Float32Array(w * h); p = 0;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) ff[p++] = fresh[z * GRID + x];
  gl.bindTexture(gl.TEXTURE_2D, freshTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, z0, w, h, gl.RED, gl.FLOAT, ff);
  // Painted material.
  const mf = new Float32Array(w * h); p = 0;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) { const i = z * GRID + x; matField[i] = material[i]; mf[p++] = material[i]; }
  gl.bindTexture(gl.TEXTURE_2D, materialTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, z0, w, h, gl.RED, gl.FLOAT, mf);
}
function rebuildRegion(x0, z0, x1, z1) {
  // rebuild every chunk overlapping the region, once
  const done = new Set();
  for (let cz = 0; cz < CHUNKS; cz++) for (let cx = 0; cx < CHUNKS; cx++) {
    const ch = terrainChunks[cz * CHUNKS + cx];
    if (x1 < ch.x0 || x0 > ch.x1 || z1 < ch.z0 || z0 > ch.z1) continue;
    const c = cz * CHUNKS + cx; if (done.has(c)) continue; done.add(c);
    fillChunkPositions(ch, ch.scratch); gl.bindBuffer(gl.ARRAY_BUFFER, ch.vbo); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ch.scratch);
  }
}

/* ===================================================================== *
 * § TERRAIN API  (Phase 9 Part A)
 *   Every gameplay read/write of the ground goes through Terrain.* so the
 *   heightmap/dig/built/material arrays stay a swappable backend (→ voxels).
 * ===================================================================== */
const Terrain = {
  heightAt,                                                    // effective ground height (base + dig + built)
  normalAt(wx, wz) { const s = surfaceAt(wx, wz); return [s.nx, s.ny, s.nz]; },
  slopeAt(wx, wz) { return surfaceAt(wx, wz).slope; },
  // Painted material if set, else the natural material for this cell.
  materialAt(wx, wz) { const i = cellIndex(wx, wz); if (i < 0) return MAT.NATURAL; return material[i] || defaultMat(i); },
  // March the view ray to the ground; returns the hit point + grid cell.
  raycast(o, d, maxT) { maxT = maxT || 200;
    for (let t = 0.8; t < maxT; t += 0.6) { const x = o[0]+d[0]*t, y = o[1]+d[1]*t, z = o[2]+d[2]*t;
      if (y <= surfaceAt(x, z).h) return { hit: true, x, z, y: surfaceAt(x, z).h, t, i: cellIndex(x, z) }; }
    return { hit: false };
  },
  // Unified edit. layer:"dig" writes the healable offset; layer:"built" writes
  // the permanent player layer. `mat` (optional) paints the surface material.
  edit(x, z, radius, delta, layer, mat) {
    const gcx = (x + HALF) / CELL, gcz = (z + HALF) / CELL, r = radius / CELL;
    const minx = Math.max(0, Math.floor(gcx - r - 1)), maxx = Math.min(GRID-1, Math.ceil(gcx + r + 1));
    const minz = Math.max(0, Math.floor(gcz - r - 1)), maxz = Math.min(GRID-1, Math.ceil(gcz + r + 1));
    const arr = layer === "built" ? built : dig;
    for (let gz = minz; gz <= maxz; gz++) for (let gx = minx; gx <= maxx; gx++) {
      const d2 = Math.hypot(gx - gcx, gz - gcz); if (d2 > r) continue;
      const f = 1 - d2 / r, i = gz * GRID + gx;
      arr[i] += delta * f * f;
      if (layer === "built") { if (built[i] > 0.01) builtCells.add(i); else { built[i] = 0; builtCells.delete(i); } }
      else dugCells.add(i);
      if (mat !== undefined) { material[i] = mat; fresh[i] = Math.max(fresh[i], 0.5); }
    }
    rebuildRegion(minx, minz, maxx, maxz); updateHeightTex(minx, minz, maxx, maxz);
    resnapPropsRegion(x - radius - 2, z - radius - 2, x + radius + 2, z + radius + 2);
  },
};

function surfaceKind(x, z) {
  // Material follows the ORIGINAL ground (base heightmap), so a deep hole's
  // own steep walls never re-classify it as un-diggable "rock".
  const i = cellIndex(x, z);
  if (i >= 0 && material[i] === MAT.STONE && built[i] > 0.05) return "rock";   // placed stone: pickaxe only
  if (i < 0) return "rock";
  const hb = heightmap[i];
  const gx = i % GRID, gz = (i / GRID) | 0;
  let slope = 0;
  if (gx > 0 && gx < GRID - 1 && gz > 0 && gz < GRID - 1) {
    const dhx = (heightmap[i+1] - heightmap[i-1]) / (2 * CELL);
    const dhz = (heightmap[i+GRID] - heightmap[i-GRID]) / (2 * CELL);
    slope = Math.atan(Math.hypot(dhx, dhz));
  }
  if (slope > 0.62 || hb > 34) return "rock";
  if (hb > 20) return "gravel";
  if (surfaceAt(x, z).h < wetLevel + 0.3) return "wet";     // wetness tracks the live surface + tide
  return "dry";
}
// Loot biome (§5): marine wet sand, dry sand/dune, or inland grass/dirt/forest.
const BEACH_MAX_H = 6.5;         // tells and marine loot live at or below this height
function digBiome(x, z) {
  if (surfaceAt(x, z).h < wetLevel + 0.3) return "wet";     // intertidal / wet sand → marine
  if (heightAt(x, z) < BEACH_MAX_H) return "sand";          // dry sand / dunes
  return "inland";                                          // grass / dirt / forest
}
// What a blind strike (or a goat's paw) turns up per biome: mostly raw material, a find only rarely.
const BLIND_LOOT = {
  wet:    { rawChance: 0.28, raw: ["cockle", "shell"],               find: ["seaglass", "clam", "bottle"] },
  sand:   { rawChance: 0.24, raw: ["driftwood", "shell", "cockle"],  find: ["bottle", "coin", "ceramic"] },
  inland: { rawChance: 0.85, raw: ["worm", "root", "flint", "stone"],find: ["bone", "ceramic", "coin"] },
};

// apply a strike's displacement to the offset layer, then push updates
function applyDig(x, z, amount, holeAng) {
  const gcx = (x + HALF) / CELL, gcz = (z + HALF) / CELL, r = DIG_R / CELL;
  const minx = Math.max(0, Math.floor(gcx - r * 2.4)), maxx = Math.min(GRID - 1, Math.ceil(gcx + r * 2.4));
  const minz = Math.max(0, Math.floor(gcz - r * 2.4)), maxz = Math.min(GRID - 1, Math.ceil(gcz + r * 2.4));
  for (let gz = minz; gz <= maxz; gz++) for (let gx = minx; gx <= maxx; gx++) {
    const d = Math.hypot(gx - gcx, gz - gcz), i = gz * GRID + gx;
    if (d < r) { const f = 1 - d / r; dig[i] -= amount * f * f; dugCells.add(i); fresh[i] = 1; }
    else if (d < r * 2.3) {                                // spoil mound on the player's side
      const ang = Math.atan2(gz - gcz, gx - gcx), side = Math.cos(ang - holeAng);
      if (side > 0.2) { dig[i] += amount * 0.45 * side * (1 - (d - r) / (r * 1.3)); dugCells.add(i); fresh[i] = Math.max(fresh[i], 0.8); }
    }
  }
  rebuildRegion(minx, minz, maxx, maxz);
  updateHeightTex(minx, minz, maxx, maxz);
  resnapPropsRegion(x - DIG_R*2.4, z - DIG_R*2.4, x + DIG_R*2.4, z + DIG_R*2.4);
  if (typeof recordDigHole === "function") recordDigHole(x, z);   // §20 rain can pool in this hole
  if (typeof checkUndermine === "function") checkUndermine(x, z);          // dig out a trunk → it topples
  for (let k = stumps.length - 1; k >= 0; k--) if (Math.hypot(stumps[k].x - x, stumps[k].z - z) < DIG_R) { stumps.splice(k, 1); saveWorld(); }  // dug-out stump won't sprout
}
// Push a hole's spoil back into it: both sides relax toward flat.
function fillHole(x, z) {
  const gcx = (x + HALF) / CELL, gcz = (z + HALF) / CELL, r = DIG_R / CELL;
  const minx = Math.max(0, Math.floor(gcx - r*2.4)), maxx = Math.min(GRID-1, Math.ceil(gcx + r*2.4));
  const minz = Math.max(0, Math.floor(gcz - r*2.4)), maxz = Math.min(GRID-1, Math.ceil(gcz + r*2.4));
  for (let gz = minz; gz <= maxz; gz++) for (let gx = minx; gx <= maxx; gx++) {
    const i = gz*GRID+gx; if (Math.hypot(gx-gcx, gz-gcz) > r*2.3 || Math.abs(dig[i]) < 0.01) continue;
    dig[i] *= 0.45; if (Math.abs(dig[i]) < 0.02) dig[i] = 0; dugCells.add(i);   // keep healing until fresh fades (and any grass scar restores)
    fresh[i] = Math.max(fresh[i], 0.6);
  }
  rebuildRegion(minx, minz, maxx, maxz); updateHeightTex(minx, minz, maxx, maxz);
  resnapPropsRegion(x - DIG_R*2.4, z - DIG_R*2.4, x + DIG_R*2.4, z + DIG_R*2.4);
}

// The island heals itself: holes and spoil relax toward flat (fast under the
// tide, slower on dry sand, slowest on grass) and fresh soil fades back.
function healDig(gdt) {
  if (!dugCells.size) return;
  let minx = 1e9, minz = 1e9, maxx = -1e9, maxz = -1e9, any = false;
  for (const i of dugCells) {
    const gx = i % GRID, gz = (i / GRID) | 0;
    const submerged = waterLevel > heightmap[i] + 0.2;
    const rate = (submerged ? 0.6 : heightmap[i] > 12 ? 0.006 : 0.02) * healMul;
    dig[i] *= Math.max(0, 1 - rate * gdt);
    fresh[i] = Math.max(0, fresh[i] - (submerged ? 0.09 : 0.03) * healMul * gdt);
    if (Math.abs(dig[i]) < 0.02 && fresh[i] < 0.02) { dig[i] = 0; fresh[i] = 0; dugCells.delete(i);
      if (digScar.has(i)) { material[i] = digScar.get(i) === MAT.NATURAL ? MAT.NATURAL : MAT.GRASS; digScar.delete(i); }   // surface has healed: the grass is back
    }
    any = true; if (gx < minx) minx = gx; if (gx > maxx) maxx = gx; if (gz < minz) minz = gz; if (gz > maxz) maxz = gz;
  }
  if (any) { rebuildRegion(minx, minz, maxx, maxz); updateHeightTex(minx, minz, maxx, maxz); }
}

/* ---- dig spots & tells (seeded loot table) ---- */
let digSpots = [];
let ODDITY_ITEM = null, ODDITY_NAME = "";
function pick(a) { return a[(rng() * a.length) | 0]; }
/* ---- low-tide set pieces (§B): a stone fish weir + a drowned forest ---- */
let setPieces = { weir: [], drowned: [], weirDyn: null, drownedDyn: null };
function findShoreBand(targetH, tol) {
  tol = tol || 1.3;
  for (let k = 0; k < 3000; k++) { const a = rng()*6.283, r = HALF*(0.34 + rng()*0.5), x = Math.sin(a)*r, z = -Math.cos(a)*r;
    if (Math.abs(heightAt(x, z) - targetH) < tol && surfaceAt(x, z).slope < 0.4 && !nearPOI(x, z, 8)) return { x, z }; }
  return null;
}
function seedSetPieces() {
  setPieces.weir = []; setPieces.drowned = [];
  // fish weir: an arc of stones sitting low, bared by a falling tide
  const wc = findShoreBand(-TIDE_RANGE * 0.3);
  if (wc) { const facing = Math.atan2(-wc.z, -wc.x);                 // toward the island centre
    for (let i = 0; i < 18; i++) { const t = i/17, ang = facing + Math.PI + (t - 0.5) * 1.9, R = 11;
      setPieces.weir.push({ x: wc.x + Math.cos(ang)*R, z: wc.z + Math.sin(ang)*R, s: 0.8 + rng()*0.5, yaw: rng()*6.283 }); } }
  // drowned forest: a cluster of old stumps even lower, only minus tides clear them
  const dc = findShoreBand(-TIDE_RANGE * 0.16);
  if (dc) for (let i = 0; i < 12; i++) { const a = rng()*6.283, r = rng()*15;
    setPieces.drowned.push({ x: dc.x + Math.cos(a)*r, z: dc.z + Math.sin(a)*r, s: 0.7 + rng()*0.7, yaw: rng()*6.283 }); }
}
function drawSetPieces(view) {
  if (!setPieces.weir.length && !setPieces.drowned.length) return;
  if (setPieces.weir.length && !setPieces.weirDyn) setPieces.weirDyn = makeDynamic(boulderMesh(), 40);
  if (setPieces.drowned.length && !setPieces.drownedDyn) setPieces.drownedDyn = makeDynamic(stumpMesh(), 40);
  propUniforms(view);
  const a = rockScratch; let n = 0;
  for (const s of setPieces.weir) { if (n >= 40) break; const dx = s.x-cam.pos[0], dz = s.z-cam.pos[2]; if (dx*dx+dz*dz > DRAW_R*DRAW_R) continue;
    const o = n*10, y = heightAt(s.x, s.z); a[o]=s.x;a[o+1]=y;a[o+2]=s.z;a[o+3]=s.s;a[o+4]=s.yaw;a[o+5]=0;a[o+6]=0;a[o+7]=0.5;a[o+8]=0.5;a[o+9]=0.53; n++; }
  if (n) setPieces.weirDyn.draw(a, n);
  n = 0;
  for (const s of setPieces.drowned) { if (n >= 40) break; const dx = s.x-cam.pos[0], dz = s.z-cam.pos[2]; if (dx*dx+dz*dz > DRAW_R*DRAW_R) continue;
    const o = n*10, y = heightAt(s.x, s.z); a[o]=s.x;a[o+1]=y;a[o+2]=s.z;a[o+3]=s.s;a[o+4]=s.yaw;a[o+5]=0;a[o+6]=0;a[o+7]=0.3;a[o+8]=0.27;a[o+9]=0.2; n++; }
  if (n) setPieces.drownedDyn.draw(a, n);
}

function seedDigSpots() {
  digSpots = [];
  if (!ODDITY_ITEM) { ODDITY_ITEM = pick(["bell", "tin", "fossil"]); ODDITY_NAME = latinName(); }
  const n = 140 + (rng() * 70 | 0);   // many attempts; most land off the beach and are skipped
  for (let k = 0; k < n; k++) {
    const a = rng() * 6.283, r = HALF * (0.3 + rng() * 0.64), x = Math.sin(a) * r, z = -Math.cos(a) * r;
    const h = heightAt(x, z), s = surfaceAt(x, z).slope, ci = cellIndex(x, z);
    if (h < 0.5 || h > BEACH_MAX_H || s > 0.4 || bigPropBlocking(x, z, 1.5)) continue;   // tells live on the beach only; never where roots block
    if (rng() > COAST_BIOMES[coastBiomeAt(x, z)].tell) continue;                         // §C: dig-tell frequency per biome
    if (ci >= 0 && filled[ci] - heightmap[ci] > KNEE) continue;                 // never at the bottom of a permanently-deep pool
    const roll = rng();
    let item, band, tell, needed;
    if (roll < 0.55) { item = pick(["clam", "cockle", "shell", "molt", "seaglass", "sanddollar", "limpet", "worm"]); band = 1; needed = 2; tell = rng() < 0.2 ? "gull" : "show"; }
    else if (roll < 0.85) { item = pick(["bottle", "ceramic", "coin"]); band = 2; needed = 3; tell = "show"; }   // §urgent2 removed the "bubble" (swash-bubbles) tell
    else { item = pick(["fossil", "bell", "tin"]); band = 3; needed = 5; tell = "dry"; }
    digSpots.push({ x, z, item, band, needed, tell, strikes: 0, revealed: false,
                    razor: item === "clam" && rng() < 0.4, lastStrike: -99, pecked: 0 });
  }
  // 1 island oddity, buried deep under a dry patch (retry until a valid spot is found)
  if (ODDITY_ITEM) {
    for (let t = 0; t < 24; t++) {
      const a = rng() * 6.283, r = HALF * (0.25 + rng() * 0.5), x = Math.sin(a) * r, z = -Math.cos(a) * r;
      const h = heightAt(x, z);
      if (h > 1 && h < BEACH_MAX_H && surfaceAt(x, z).slope < 0.4 && !bigPropBlocking(x, z, 1.5)) {
        digSpots.push({ x, z, item: ODDITY_ITEM, band: 3, needed: 6, tell: "dry", strikes: 0, revealed: false, razor: false, lastStrike: -99, special: true });
        break;
      }
    }
  }
}
function nearestSpot(x, z, maxd) { let best = null, bd = maxd; for (const s of digSpots) { if (s.revealed) continue; const d = Math.hypot(s.x - x, s.z - z); if (d < bd) { bd = d; best = s; } } return best; }
// A tamed goat paws the ground. On the beach it exposes an existing buried spot;
// inland (where there are no tells) it sniffs out a fresh one from the LOCAL biome.
function goatPaw(g) {
  g.pawT = 2.5; if (onGoat) onGoat("paw");
  const s = nearestSpot(g.x, g.z, 7); if (s) { s.goatTell = clock.t + 8; return; }

/* ===================================================================== *
 * § 17  FARMING — forage wild tropical plants, or plant seeds on dug soil
 * ===================================================================== */
let crops = [];     // { type, x, z, ripe, ripeAt, scale, yaw, wild, grown }
const CROP_GROW_DAYS = 2.5;     // in-game days for a planted seed to first ripen (tunable)
const CROP_REGROW_DAYS = 2;     // days to re-ripen after a harvest — crops are perennial (tunable)
const CROP_TYPES = ["cassava", "banana", "pineapple", "taro"];
// where each wild crop likes to grow (a height band + max slope)
const CROP_HAB = {
  cassava:   { lo: 8, hi: 30, slope: 0.4 },
  banana:    { lo: 4, hi: 20, slope: 0.35 },
  pineapple: { lo: 3, hi: 16, slope: 0.4 },
  taro:      { lo: 2, hi: 12, slope: 0.3 },     // low, damp ground
};
function seedWildCrops() {
  crops = [];
  for (const type of CROP_TYPES) { const hab = CROP_HAB[type];
    for (let i = 0; i < 46; i++) {
      const a = rng()*6.283, r = HALF*(0.12 + rng()*0.6), x = Math.sin(a)*r, z = -Math.cos(a)*r;
      const s = surfaceAt(x, z); if (s.h < hab.lo || s.h > hab.hi || s.slope > hab.slope) continue;
      if (waterDepthAt(x, z) > 0.05 || bigPropBlocking(x, z, 1.2) || nearPOI(x, z, 1)) continue;
      if (crops.some(c => Math.hypot(c.x-x, c.z-z) < 3.5)) continue;
      if (rng() < 0.55) crops.push({ type, x, z, ripe: true, ripeAt: 0, scale: 1.15 + rng()*0.4, yaw: rng()*6.28, wild: true, grown: true });
    }
  }

  if (!c.ripe) { showCard("Not ripe yet", "Give it another day or two to grow."); return; }
  const food = c.type, n = 1 + (rng()*2|0);

  let got = ITEMS[food].name + " ×" + n;

  c.ripe = false; c.ripeAt = clock.t + CROP_REGROW_DAYS * DAY_PERIOD;
  sparkle(c.x, surfaceAt(c.x, c.z).h + 0.6, c.z, [0.6, 0.5, 0.2], 7); if (onDig) onDig("pluck");

/* ===================================================================== *

/* ---- chopping ---- */

          pot: c.pot ? { ingredients: c.pot.ing || [], water: !!c.pot.w, salt: !!c.pot.s, cooking: c.pot.ck ? 1 : 0, t: c.pot.t || 0, done: !!c.pot.d, dish: c.pot.dish || null } : null });

      if (scrambleTarget > 0.35 && (exhausted || stamina < 0.03)) sm = 0;
      const depth = waterLevel - here.h;
      let surfMul = 1;
      if (depth > 0.05) surfMul = Math.max(0.25, 1 - depth * 0.45); // deeper wading, slower
      else if (here.h < 12) surfMul = 0.9;                          // soft sand
      const speed = WALK_SPEED * (player.sprinting ? SPRINT : 1) * (crouching ? CROUCH_SPEED : 1) * sm * surfMul * (player.landStun > 0 ? 0.5 : 1) * matSpeedMul(Terrain.materialAt(player.x, player.z));
      const dist = speed * dt;
      // Simple, robust movement: slide X and Z independently (so you glide along walls), blocking only
      // deep water or a near-vertical rise per frame (prevents climbing cliff faces without snagging on bumps).
      const h0 = here.h, maxRise = dist * 3 + 0.65;
      let nx = player.x, nz = player.z;
      const WADE_INTO = SWIM_START + 0.7;   // §14A let wading carry you past the swim threshold so swimming kicks in
      const sX = surfaceAt(player.x + wx*dist, player.z);
      if (waterLevel - sX.h <= WADE_INTO && sX.h - h0 <= maxRise) nx = player.x + wx*dist;
      const sZ = surfaceAt(nx, player.z + wz*dist);
      if (waterLevel - sZ.h <= WADE_INTO && sZ.h - h0 <= maxRise) nz = player.z + wz*dist;
      [nx, nz] = slideCircles(nx, nz);
      player.x = nx; player.z = nz;
      player.bob += dist * (player.sprinting ? 0.6 : 1);   // §playtest1 sprinting = longer strides → the bob (and head-bob) advances slower
      const stepLen = scrambleTarget > 0.5 ? 1.5 : player.sprinting ? 1.7 : 1.15;   // §playtest1 fewer, longer footfalls while sprinting
      if (player.bob - _stepPhase >= stepLen) {
        _stepPhase = player.bob;
        if (onFootstep) onFootstep(surfaceType(here.h, here.slope), scrambleTarget > 0.5 ? 1 : (player.sprinting ? 0.9 : 0.55));
      }
    }
    player.scramble += (scrambleTarget - player.scramble) * Math.min(1, dt * 4);
    if (player.landStun > 0) player.landStun = Math.max(0, player.landStun - dt);
    const g = surfaceAt(player.x, player.z);
    const standH = Math.max(g.h, trunkHeightAt(player.x, player.z));   // stand on a fallen trunk (or terrain)
    // coyote window + buffered jump
    player.coyote = player.airborne ? Math.max(0, player.coyote - dt) : COYOTE_TIME;
    if (jumpBufferT > 0) jumpBufferT -= dt;
    if (jumpBufferT > 0 && canJumpNow()) doJump();
    // §P1 fixed-timestep vertical sim (feetY is the single owner of player Y); render interpolates between steps
    physAcc += dt; let nSteps = 0;
    while (physAcc >= PHYS_STEP && nSteps < 5) { player.prevFeetY = player.feetY; stepVertical(standH, g); physAcc -= PHYS_STEP; nSteps++; }
    if (physAcc > PHYS_STEP) physAcc = PHYS_STEP;   // clamp (tab was hidden / big hitch) — avoids spiral of death
    if (Math.abs(player.feetY - player.prevFeetY) > 3) player.prevFeetY = player.feetY;   // a teleport happened (respawn/climb) — don't interpolate across it
    const alpha = Math.min(1, physAcc / PHYS_STEP);
    // §urgent7 each effect is individually disableable; "raw camera" (camFx.raw) turns them all off at once.
    const renderFeetY = camFxOn("interp") ? (player.prevFeetY + (player.feetY - player.prevFeetY) * alpha) : player.feetY;   // render interpolation
    // camera = interpolated feet + eye + additive camera-only offsets (bob, crouch/rest, landing dip) — none touch feetY
    const moving = wl > 0.01 ? 1 : 0;
    player.walkLen = moving ? Math.min(1, wl) : 0;              // §R4 feeds the first-person tool's walk bob
    const amp = (0.06 + (player.sprinting ? 0.05 : 0) + player.scramble * 0.07) * moving;
    const bobOff = camFxOn("bob") ? Math.sin(player.bob * (player.scramble > 0.3 ? 1.7 : 2.6)) * amp : 0;   // head bob
    const sitTarget = camFxOn("crouch") ? (resting ? -0.8 : (crouching ? -CROUCH_DROP : 0)) : 0;   // §13.4 crouch / rest dip

    else camSit = sitTarget;
    player.eyeY = renderFeetY + EYE + camSit;                            // stable gameplay eye (rays, lantern, spear)
    const landDip = camFxOn("landDip") ? camYOff : 0;                   // landing dip / give
    cam.pos[0] = player.x; cam.pos[1] = player.eyeY + bobOff + landDip; cam.pos[2] = player.z;   // + visual bob + landing give
    if (dbgYGraph) { recordY(renderFeetY, cam.pos[1], player.airborne); drawYGraph(); }    // §P1
    if (critDbg) drawCritDebug();                                                          // §R4 creature AI overlay
   }
  }

  if (mode === "walk") { updateBreath(dt); updateSacks(dt); updateDeepVisitor(dt); updateSpear(dt); updateFishing(dt); updateCatchCine(dt); }   // §14A/B/C + §Fishing

  // ---- matrices ----
  let f = camForward();
  const breathe = (resting || stamina < 0.35) ? Math.sin(t * 1.6) * (resting ? 0.03 : (0.35 - stamina) * 0.11) : 0;

  drawCottageDecor(view);      // §19F/§19G reward decorations + cobwebs that clear as it gets cosy
  drawSalt(view);
  drawLife(view);
  drawGulls(view);
  drawFlotsam(view);   // §5 floating debris on the water surface (drawn before the transparent water)
  drawTells(view, dt);
  drawFlipStones(view);   // §21 flippable stones + their damp patches
  drawHeaveBoulders(view);   // §21D heavy boulders (and their bared ground)
  drawOysterBeds(view);   // §23 oyster beds on the intertidal flats
  drawDigCellDebug(view);   // §urgent3 dig-cell state overlay (debug)
  drawPlaceGhost(view);
  drawParticles(view);
  drawRain(view);       // §20 rain streaks, rings on water, dug-hole puddles
  drawGlints(view);     // §18 shiny finds wink in lantern light at night
  drawPlankton(view);   // §14B drifting marine snow / bioluminescence, underwater only
  drawDeepVisitor(view);   // §14B a large silhouette far off in the deep
  drawThrownSpears(view);  // §14C spears stuck in the ground / sinking

  gl.uniform3fv(waterU.uHorizon, SKY.horizon);

  // §14A breath arc — outside the stamina ring, only while submerged

  } else bArc.style.display = "none";

    document.querySelectorAll('.mBtn[data-act="swimup"], .mBtn[data-act="swimdown"]').forEach(b => { if (b.style.display !== sw) b.style.display = sw; });
    const cb = document.querySelector('.mBtn[data-act="climb"]');   // §15 climb button when grabbable or climbing
    if (cb) { const show = (mode === "walk" && (player.climbing || (!player.swimming && !!climbTargetInFront()))) ? "flex" : "none"; if (cb.style.display !== show) cb.style.display = show; } }
  document.getElementById("hotbar").style.display = (mode === "walk") ? "flex" : "none";
  // interaction indicator: a dot that becomes a soft-pulsing ring over anything in reach (§11.2)

    curTarget = targetAlongRay(rayFromNDC(0, 0), curTarget);
    const info = aimInfo();
    // §13.2 Tool Kit Auto: pick the right tool from what we're aiming at, before any click
    if (selectedItem() === "toolkit" && toolkit.mode === "auto" && !workLockActive()) {
      const need = info && (info.need === "axe" || info.need === "pickaxe" || info.need === "shovel") ? info.need : null;

      if (IS_TOUCH && info.obj) {                        // mobile: the ring floats over the object
        const sp = projectToScreen(info.x, surfaceAt(info.x, info.z).h + 0.8, info.z);
        if (sp) { crossEl.style.left = sp[0] + "px"; crossEl.style.top = sp[1] + "px"; crossEl.style.display = "block"; } else crossEl.style.display = "none";
      } else if (IS_TOUCH) { crossEl.style.display = "none"; }
      else { crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = "block"; }

    } else {

    else { promptEl.style.display = "none"; promptEl.style.color = ""; promptEl.style.opacity = ""; }

        + (IS_TOUCH ? "" : " · R turn · Esc cancel");
      promptEl.style.display = "block"; promptEl.style.color = (buildGhost.show && !buildGhost.valid) ? "#ffbda6" : "#bfe6a6"; promptEl.style.opacity = "";
      crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = IS_TOUCH ? "none" : "block"; crossEl.className = "";
    } else if (tooTiredT <= 0 && hintT <= 0 && !info) {

        promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = "";

      promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = "";
      crossEl.className = "ring"; crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = IS_TOUCH ? "none" : "block";
    }
    if (!buildMode && curTarget && curTarget.kind === "heaveboulder") {   // §21D heavy-boulder tooltip
      promptEl.textContent = heaveBoulderPrompt(curTarget.obj);
      promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = "";
      crossEl.className = "ring"; crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = IS_TOUCH ? "none" : "block";
    }
    if (!buildMode && curTarget && curTarget.kind === "oysterbed") {   // §23 oyster-bed tooltip
      promptEl.textContent = oysterBedPrompt(curTarget.obj);
      promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = "";
      crossEl.className = "ring"; crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = IS_TOUCH ? "none" : "block";
    }
    if (!buildMode && curTarget && (curTarget.kind === "dispslot" || curTarget.kind === "cottrophy" || curTarget.kind === "aqua")) {   // §19C–E cottage tooltip overrides the generic prompt
      promptEl.textContent = curTarget.kind === "dispslot" ? displaySlotPrompt(curTarget.obj) : curTarget.kind === "cottrophy" ? trophyPrompt(curTarget.obj) : aquaPrompt();
      promptEl.style.display = "block"; promptEl.style.color = ""; promptEl.style.opacity = "";
      crossEl.className = "ring"; crossEl.style.left = "50%"; crossEl.style.top = "50%"; crossEl.style.display = IS_TOUCH ? "none" : "block";
    }
  } else { promptEl.style.display = "none"; crossEl.className = ""; crossEl.style.display = "none"; curTarget = null; }
  const titleUp = (mode === "preview" || mode === "intro");       // hide in-world readouts behind the title
  hud.style.display = titleUp ? "none" : "block";
  const helpEl = document.getElementById("help"); if (helpEl) helpEl.style.display = titleUp ? "none" : "";
  const tc = document.getElementById("tidecurve"); if (tc) tc.style.display = titleUp ? "none" : "";
  const ti = tideInfo();
  const mins = Math.floor(ti.tToLow / 60), secs = Math.floor(ti.tToLow % 60);
  if (!titleUp) hud.textContent =
    `seed ${SEED_STR}  ·  ${archetype}\n` +
    `tide ${ti.rising ? "▲ rising" : "▼ falling"}${ti.minusNow ? " ·· MINUS" : ""}  ·  low in ${mins}:${String(secs).padStart(2, "0")}` +
    `${clock.speed > 1 ? `  (${clock.speed}×)` : ""}${clock.paused ? "  (paused)" : ""}\n` +
    `mode ${mode}  ·  POIs ${POIS.map((p) => p.type).join(", ")}`;
  if (mode === "walk") drawTideCurve();
  updateBucketPanel();
  updateBucketLook();
  updateInspectView();
  drawFishHUD();                       // §Fishing line, bobber marker, reel gauge, fish-signs (2D overlay)
  updateFireHud();                     // §Cooking compact readout while looking at a campfire

  if (debugOn) {
    dbgEl.style.display = "block";
    dbgEl.textContent =
      `fps   ${fpsSmooth.toFixed(0)}\n` +
      `draws ${frameDraws}\n` +
      `tris  ${(frameTris / 1000).toFixed(0)}k\n` +
      `res   ${fbo.w}x${fbo.h}\n` +
      `pos   ${cam.pos[0].toFixed(0)}, ${cam.pos[1].toFixed(0)}, ${cam.pos[2].toFixed(0)}\n` +
      `slope ${_curSlopeDeg.toFixed(0)}°  spd ×${_curSpeedMul.toFixed(2)}${player.sprinting ? " sprint" : ""}\n` +
      `audio ${SND.ctx ? SND.ctx.state : "not started"}${SND.muted ? " muted" : ""}  vox ${SND.ctx ? SND.activeVoices() : 0}\n` +
      `  bus m${SND.vol.master.toFixed(2)} s${SND.vol.sfx.toFixed(2)} a${SND.vol.ambience.toFixed(2)} u${SND.vol.ui.toFixed(2)}\n` +
      `fish  ${rod.state}${rod.fish ? " " + rod.fish.species + (rod.fish.weight ? " " + rod.fish.weight + "kg" : "") : ""}${rod.fight ? " p" + rod.fight.progress.toFixed(2) + " t" + rod.fight.tension.toFixed(2) + " s" + rod.fight.strain.toFixed(2) : ""}  ${fishForceBite ? "[forceBite]" : ""}${fishOddsLog ? "[odds]" : ""}`;
  } else if (dbgEl.style.display !== "none") {
    dbgEl.style.display = "none";
  }

  requestAnimationFrame(frame);
}
booted = true;
wireSound();   // §Sound assign every audio hook now that the on* vars are declared
requestAnimationFrame(frame);
</script>
</body>
</html>
